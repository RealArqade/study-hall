      // ---------- state ----------
      var currentCourse = null;
      var mode = "quiz";
      var activeUnits = {};

      var quizPhase = "setup"; // setup | active | complete
      var session = []; // array of {u,q,c,a,ex, shuffledChoices, correctIdx}
      var qi = 0, score = 0, streak = 0, misses = [];

      var fcList = [];
      var fci = 0, flipped = false;

      var SESSION_SIZE = 12;

      // ---------- helpers ----------
      function shuffle(arr){
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function unitLabel(id){
        if (!currentCourse) return id;
        for (var i=0;i<currentCourse.units.length;i++){ if (currentCourse.units[i].id===id) return currentCourse.units[i].label; }
        return id;
      }
      function unitColorFor(id){
        if (!currentCourse) return "var(--accent)";
        if (currentCourse.slug === "chemistry") return "var(--" + id + ")";
        var unit = currentCourse.units.filter(function(u){ return u.id === id; })[0];
        if (!unit) return "var(--accent)";
        return "var(--p" + ((unit.num - 1) % 9) + ")";
      }
      function filteredList(list){
        return list.filter(function(item){ return activeUnits[item.u]; });
      }
      function safeGet(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
      function safeSet(key,val){ try { localStorage.setItem(key,val); } catch(e){} }
      function findCourse(slug){ return COURSES.filter(function(c){ return c.slug === slug; })[0] || null; }

      // ---------- homepage ----------
      var homeView = document.getElementById("homeView");
      var courseViewEl = document.getElementById("courseView");
      var courseGrid = document.getElementById("courseGrid");

      function renderHome(){
        courseGrid.innerHTML = "";
        COURSES.forEach(function(c){
          var card = document.createElement("a");
          card.href = "#/" + c.slug;
          card.className = "course-card";
          card.style.setProperty("--cc", c.homeColor);
          card.innerHTML =
            '<div class="cc-eyebrow">' + c.short + '</div>' +
            '<h2>' + c.name + '</h2>' +
            '<p>' + c.homeDesc + '</p>' +
            '<div class="cc-stats"><span><b>' + c.questions.length + '</b> questions</span><span><b>' + c.flashcards.length + '</b> flashcards</span>' +
            (c.teaching ? '<span><b>' + c.teaching.length + '</b> lessons</span>' : '') + '</div>';
          courseGrid.appendChild(card);
        });
      }
      renderHome();

      function showHome(){
        currentCourse = null;
        homeView.hidden = false;
        courseViewEl.hidden = true;
        document.title = "Study Hall";
      }

      // ---------- chip row (shared by all modes) ----------
      var chipRow = document.getElementById("chipRow");
      function onUnitsChanged(){
        if (mode === "cards") { buildFlashcardDeck(); renderFlashcard(); }
        if (mode === "learn") { renderLearn(); }
        if (mode === "quiz" && quizPhase === "setup") { renderSetup(); }
        renderSegmentButtons();
      }
      function renderChips(){
        chipRow.innerHTML = "";
        currentCourse.units.forEach(function(u){
          var chip = document.createElement("button");
          chip.className = "chip";
          chip.style.setProperty("--dot", unitColorFor(u.id));
          chip.setAttribute("aria-pressed", activeUnits[u.id] ? "true" : "false");
          chip.innerHTML = '<span class="dot"></span>' + u.num + '. ' + u.label;
          chip.addEventListener("click", function(){
            var willBeActive = !activeUnits[u.id];
            // prevent deselecting the last active chip
            var activeCount = currentCourse.units.filter(function(x){return activeUnits[x.id];}).length;
            if (!willBeActive && activeCount <= 1) return;
            activeUnits[u.id] = willBeActive;
            chip.setAttribute("aria-pressed", willBeActive ? "true" : "false");
            onUnitsChanged();
          });
          chipRow.appendChild(chip);
        });
      }

      // ---------- exam segment quick-select ----------
      var segmentRow = document.getElementById("segmentRow");
      function selectOnly(unitIds){
        currentCourse.units.forEach(function(u){ activeUnits[u.id] = unitIds.indexOf(u.id) !== -1; });
        renderChips();
        onUnitsChanged();
      }
      function renderSegmentButtons(){
        segmentRow.innerHTML = "";
        currentCourse.segments.forEach(function(seg){
          var btn = document.createElement("button");
          btn.className = "segment-btn";
          btn.textContent = seg.label;
          btn.addEventListener("click", function(){ selectOnly(seg.units); });
          segmentRow.appendChild(btn);
        });
        var allBtn = document.createElement("button");
        allBtn.className = "segment-btn all";
        allBtn.textContent = "All Units";
        allBtn.addEventListener("click", function(){ selectOnly(currentCourse.units.map(function(u){return u.id;})); });
        segmentRow.appendChild(allBtn);
      }

      // ---------- course loading ----------
      var courseTitleEl = document.getElementById("courseTitle");
      var courseTaglineEl = document.getElementById("courseTagline");
      var courseBadgeEl = document.getElementById("courseBadge");
      var courseFooterEl = document.getElementById("courseFooter");

      function loadCourse(course, m){
        currentCourse = course;
        activeUnits = {}; course.units.forEach(function(u){ activeUnits[u.id] = true; });
        quizPhase = "setup"; session = []; qi = 0; score = 0; streak = 0; misses = [];
        fcList = []; fci = 0; flipped = false;

        homeView.hidden = true;
        courseViewEl.hidden = false;
        courseTitleEl.textContent = course.slug === "chemistry" ? "Valence Lab" : course.name;
        courseTaglineEl.textContent = course.tagline;
        courseBadgeEl.textContent = course.short + " · UTHS";
        courseFooterEl.textContent = course.name + " · built from the real course module list";
        document.title = course.name + " – Study Hall";

        modeLearnBtn.hidden = !course.teaching;

        renderChips();
        renderSegmentButtons();
        setMode(m && (m === "quiz" || m === "cards" || (m === "learn" && course.teaching)) ? m : "quiz", false);
      }

      // ---------- router ----------
      function parseHash(){
        var h = location.hash.replace(/^#\/?/, "");
        return h.split("/").filter(Boolean);
      }
      function router(){
        var parts = parseHash();
        if (parts.length === 0) { showHome(); return; }
        var course = findCourse(parts[0]);
        if (!course) { location.hash = ""; return; }
        var m = parts[1] || "quiz";
        if (currentCourse === course) { setMode(m, false); }
        else { loadCourse(course, m); }
      }
      window.addEventListener("hashchange", router);

      // ---------- mode switching ----------
      var modeQuizBtn = document.getElementById("modeQuizBtn");
      var modeCardsBtn = document.getElementById("modeCardsBtn");
      var modeLearnBtn = document.getElementById("modeLearnBtn");
      var quizView = document.getElementById("quizView");
      var cardsView = document.getElementById("cardsView");
      var learnView = document.getElementById("learnView");

      function setMode(m, updateHash){
        mode = m;
        modeQuizBtn.setAttribute("aria-pressed", m === "quiz" ? "true" : "false");
        modeCardsBtn.setAttribute("aria-pressed", m === "cards" ? "true" : "false");
        modeLearnBtn.setAttribute("aria-pressed", m === "learn" ? "true" : "false");
        quizView.hidden = m !== "quiz";
        cardsView.hidden = m !== "cards";
        learnView.hidden = m !== "learn";
        if (m === "quiz" && quizPhase === "setup") { renderSetup(); }
        if (m === "cards" && fcList.length === 0) { buildFlashcardDeck(); renderFlashcard(); }
        if (m === "learn") { renderLearn(); }
        if (updateHash !== false && currentCourse) { location.hash = "#/" + currentCourse.slug + "/" + m; }
      }
      modeQuizBtn.addEventListener("click", function(){ setMode("quiz"); });
      modeCardsBtn.addEventListener("click", function(){ setMode("cards"); });
      modeLearnBtn.addEventListener("click", function(){ setMode("learn"); });

      // ================= QUIZ =================
      var quizSetup = document.getElementById("quizSetup");
      var quizActive = document.getElementById("quizActive");
      var quizSummary = document.getElementById("quizSummary");

      var statProgress = document.getElementById("statProgress");
      var statScore = document.getElementById("statScore");
      var statStreak = document.getElementById("statStreak");
      var progressFill = document.getElementById("progressFill");
      var qTag = document.getElementById("qTag");
      var qText = document.getElementById("qText");
      var qChoices = document.getElementById("qChoices");
      var qFeedback = document.getElementById("qFeedback");
      var qVerdict = document.getElementById("qVerdict");
      var qEx = document.getElementById("qEx");
      var nextBtn = document.getElementById("nextBtn");

      function bestScoreKey(){ return "studyhall_best_" + currentCourse.slug; }

      function renderSetup(){
        var pool = filteredList(currentCourse.questions).length;
        var best = safeGet(bestScoreKey());
        quizSetup.innerHTML =
          '<div class="setup-card">' +
            '<h2 style="font-size:22px;">Ready to drill?</h2>' +
            '<p>' + pool + ' question' + (pool===1?"":"s") + ' available from your selected units. Each round pulls a fresh random set of up to ' + SESSION_SIZE + '.</p>' +
            '<button class="btn btn-primary" id="startBtn" style="width:100%;">Start Quiz</button>' +
            (best ? '<div class="best">Best score: ' + best + '</div>' : '') +
          '</div>';
        document.getElementById("startBtn").addEventListener("click", startQuiz);
      }

      function startQuiz(){
        var pool = shuffle(filteredList(currentCourse.questions)).slice(0, SESSION_SIZE);
        session = pool.map(function(item){
          var order = shuffle([0,1,2,3]);
          var choices = order.map(function(i){ return item.c[i]; });
          var correctIdx = order.indexOf(item.a);
          return {u:item.u, q:item.q, ex:item.ex, choices:choices, correctIdx:correctIdx};
        });
        qi = 0; score = 0; streak = 0; misses = [];
        quizPhase = "active";
        quizSetup.hidden = true; quizSummary.hidden = true; quizActive.hidden = false;
        renderQuestion();
      }

      function renderQuestion(){
        var item = session[qi];
        qTag.textContent = unitLabel(item.u);
        qTag.style.setProperty("--ut", unitColorFor(item.u));
        qText.textContent = item.q;
        statProgress.textContent = (qi+1) + "/" + session.length;
        statScore.textContent = score;
        statStreak.textContent = streak;
        progressFill.style.width = (qi / session.length * 100) + "%";

        qChoices.innerHTML = "";
        var letters = ["A","B","C","D"];
        item.choices.forEach(function(choiceText, idx){
          var btn = document.createElement("button");
          btn.className = "choice";
          btn.innerHTML = '<span class="idx">' + letters[idx] + '</span>' + choiceText;
          btn.addEventListener("click", function(){ answerQuestion(idx); });
          qChoices.appendChild(btn);
        });
        qFeedback.hidden = true;
      }

      function answerQuestion(idx){
        var item = session[qi];
        var buttons = qChoices.querySelectorAll(".choice");
        buttons.forEach(function(b, i){
          b.disabled = true;
          if (i === item.correctIdx) b.classList.add("correct");
          else if (i === idx) b.classList.add("wrong");
          else b.classList.add("dim");
        });

        var correct = idx === item.correctIdx;
        if (correct) { score++; streak++; }
        else { streak = 0; misses.push(item); }

        statScore.textContent = score;
        statStreak.textContent = streak;
        progressFill.style.width = ((qi+1) / session.length * 100) + "%";

        qVerdict.textContent = correct ? "Correct" : "Not quite";
        qVerdict.className = "verdict " + (correct ? "good" : "bad");
        qEx.textContent = item.ex;
        qFeedback.hidden = false;
        nextBtn.textContent = (qi === session.length - 1) ? "See results →" : "Next →";
      }

      nextBtn.addEventListener("click", function(){
        qi++;
        if (qi >= session.length) { finishQuiz(); }
        else { renderQuestion(); }
      });

      function finishQuiz(){
        quizPhase = "complete";
        quizActive.hidden = true;
        quizSummary.hidden = false;

        var best = parseInt(safeGet(bestScoreKey()) || "0", 10);
        var pct = Math.round(score / session.length * 100);
        if (score > best) safeSet(bestScoreKey(), String(score));

        var missHtml = misses.length ? misses.map(function(m){
          return '<div class="miss-item"><div class="mq">' + m.q + '</div><div class="ma">Correct answer: <b>' + m.choices[m.correctIdx] + '</b></div></div>';
        }).join("") : '<div class="miss-item">Perfect round — no misses. 🔥</div>';

        quizSummary.innerHTML =
          '<div class="summary-card">' +
            '<h2 style="text-align:center; font-size:22px; margin-bottom:10px;">Round Complete</h2>' +
            '<div class="summary-score">' + score + '<span>/' + session.length + '</span></div>' +
            '<div class="summary-note">' + pct + '% correct · best streak this round contributes to your total</div>' +
            '<div class="miss-list">' + missHtml + '</div>' +
            '<div class="summary-actions">' +
              '<button class="btn btn-ghost" id="reviewMissBtn">Change Units</button>' +
              '<button class="btn btn-primary" id="restartBtn">New Round</button>' +
            '</div>' +
          '</div>';

        document.getElementById("restartBtn").addEventListener("click", startQuiz);
        document.getElementById("reviewMissBtn").addEventListener("click", function(){
          quizPhase = "setup";
          quizSummary.hidden = true;
          quizSetup.hidden = false;
          renderSetup();
        });
      }

      document.addEventListener("keydown", function(e){
        if (mode !== "quiz" || quizPhase !== "active") return;
        if (!qFeedback.hidden) {
          if (e.key === "Enter") nextBtn.click();
          return;
        }
        var n = parseInt(e.key, 10);
        if (n >= 1 && n <= 4) {
          var btns = qChoices.querySelectorAll(".choice");
          if (btns[n-1] && !btns[n-1].disabled) btns[n-1].click();
        }
      });

      // ================= FLASHCARDS =================
      var fcCounter = document.getElementById("fcCounter");
      var fcCard = document.getElementById("fcCard");
      var fcTerm = document.getElementById("fcTerm");
      var fcDef = document.getElementById("fcDef");
      var fcCornerFront = document.getElementById("fcCornerFront");
      var fcCornerBack = document.getElementById("fcCornerBack");
      var fcPrev = document.getElementById("fcPrev");
      var fcNext = document.getElementById("fcNext");
      var fcFlip = document.getElementById("fcFlip");
      var fcShuffle = document.getElementById("fcShuffle");
      var fcSortNum = document.getElementById("fcSortNum");

      function buildFlashcardDeck(){
        fcList = filteredList(currentCourse.flashcards);
        if (fci >= fcList.length) fci = 0;
        flipped = false;
      }

      function renderFlashcard(){
        if (fcList.length === 0) {
          fcCounter.textContent = "0 / 0";
          fcTerm.textContent = "No cards";
          fcDef.textContent = "Select at least one unit above.";
          return;
        }
        var card = fcList[fci];
        fcCounter.textContent = (fci+1) + " / " + fcList.length;
        fcTerm.textContent = card.t;
        fcDef.textContent = card.d;
        var num = String(fci+1).padStart(2,"0");
        fcCornerFront.textContent = num;
        fcCornerBack.textContent = num;
        fcCard.style.setProperty("--ut", unitColorFor(card.u));
        fcCard.classList.toggle("flipped", flipped);
      }

      fcCard.addEventListener("click", function(){ flipped = !flipped; renderFlashcard(); });
      fcFlip.addEventListener("click", function(){ flipped = !flipped; renderFlashcard(); });
      fcPrev.addEventListener("click", function(){
        if (fcList.length === 0) return;
        fci = (fci - 1 + fcList.length) % fcList.length; flipped = false; renderFlashcard();
      });
      fcNext.addEventListener("click", function(){
        if (fcList.length === 0) return;
        fci = (fci + 1) % fcList.length; flipped = false; renderFlashcard();
      });
      fcShuffle.addEventListener("click", function(){
        fcList = shuffle(fcList); fci = 0; flipped = false; renderFlashcard();
      });
      // "Sort #" restores the deck's natural order — unit number ascending, then authored order within a unit.
      // Sorts by unit # first, then restores each card's original authored position
      // within its unit (not wherever a prior shuffle left it).
      fcSortNum.addEventListener("click", function(){
        var numByUnit = {}; currentCourse.units.forEach(function(u){ numByUnit[u.id] = u.num; });
        var authoredIdx = {}; currentCourse.flashcards.forEach(function(card, i){ authoredIdx[card.t] = i; });
        var withIdx = fcList.map(function(card){ return {card:card, i: authoredIdx[card.t]}; });
        withIdx.sort(function(a,b){
          var na = numByUnit[a.card.u] || 0, nb = numByUnit[b.card.u] || 0;
          if (na !== nb) return na - nb;
          return a.i - b.i;
        });
        fcList = withIdx.map(function(x){ return x.card; });
        fci = 0; flipped = false; renderFlashcard();
      });

      document.addEventListener("keydown", function(e){
        if (mode !== "cards") return;
        if (e.key === "ArrowLeft") fcPrev.click();
        else if (e.key === "ArrowRight") fcNext.click();
        else if (e.key === " " || e.key === "Enter") { e.preventDefault(); fcFlip.click(); }
      });

      // ================= LEARN =================
      var learnCount = document.getElementById("learnCount");
      var learnList = document.getElementById("learnList");

      function segmentForUnit(uid){
        for (var i=0;i<currentCourse.segments.length;i++){
          if (currentCourse.segments[i].units.indexOf(uid) !== -1) return currentCourse.segments[i];
        }
        return null; // e.g. "ures" — not tied to a six-weeks exam
      }

      function renderLearn(){
        if (!currentCourse.teaching) { learnCount.textContent = ""; learnList.innerHTML = ""; return; }
        var modules = filteredList(currentCourse.teaching);
        learnCount.textContent = modules.length + " teaching module" + (modules.length===1?"":"s");
        learnList.innerHTML = "";

        if (modules.length === 0) {
          learnList.innerHTML = '<div class="setup-card"><p style="margin:0;">Select at least one unit above to see its lessons.</p></div>';
          return;
        }

        // group modules by lesson, preserving original order
        var groups = [];
        var groupByKey = {};
        modules.forEach(function(mod){
          var key = mod.u + "|" + mod.lesson;
          if (!groupByKey[key]) {
            groupByKey[key] = { u: mod.u, lesson: mod.lesson, items: [] };
            groups.push(groupByKey[key]);
          }
          groupByKey[key].items.push(mod);
        });

        // bucket lesson-groups by which six-weeks exam period they fall under,
        // preserving segment order (1st Six Weeks → 2nd Six Weeks → Final), with
        // units not tied to an exam (like Sig Figs & Notation) collected last.
        var segBuckets = currentCourse.segments.map(function(seg){ return { id: seg.id, label: seg.label, groups: [] }; });
        var resBucket = { id: "res", label: "Study Resources", groups: [] };
        groups.forEach(function(group){
          var seg = segmentForUnit(group.u);
          var bucket = seg ? segBuckets.filter(function(b){ return b.id === seg.id; })[0] : resBucket;
          bucket.groups.push(group);
        });
        var buckets = segBuckets.concat([resBucket]).filter(function(b){ return b.groups.length > 0; });

        buckets.forEach(function(bucket){
          var heading = document.createElement("div");
          heading.className = "segment-heading";
          heading.textContent = bucket.label;
          learnList.appendChild(heading);

          bucket.groups.forEach(function(group){
            var details = document.createElement("details");
            details.className = "lesson-group";
            details.style.setProperty("--ul", unitColorFor(group.u));

            var summary = document.createElement("summary");
            summary.innerHTML =
              '<span class="unit-pill">' + unitLabel(group.u) + '</span>' +
              '<span>' + group.lesson + '</span>' +
              '<span class="arrow">▶</span>';
            details.appendChild(summary);

            var body = document.createElement("div");
            body.className = "lesson-body";
            group.items.forEach(function(mod, i){
              var card = document.createElement("div");
              card.className = "module-card";
              card.innerHTML =
                '<div class="mc-title"><span class="mc-idx">' + (i+1) + '.</span><span>' + mod.title + '</span></div>' +
                '<div class="mc-body">' + mod.body + '</div>';
              body.appendChild(card);
            });
            details.appendChild(body);
            learnList.appendChild(details);
          });
        });
      }

      // ---------- hot reload state (viewers with the page open keep their spot) ----------
      function snapshot(){
        return { hash: location.hash, activeUnits:activeUnits, quizPhase:quizPhase, score:score, streak:streak, qi:qi, fci:fci };
      }
      function boot(data){
        if (data && data.hash) { location.hash = data.hash; }
        router();
      }
      try {
        if (window.claude && window.claude.hot) {
          window.claude.hot.snapshot(snapshot);
          window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
        } else { boot({}); }
      } catch(e) { boot({}); }
    })();
    </script>
  </body>
</html>
