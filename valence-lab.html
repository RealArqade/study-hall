<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hall</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

      :root{
        --bg:#eef2f1;
        --surface:#ffffff;
        --surface-2:#e3ebe9;
        --ink:#16211f;
        --ink-dim:#4b5b58;
        --accent:#1f7a6c;
        --accent-2:#b5772b;
        --good:#2f9e58;
        --bad:#c1443a;
        --border:#cfd9d6;
        --u1:#1f7a6c; --u2:#b5772b; --u3:#c1443a; --u4:#3457a6; --u5:#7a4fae; --u6:#8a6d1f; --ures:#5b6b68;
        --p0:#1f7a6c; --p1:#b5772b; --p2:#c1443a; --p3:#3457a6; --p4:#7a4fae; --p5:#8a6d1f; --p6:#5b6b68; --p7:#2e7d32; --p8:#ad1457;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark){
        :root:not([data-theme="light"]){
          --bg:#0e1614; --surface:#16211f; --surface-2:#1c2b28;
          --ink:#eaf3f0; --ink-dim:#9db3ae;
          --accent:#4fd3b8; --accent-2:#f0975a;
          --good:#57c97c; --bad:#e2685c; --border:#27423c;
          --u1:#4fd3b8; --u2:#f0975a; --u3:#e2685c; --u4:#7d9ce8; --u5:#b48ce0; --u6:#d9b25c; --ures:#9db3ae;
          --p0:#4fd3b8; --p1:#f0975a; --p2:#e2685c; --p3:#7d9ce8; --p4:#b48ce0; --p5:#d9b25c; --p6:#9db3ae; --p7:#6fcf73; --p8:#f06292;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"]{
        --bg:#0e1614; --surface:#16211f; --surface-2:#1c2b28;
        --ink:#eaf3f0; --ink-dim:#9db3ae;
        --accent:#4fd3b8; --accent-2:#f0975a;
        --good:#57c97c; --bad:#e2685c; --border:#27423c;
        --u1:#4fd3b8; --u2:#f0975a; --u3:#e2685c; --u4:#7d9ce8; --u5:#b48ce0; --u6:#d9b25c; --ures:#9db3ae;
        --p0:#4fd3b8; --p1:#f0975a; --p2:#e2685c; --p3:#7d9ce8; --p4:#b48ce0; --p5:#d9b25c; --p6:#9db3ae; --p7:#6fcf73; --p8:#f06292;
        color-scheme: dark;
      }

      *{box-sizing:border-box;}
      body{
        background:var(--bg);
        color:var(--ink);
        font-family:'IBM Plex Sans', system-ui, sans-serif;
        padding-inline:16px;
        padding-bottom:40px;
      }
      .wrap{max-width:720px; margin:0 auto;}

      h1,h2,h3{font-family:'Big Shoulders Display', system-ui, sans-serif; text-transform:uppercase; letter-spacing:.02em; text-wrap:balance; margin:0;}
      .mono{font-family:'IBM Plex Mono', monospace;}

      header.top{
        position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
        background:var(--bg);
        padding-top:20px; padding-bottom:12px;
        border-bottom:1px solid var(--border);
      }
      .brand{display:flex; align-items:baseline; gap:10px; margin-bottom:4px; flex-wrap:wrap;}
      .brand-badge{
        font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
        color:var(--accent); border:1px solid var(--accent); border-radius:4px;
        padding:2px 6px; letter-spacing:.08em;
      }
      .home-link{
        font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600;
        color:var(--ink-dim); text-decoration:none; padding:2px 0;
      }
      .home-link:hover{color:var(--accent);}
      h1{font-size:clamp(28px,7vw,38px); font-weight:800; color:var(--ink); line-height:.95;}
      .tagline{color:var(--ink-dim); font-size:13.5px; margin-top:4px;}

      /* ---- homepage ---- */
      .home-header{padding-top:20px; padding-bottom:8px;}
      .home-header .brand-badge{margin-bottom:10px; display:inline-block;}
      .course-grid{
        display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
        gap:12px; padding-bottom:40px;
      }
      .course-card{
        display:block; text-align:left; background:var(--surface); border:1px solid var(--border);
        border-radius:16px; padding:18px 18px 16px; cursor:pointer; text-decoration:none;
        border-top:4px solid var(--cc, var(--accent)); transition:transform .12s, border-color .15s;
      }
      .course-card:hover{transform:translateY(-2px);}
      .course-card .cc-eyebrow{
        font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600; text-transform:uppercase;
        letter-spacing:.07em; color:var(--cc, var(--accent));
      }
      .course-card h2{
        font-size:21px; font-weight:800; color:var(--ink); line-height:1.05; margin:4px 0 8px;
        text-transform:uppercase; letter-spacing:.01em;
      }
      .course-card p{color:var(--ink-dim); font-size:12.5px; line-height:1.5; margin:0 0 12px;}
      .course-card .cc-stats{
        display:flex; gap:14px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-dim);
        font-variant-numeric:tabular-nums; border-top:1px dashed var(--border); padding-top:10px;
      }
      .course-card .cc-stats b{color:var(--ink); font-weight:600;}

      .mode-row{display:flex; gap:8px; margin-top:16px;}
      .mode-btn{
        flex:1; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
        background:var(--surface); color:var(--ink-dim); font-weight:600; font-size:13.5px;
        cursor:pointer; transition:background .15s, color .15s, border-color .15s;
      }
      .mode-btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface);}

      .segment-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px;}
      .segment-btn{
        padding:6px 11px; border-radius:7px; border:1px solid var(--border); background:transparent;
        color:var(--ink-dim); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
        cursor:pointer; transition:background .15s,border-color .15s,color .15s;
      }
      .segment-btn:hover{border-color:var(--accent); color:var(--ink);}
      .segment-btn.all{margin-left:auto;}

      .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
      .chip{
        display:inline-flex; align-items:center; gap:6px;
        padding:5px 10px 5px 8px; border-radius:100px; border:1px solid var(--border);
        background:var(--surface); color:var(--ink-dim); font-size:12.5px; font-weight:600;
        cursor:pointer; user-select:none; transition:background .15s,border-color .15s,color .15s;
      }
      .chip .dot{width:8px; height:8px; border-radius:50%; background:var(--dot,var(--ink-dim)); flex-shrink:0;}
      .chip[aria-pressed="true"]{background:var(--surface-2); border-color:var(--dot,var(--accent)); color:var(--ink);}
      .chip[aria-pressed="false"]{opacity:.55;}

      main{padding-top:20px;}

      /* ---- stat tiles ---- */
      .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px;}
      .stat{
        background:var(--surface); border:1px solid var(--border); border-radius:10px;
        padding:10px 12px; text-align:center;
      }
      .stat .v{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:20px; font-weight:600; color:var(--ink);}
      .stat .l{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}

      .progress-track{height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; margin-bottom:18px;}
      .progress-fill{height:100%; background:var(--accent); border-radius:3px; transition:width .25s ease;}

      /* ---- setup panel ---- */
      .setup-card{
        background:var(--surface); border:1px solid var(--border); border-radius:16px;
        padding:24px 20px; text-align:center;
      }
      .setup-card p{color:var(--ink-dim); font-size:14px; line-height:1.5; margin:8px 0 18px;}
      .best{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-dim); margin-top:14px;}

      .btn{
        appearance:none; border:none; border-radius:9px; cursor:pointer;
        font-family:'IBM Plex Sans'; font-weight:700; font-size:14.5px;
        padding:13px 20px; transition:transform .1s, filter .15s;
      }
      .btn:active{transform:scale(.98);}
      .btn-primary{background:var(--accent); color:var(--surface);}
      .btn-primary:hover{filter:brightness(1.08);}
      .btn-ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}

      /* ---- quiz card ---- */
      .q-card{
        background:var(--surface); border:1px solid var(--border); border-radius:16px;
        padding:22px 20px;
      }
      .q-tag{
        display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
        letter-spacing:.06em; text-transform:uppercase; color:var(--surface);
        background:var(--ut,var(--accent)); padding:3px 9px; border-radius:5px; margin-bottom:12px;
      }
      .q-text{font-size:18px; font-weight:600; line-height:1.4; margin-bottom:18px;}

      .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
      @media (max-width:460px){ .choices{grid-template-columns:1fr;} }

      .choice{
        position:relative; text-align:left; background:var(--surface-2); border:1.5px solid var(--border);
        border-radius:10px; padding:12px 12px 12px 34px; font-size:14px; font-weight:500; color:var(--ink);
        cursor:pointer; transition:border-color .15s, background .15s;
      }
      .choice:hover:not(:disabled){border-color:var(--accent);}
      .choice .idx{
        position:absolute; left:8px; top:8px; width:18px; height:18px; border-radius:4px;
        background:var(--surface); border:1px solid var(--border); color:var(--ink-dim);
        font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;
        display:flex; align-items:center; justify-content:center;
      }
      .choice:disabled{cursor:default;}
      .choice.correct{background:color-mix(in srgb, var(--good) 18%, var(--surface)); border-color:var(--good);}
      .choice.correct .idx{background:var(--good); color:var(--surface); border-color:var(--good);}
      .choice.wrong{background:color-mix(in srgb, var(--bad) 16%, var(--surface)); border-color:var(--bad);}
      .choice.wrong .idx{background:var(--bad); color:var(--surface); border-color:var(--bad);}
      .choice.dim{opacity:.5;}

      .feedback{margin-top:16px; padding-top:14px; border-top:1px dashed var(--border);}
      .feedback .verdict{font-weight:700; font-size:14px; margin-bottom:4px;}
      .feedback .verdict.good{color:var(--good);}
      .feedback .verdict.bad{color:var(--bad);}
      .feedback .ex{color:var(--ink-dim); font-size:13.5px; line-height:1.5;}
      .feedback .next-row{margin-top:14px; display:flex; justify-content:flex-end;}

      /* ---- summary ---- */
      .summary-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px 20px;}
      .summary-score{font-family:'IBM Plex Mono',monospace; font-size:44px; font-weight:600; text-align:center; color:var(--accent); font-variant-numeric:tabular-nums;}
      .summary-score span{font-size:20px; color:var(--ink-dim);}
      .summary-note{text-align:center; color:var(--ink-dim); font-size:13.5px; margin-top:4px; margin-bottom:20px;}
      .miss-list{display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
      .miss-item{background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:13px;}
      .miss-item .mq{font-weight:600; margin-bottom:3px;}
      .miss-item .ma{color:var(--ink-dim);}
      .miss-item .ma b{color:var(--good);}
      .summary-actions{display:flex; gap:10px;}
      .summary-actions .btn{flex:1;}

      /* ---- flashcards ---- */
      .fc-wrap{display:flex; flex-direction:column; align-items:center;}
      .fc-counter{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-dim); margin-bottom:10px;}
      .fc-stage{width:100%; perspective:1200px; margin-bottom:16px;}
      .fc-card{
        position:relative; width:100%; min-height:230px; border-radius:18px; cursor:pointer;
        transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1);
      }
      .fc-card.flipped{transform:rotateY(180deg);}
      @media (prefers-reduced-motion:reduce){ .fc-card{transition:none;} }
      .fc-face{
        position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
        border:1.5px solid var(--border); background:var(--surface);
        display:flex; flex-direction:column; justify-content:center; align-items:center;
        text-align:center; padding:28px 22px;
      }
      .fc-face .corner{
        position:absolute; top:14px; left:16px; font-family:'IBM Plex Mono',monospace;
        font-size:11px; font-weight:600; color:var(--ut,var(--accent));
      }
      .fc-face .side-label{
        position:absolute; top:14px; right:16px; font-size:10px; letter-spacing:.1em;
        text-transform:uppercase; color:var(--ink-dim); font-weight:600;
      }
      .fc-face.front{border-top:5px solid var(--ut,var(--accent));}
      .fc-face.back{transform:rotateY(180deg); border-top:5px solid var(--ut,var(--accent));}
      .fc-term{font-family:'Big Shoulders Display'; font-weight:800; font-size:clamp(22px,6vw,30px); text-transform:uppercase; text-wrap:balance;}
      .fc-def{font-size:15px; line-height:1.55; color:var(--ink);}
      .fc-hint{position:absolute; bottom:12px; font-size:11px; color:var(--ink-dim);}

      .fc-controls{display:flex; align-items:center; gap:10px; width:100%;}
      .fc-controls .btn-ghost{padding:11px 16px;}
      .fc-nav{flex:1; display:flex; gap:8px;}
      .fc-nav .btn{flex:1;}

      /* ---- learn tab ---- */
      .learn-count{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-dim); margin-bottom:14px;}
      .segment-heading{
        font-family:'Big Shoulders Display', system-ui, sans-serif; font-weight:700; text-transform:uppercase;
        letter-spacing:.04em; font-size:15px; color:var(--ink-dim);
        margin:22px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--border);
      }
      .segment-heading:first-child{margin-top:0;}
      .lesson-group{background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
      .lesson-group summary{
        list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px;
        font-weight:700; font-size:13.5px; border-left:4px solid var(--ul,var(--accent));
      }
      .lesson-group summary::-webkit-details-marker{display:none;}
      .lesson-group summary .arrow{margin-left:auto; color:var(--ink-dim); font-size:11px; transition:transform .15s;}
      .lesson-group[open] summary .arrow{transform:rotate(90deg);}
      .lesson-group summary .unit-pill{
        font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; text-transform:uppercase;
        letter-spacing:.05em; color:var(--surface); background:var(--ul,var(--accent)); padding:2px 7px; border-radius:4px;
      }
      .lesson-body{padding:0 16px 14px; display:flex; flex-direction:column; gap:12px;}
      .module-card{border-top:1px dashed var(--border); padding-top:12px;}
      .module-card .mc-title{font-weight:700; font-size:14px; margin-bottom:4px; display:flex; gap:8px; align-items:baseline;}
      .module-card .mc-title .mc-idx{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ul,var(--accent)); font-weight:600;}
      .module-card .mc-body{font-size:13.5px; line-height:1.55; color:var(--ink-dim);}

      footer{margin-top:32px; text-align:center; color:var(--ink-dim); font-size:11.5px;}
      footer .mono{opacity:.8;}

      [hidden]{display:none !important;}
    </style>
  </head>
  <body>

    <div class="wrap">

      <section id="homeView">
        <header class="home-header">
          <span class="brand-badge">UTHS · 2026/27</span>
          <h1>Study Hall</h1>
          <p class="tagline">Pick a class to start drilling quizzes and flashcards.</p>
        </header>
        <div class="course-grid" id="courseGrid"></div>
      </section>

      <div id="courseView" hidden>
        <header class="top">
          <div class="brand">
            <a href="#/" class="home-link">← All Classes</a>
            <span class="brand-badge" id="courseBadge">UTHS · 2026/27</span>
          </div>
          <h1 id="courseTitle">Valence Lab</h1>
          <p class="tagline" id="courseTagline"></p>

          <div class="mode-row" role="tablist" id="modeRow">
            <button class="mode-btn" id="modeQuizBtn" role="tab" aria-pressed="true">Quiz</button>
            <button class="mode-btn" id="modeCardsBtn" role="tab" aria-pressed="false">Flashcards</button>
            <button class="mode-btn" id="modeLearnBtn" role="tab" aria-pressed="false">Learn</button>
          </div>

          <div class="segment-row" id="segmentRow" aria-label="Jump to exam segment"></div>
          <div class="chip-row" id="chipRow" aria-label="Filter by unit"></div>
        </header>

      <main>
        <section id="quizView">
          <div id="quizSetup"></div>
          <div id="quizActive" hidden>
            <div class="stats">
              <div class="stat"><div class="v mono" id="statProgress">1/12</div><div class="l">Question</div></div>
              <div class="stat"><div class="v mono" id="statScore">0</div><div class="l">Correct</div></div>
              <div class="stat"><div class="v mono" id="statStreak">0</div><div class="l">Streak</div></div>
            </div>
            <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <div class="q-card">
              <span class="q-tag" id="qTag">Unit</span>
              <div class="q-text" id="qText"></div>
              <div class="choices" id="qChoices"></div>
              <div class="feedback" id="qFeedback" hidden>
                <div class="verdict" id="qVerdict"></div>
                <div class="ex" id="qEx"></div>
                <div class="next-row"><button class="btn btn-primary" id="nextBtn">Next →</button></div>
              </div>
            </div>
          </div>
          <div id="quizSummary" hidden></div>
        </section>

        <section id="cardsView" hidden>
          <div class="fc-wrap">
            <div class="fc-counter mono" id="fcCounter">1 / 40</div>
            <div class="fc-stage">
              <div class="fc-card" id="fcCard">
                <div class="fc-face front">
                  <span class="corner mono" id="fcCornerFront">01</span>
                  <span class="side-label">Term</span>
                  <div class="fc-term" id="fcTerm"></div>
                  <span class="fc-hint">tap to flip</span>
                </div>
                <div class="fc-face back">
                  <span class="corner mono" id="fcCornerBack">01</span>
                  <span class="side-label">Definition</span>
                  <div class="fc-def" id="fcDef"></div>
                  <span class="fc-hint">tap to flip back</span>
                </div>
              </div>
            </div>
            <div class="fc-controls">
              <button class="btn btn-ghost" id="fcPrev" aria-label="Previous card">←</button>
              <div class="fc-nav">
                <button class="btn btn-primary" id="fcFlip">Flip</button>
                <button class="btn btn-ghost" id="fcShuffle">Shuffle</button>
                <button class="btn btn-ghost" id="fcSortNum" title="Sort by unit number">Sort #</button>
              </div>
              <button class="btn btn-ghost" id="fcNext" aria-label="Next card">→</button>
            </div>
          </div>
        </section>

        <section id="learnView" hidden>
          <div class="learn-count mono" id="learnCount">0 modules</div>
          <div id="learnList"></div>
        </section>

        <footer>
          <div class="mono" id="courseFooter">Built from the real course module list</div>
        </footer>
      </main>
      </div>

    </div>

    <script>
    (function(){
      "use strict";

      var CHEM_UNITS = [
        {id:"u1", label:"Atomic Structure", num:1},
        {id:"u2", label:"Atomic Theory", num:2},
        {id:"u3", label:"Nuclear Chemistry", num:3},
        {id:"u4", label:"Atomic Bonding", num:4},
        {id:"u5", label:"The Mole", num:5},
        {id:"u6", label:"Mission Review", num:6},
        {id:"ures", label:"Sig Figs & Notation", num:7}
      ];

      var CHEM_SEGMENTS = [
        {id:"seg1", label:"1st Six Weeks", units:["u1","u2"]},
        {id:"seg2", label:"2nd Six Weeks", units:["u3","u4"]},
        {id:"seg3", label:"Final Exam", units:["u5","u6"]}
      ];

      var CHEM_QUESTIONS = [
        // Unit 1: Atomic Structure
        {u:"u1", q:"What subatomic particle determines an element's identity?", c:["Neutrons","Protons","Electrons","Ions"], a:1, ex:"The number of protons (the atomic number) is unique to each element."},
        {u:"u1", q:"Elements in the same column of the periodic table are called a...", c:["Period","Series","Group (family)","Isotope set"], a:2, ex:"Columns share the same number of valence electrons and similar chemical properties."},
        {u:"u1", q:"Which family sits in Group 18 and is famous for being nearly unreactive?", c:["Alkali metals","Halogens","Noble gases","Transition metals"], a:2, ex:"A full outer shell makes noble gases chemically stable."},
        {u:"u1", q:"Which family reacts violently with water and includes lithium, sodium, and potassium?", c:["Alkaline earth metals","Alkali metals","Halogens","Lanthanides"], a:1, ex:"Alkali metals (Group 1) have one loosely-held valence electron, making them highly reactive."},
        {u:"u1", q:"Which scientist arranged the first widely-used periodic table by increasing atomic mass, leaving gaps for undiscovered elements?", c:["Henry Moseley","John Dalton","Dmitri Mendeleev","J.J. Thomson"], a:2, ex:"Mendeleev's 1869 table even predicted properties of elements not yet discovered."},
        {u:"u1", q:"Whose X-ray experiments showed elements should be ordered by atomic number instead of atomic mass?", c:["Ernest Rutherford","Henry Moseley","Niels Bohr","Marie Curie"], a:1, ex:"Moseley's work in 1913 fixed several ordering problems in Mendeleev's table."},
        {u:"u1", q:"An atom that has lost or gained electrons, giving it a charge, is called a(n)...", c:["Isotope","Nucleon","Ion","Allotrope"], a:2, ex:"Losing electrons makes a cation (+); gaining electrons makes an anion (−)."},
        {u:"u1", q:"Atoms of the same element with different numbers of neutrons are called...", c:["Ions","Isomers","Isotopes","Isobars"], a:2, ex:"Isotopes have the same atomic number but different mass numbers."},
        {u:"u1", q:"An atom has 17 protons and 18 neutrons. What is its mass number?", c:["17","18","35","1"], a:2, ex:"Mass number = protons + neutrons = 17 + 18 = 35."},
        {u:"u1", q:"A neutral atom that gains an extra electron becomes a(n)...", c:["Cation","Anion","Isotope","Proton"], a:1, ex:"The extra electron gives the atom a negative charge — an anion."},
        {u:"u1", q:"The decimal value listed under an element's symbol on the periodic table (like 35.45 for Cl) is its...", c:["Mass number","Atomic number","Average atomic mass","Oxidation number"], a:2, ex:"It's the weighted average of the masses of all naturally-occurring isotopes."},
        {u:"u1", q:"Which region of the periodic table contains elements with properties of both metals and nonmetals?", c:["Alkali metals","Noble gases","Metalloids (staircase)","Lanthanides"], a:2, ex:"Metalloids like silicon and boron border the zig-zag 'staircase' line."},
        {u:"u1", q:"Neutrons carry what electric charge?", c:["Positive","Negative","Neutral","Variable"], a:2, ex:"Neutrons have no charge — they add mass without affecting an atom's charge."},
        {u:"u1", q:"Protons carry what electric charge?", c:["Positive","Negative","Neutral","Variable"], a:0, ex:"Protons are positively charged and balance the negative electrons in a neutral atom."},
        {u:"u1", q:"Where are protons and neutrons located in an atom?", c:["Electron cloud","Nucleus","Valence shell","Orbital"], a:1, ex:"Both nucleons pack tightly into the small, dense nucleus at the atom's center."},
        {u:"u1", q:"Which family is known for forming colorful salts and includes fluorine and chlorine?", c:["Noble gases","Halogens","Alkali metals","Transition metals"], a:1, ex:"Halogens (Group 17) need just one more electron to fill their valence shell, making them highly reactive nonmetals."},
        {u:"u1", q:"Which family sits in Group 2 and includes magnesium and calcium?", c:["Alkali metals","Alkaline earth metals","Halogens","Noble gases"], a:1, ex:"Alkaline earth metals have two valence electrons, making them reactive but less so than Group 1 alkali metals."},
        {u:"u1", q:"Where are the transition metals located on the periodic table?", c:["Groups 1–2","Groups 3–12","Groups 13–18","The bottom two rows only"], a:1, ex:"Transition metals fill the central block, between the alkaline earth metals and the boron family."},
        {u:"u1", q:"The lanthanides and actinides — often shown as two rows pulled out at the bottom of the table — belong to which block?", c:["s-block","p-block","d-block","f-block"], a:3, ex:"These inner transition metals fill f orbitals and are set apart from the main table purely for formatting convenience."},
        {u:"u1", q:"By convention, an element's symbol is written with...", c:["All capital letters","A capital first letter and lowercase second letter","All lowercase letters","No fixed rule"], a:1, ex:"Na (sodium) and Cl (chlorine) follow this rule — only the first letter is capitalized."},
        {u:"u1", q:"Which of these elements naturally exists as a diatomic molecule (two atoms bonded together), not as a lone atom?", c:["Helium (He)","Oxygen (O2)","Sodium (Na)","Iron (Fe)"], a:1, ex:"Seven elements — H2, N2, O2, F2, Cl2, Br2, and I2 — are found as diatomic molecules in their natural state."},
        {u:"u1", q:"Which property is NOT typical of metals?", c:["Malleable (can be hammered into sheets)","Ductile (can be drawn into wire)","Brittle as a solid","Good conductor of electricity"], a:2, ex:"Brittleness is a nonmetal trait — metals are known for being flexible and workable, not brittle."},
        {u:"u1", q:"Which property is typical of nonmetals?", c:["High luster (shininess)","Good electrical conductivity","Brittle in solid form","High ductility"], a:2, ex:"Solid nonmetals tend to be dull and shatter easily rather than bend."},
        {u:"u1", q:"Silicon, a metalloid, is especially important in industry because it acts as a...", c:["Superconductor","Semiconductor","Insulator only","Radioactive tracer"], a:1, ex:"Silicon conducts electricity only under certain conditions, which is exactly the behavior needed for computer chips."},
        {u:"u1", q:"Which ancient Greek philosopher first proposed that matter is made of indivisible particles called 'atomos'?", c:["Aristotle","Democritus","Pythagoras","Archimedes"], a:1, ex:"Democritus's idea (~400 BCE) was philosophical, not experimental, but it gave us the word 'atom.'"},
        {u:"u1", q:"Which scientist's Law of Conservation of Mass helped establish the foundation for modern chemistry?", c:["Antoine Lavoisier","John Dalton","Marie Curie","Dmitri Mendeleev"], a:0, ex:"Lavoisier showed that mass is neither created nor destroyed in a chemical reaction, a cornerstone of chemistry."},
        {u:"u1", q:"J.J. Thomson's cathode ray tube experiments led directly to the discovery of the...", c:["Proton","Neutron","Electron","Nucleus"], a:2, ex:"Thomson measured the charge-to-mass ratio of the particles in the beam, identifying them as electrons."},
        {u:"u1", q:"The atomic mass unit (amu) is defined as exactly...", c:["The mass of one proton","1/12 the mass of a carbon-12 atom","The mass of one electron","1/6 the mass of an oxygen-16 atom"], a:1, ex:"Carbon-12 was chosen as the universal reference point for atomic mass."},
        {u:"u1", q:"In isotope notation like ¹⁴₆C, which number represents the mass number?", c:["The bottom number (6)","The top number (14)","Both numbers added together","Neither — it's the element symbol"], a:1, ex:"The top number is mass number (protons + neutrons); the bottom number is atomic number (protons)."},
        {u:"u1", q:"A neutral sodium atom loses 1 electron. What ion does it become?", c:["Na⁻","Na⁺","Na²⁺","Na²⁻"], a:1, ex:"Losing one negative electron leaves the atom with one more proton than electrons — a +1 charge."},
        {u:"u1", q:"How many valence electrons does neon (Group 18) have?", c:["2","6","8","18"], a:2, ex:"Neon has a full outer shell of 8 valence electrons, which is why it's chemically stable like other noble gases."},
        {u:"u1", q:"Helium is a noble gas, but it only has 2 valence electrons instead of 8. Why is it still stable?", c:["It isn't actually stable","Its single shell is full with just 2 electrons","It has no electrons at all","It gains 6 more electrons in reactions"], a:1, ex:"Helium's first energy level only holds 2 electrons max, so 2 is already a full, stable shell."},
        {u:"u1", q:"The periodic table is divided into s, p, d, and f blocks based on...", c:["Which sublevel is being filled by the last electron added","The element's color","Whether the element is a metal or nonmetal","The element's discovery date"], a:0, ex:"An element's block tells you which type of orbital (s, p, d, or f) its highest-energy electrons occupy."},
        {u:"u1", q:"The 'representative' or 'main-group' elements are made up of which two blocks combined?", c:["s-block and p-block","d-block and f-block","s-block and d-block","p-block and f-block"], a:0, ex:"Groups 1–2 (s-block) and Groups 13–18 (p-block) together make up the main-group elements."},
        {u:"u1", q:"How many valence electrons does an element in Group 14 (the carbon family) have?", c:["2","4","6","8"], a:1, ex:"Carbon, silicon, and germanium all have 4 valence electrons, which is why they commonly form 4 bonds."},
        {u:"u1", q:"How many valence electrons does an element in Group 15 (the nitrogen family) have?", c:["3","4","5","6"], a:2, ex:"Nitrogen, phosphorus, and arsenic all have 5 valence electrons."},
        {u:"u1", q:"How many valence electrons does an element in Group 13 (the boron family) have?", c:["2","3","4","5"], a:1, ex:"Boron and aluminum both have 3 valence electrons."},
        {u:"u1", q:"A neutral magnesium atom loses 2 electrons. What ion does it become?", c:["Mg⁻","Mg⁺","Mg²⁺","Mg²⁻"], a:2, ex:"Losing two electrons leaves magnesium with two more protons than electrons — a +2 charge."},
        {u:"u1", q:"Compared to a proton, the mass of an electron is...", c:["About the same","About twice as much","Negligibly small (about 1/1800th)","Impossible to measure"], a:2, ex:"Electrons contribute so little mass that they're often ignored when calculating an atom's overall mass."},
        {u:"u1", q:"Which element has atomic number 6?", c:["Nitrogen","Carbon","Oxygen","Boron"], a:1, ex:"Carbon's 6 protons make it element number 6 — the basis of all organic chemistry."},
        {u:"u1", q:"An element's period number tells you the number of...", c:["Protons it has","Valence electrons it has","Electron shells (energy levels) it uses","Isotopes it has"], a:2, ex:"Every element in period 3, for example, has electrons occupying three energy levels."},

        // Unit 2: Atomic Theory
        {u:"u2", q:"Which atomic model pictured the atom as a solid, indivisible sphere?", c:["Bohr model","Dalton's model","Thomson's model","Quantum mechanical model"], a:1, ex:"Dalton's early 1800s model had no internal structure at all."},
        {u:"u2", q:"Which scientist's 'plum pudding' model placed electrons scattered through a positive sphere?", c:["Rutherford","Thomson","Bohr","Dalton"], a:1, ex:"Thomson discovered the electron and proposed this model in 1904."},
        {u:"u2", q:"The gold foil experiment revealed the existence of a small, dense, positively-charged...", c:["Electron cloud","Nucleus","Neutron","Isotope"], a:1, ex:"Rutherford was surprised some alpha particles bounced straight back — proof of a concentrated nucleus."},
        {u:"u2", q:"Which model placed electrons in fixed circular energy levels around the nucleus, like planets?", c:["Dalton's model","Thomson's model","Bohr model","Electron cloud model"], a:2, ex:"Bohr's 1913 model explained hydrogen's line spectrum with quantized orbits."},
        {u:"u2", q:"The modern model describing electrons as existing in probability regions is the...", c:["Bohr model","Plum pudding model","Electron cloud (quantum mechanical) model","Billiard ball model"], a:2, ex:"Electrons don't follow fixed paths — we describe where they're likely to be found."},
        {u:"u2", q:"What equation relates the speed of light, wavelength, and frequency?", c:["E = mc²","c = λν","PV = nRT","F = ma"], a:1, ex:"Speed of light = wavelength × frequency."},
        {u:"u2", q:"As the wavelength of light increases, its frequency...", c:["Increases","Decreases","Stays the same","Becomes negative"], a:1, ex:"Wavelength and frequency are inversely related in c = λν."},
        {u:"u2", q:"Which has more energy per photon: gamma rays or radio waves?", c:["Radio waves","Gamma rays","They're equal","Depends on temperature"], a:1, ex:"Gamma rays have very short wavelengths and very high frequencies — and higher frequency means higher energy."},
        {u:"u2", q:"The rule stating electrons fill the lowest-energy orbitals first is the...", c:["Pauli exclusion principle","Hund's rule","Aufbau principle","Octet rule"], a:2, ex:"'Aufbau' is German for 'building up' — orbitals fill from lowest to highest energy."},
        {u:"u2", q:"Electrons in an atom's outermost energy level, which determine bonding behavior, are called...", c:["Core electrons","Valence electrons","Free electrons","Ionized electrons"], a:1, ex:"Valence electrons are involved in forming chemical bonds."},
        {u:"u2", q:"A Lewis dot structure for a single atom shows...", c:["Its neutrons and protons","Its valence electrons as dots","Its full electron configuration","Its molecular shape"], a:1, ex:"Dots placed around the element symbol represent valence electrons only."},
        {u:"u2", q:"Moving left to right across a period, atomic radius generally...", c:["Increases","Decreases","Stays constant","Doubles"], a:1, ex:"More protons pull the same-shell electrons in tighter, shrinking the atom."},
        {u:"u2", q:"Which element is the most electronegative on the periodic table?", c:["Oxygen","Chlorine","Fluorine","Francium"], a:2, ex:"Fluorine sits at the top-right of the nonmetals, giving it the strongest pull on shared electrons."},
        {u:"u2", q:"The principle stating we can never simultaneously know an electron's exact position and momentum is the...", c:["Pauli exclusion principle","Heisenberg uncertainty principle","Aufbau principle","Octet rule"], a:1, ex:"This limit on measurement is why electrons are described by probability, not exact orbits."},
        {u:"u2", q:"Because of the Heisenberg uncertainty principle, an electron's location around the nucleus is best described using...", c:["Exact circular orbits","Probability regions (the electron cloud)","Fixed straight-line paths","A single measurable point"], a:1, ex:"We can only describe where an electron is likely to be found, not where it definitely is."},
        {u:"u2", q:"An atomic orbital represents the region of space where there's the highest ___ of finding an electron.", c:["Mass","Probability","Charge","Temperature"], a:1, ex:"Orbitals are probability clouds, not fixed paths like in the Bohr model."},
        {u:"u2", q:"What shape is an s orbital?", c:["Dumbbell","Spherical","Cloverleaf","Ring"], a:1, ex:"The s orbital is a simple sphere centered on the nucleus."},
        {u:"u2", q:"What shape is a p orbital?", c:["Spherical","Dumbbell (two lobes)","Cube","Cone"], a:1, ex:"p orbitals come in three perpendicular dumbbell-shaped pairs (px, py, pz)."},
        {u:"u2", q:"What is the maximum number of electrons that can fit in an s sublevel?", c:["2","6","10","14"], a:0, ex:"Each energy level has one s orbital, holding at most 2 electrons."},
        {u:"u2", q:"What is the maximum number of electrons that can fit in a p sublevel?", c:["2","6","10","14"], a:1, ex:"There are three p orbitals, each holding 2 electrons, for 6 total."},
        {u:"u2", q:"What is the maximum number of electrons that can fit in a d sublevel?", c:["2","6","10","14"], a:2, ex:"There are five d orbitals, each holding 2 electrons, for 10 total."},
        {u:"u2", q:"The principal quantum number (n) describes an electron's...", c:["Spin direction","Main energy level (shell)","Exact position","Orbital shape only"], a:1, ex:"n = 1, 2, 3... indicates which shell, or main energy level, an electron occupies."},
        {u:"u2", q:"According to the Pauli exclusion principle, how many electrons can occupy a single orbital, and how must they spin?", c:["1, any spin","2, opposite spins","2, the same spin","Unlimited, any spin"], a:1, ex:"No two electrons in an atom can share the exact same set of quantum numbers, so a shared orbital needs opposite spins."},
        {u:"u2", q:"De Broglie proposed that all moving matter, including electrons, has...", c:["Only particle properties","Wave-like properties","No measurable properties","Only mass, no energy"], a:1, ex:"This wave-particle duality helped justify treating electrons as probability waves rather than tiny billiard balls."},
        {u:"u2", q:"When an electron absorbs energy and jumps to a higher energy level, the atom is said to be in a(n)...", c:["Ground state","Excited state","Ionized state","Stable state"], a:1, ex:"Excited electrons are unstable and will eventually fall back down, releasing that energy."},
        {u:"u2", q:"When an electron in an excited state falls back to a lower energy level, it releases energy as a...", c:["Neutron","Photon of light","Proton","Free electron"], a:1, ex:"The emitted photon's energy equals the exact gap between the two energy levels."},
        {u:"u2", q:"The unique set of wavelengths of light emitted by an excited element — like a fingerprint for that element — is its...", c:["Absorption spectrum","Emission spectrum","Electron cloud","Quantum leap"], a:1, ex:"Every element produces its own distinct pattern of spectral lines as excited electrons fall to lower levels."},
        {u:"u2", q:"What is the maximum number of electrons that can fit in an f sublevel?", c:["6","10","14","18"], a:2, ex:"There are seven f orbitals, each holding 2 electrons, for 14 total."},
        {u:"u2", q:"How many individual orbitals make up a p sublevel?", c:["1","3","5","7"], a:1, ex:"The three p orbitals (px, py, pz) point along three perpendicular axes."},
        {u:"u2", q:"How many individual orbitals make up a d sublevel?", c:["1","3","5","7"], a:2, ex:"The five d orbitals give this sublevel its 10-electron capacity (5 orbitals × 2 electrons each)."},
        {u:"u2", q:"How many individual orbitals make up an f sublevel?", c:["3","5","7","9"], a:2, ex:"Seven f orbitals × 2 electrons each gives this sublevel its 14-electron capacity."},
        {u:"u2", q:"What is the correct electron configuration for a neutral sodium atom (Z = 11)?", c:["1s² 2s² 2p⁵","1s² 2s² 2p⁶ 3s¹","1s² 2s² 2p⁶ 3s²","1s² 2s² 2p⁶"], a:1, ex:"Sodium's 11 electrons fill 1s, 2s, and 2p completely, leaving 1 electron in the 3s sublevel."},
        {u:"u2", q:"Noble gas shorthand notation, like [Ne]3s¹ for sodium, replaces the filled inner shells with...", c:["A question mark","The symbol of the previous noble gas in brackets","The atomic number","A blank space"], a:1, ex:"[Ne] stands in for sodium's first 10 electrons (neon's full configuration), leaving only the valence electron written out."},
        {u:"u2", q:"In an electron configuration like 2p⁴, what does the superscript '4' represent?", c:["The energy level","The number of orbitals","The number of electrons in that sublevel","The atomic number"], a:2, ex:"Superscripts always show how many electrons occupy that specific sublevel."},
        {u:"u2", q:"In a neutral atom, the total number of electrons always equals the...", c:["Mass number","Number of neutrons","Atomic number","Number of isotopes"], a:2, ex:"A neutral atom has equal protons and electrons, and protons = atomic number."},
        {u:"u2", q:"Besides the principal quantum number (n), which quantum number describes an orbital's shape (s, p, d, or f)?", c:["Spin quantum number","Angular momentum (azimuthal) quantum number","Magnetic quantum number","Mass quantum number"], a:1, ex:"The angular momentum quantum number (l) determines whether an orbital is s, p, d, or f shaped."},
        {u:"u2", q:"The spin quantum number describes an electron's...", c:["Distance from the nucleus","Orbital shape","Intrinsic spin direction","Energy level"], a:2, ex:"Electrons behave as if spinning in one of two directions, which is why only 2 (with opposite spins) can share an orbital."},
        {u:"u2", q:"The photoelectric effect — light knocking electrons off a metal surface — provided key evidence that light behaves like a...", c:["Wave only","Stream of particles (photons)","Liquid","Solid"], a:1, ex:"Einstein explained this effect by treating light as discrete energy packets, called photons — evidence for light's particle nature."},
        {u:"u2", q:"Max Planck proposed that energy is emitted or absorbed only in discrete packets called...", c:["Photons","Isotopes","Quanta","Orbitals"], a:2, ex:"Planck's quantum theory launched the idea that energy isn't continuous — it comes in fixed-size chunks."},
        {u:"u2", q:"Which equation gives the energy of a single photon, using Planck's constant (h) and frequency (ν)?", c:["E = mc²","E = hν","c = λν","PV = nRT"], a:1, ex:"A photon's energy is directly proportional to its frequency — higher frequency means more energetic photons."},
        {u:"u2", q:"Roughly what wavelength range corresponds to visible light?", c:["400–700 nanometers","4–7 nanometers","400–700 meters","0.4–0.7 nanometers"], a:0, ex:"Visible light sits in a narrow band of the electromagnetic spectrum, from violet (~400 nm) to red (~700 nm)."},
        {u:"u2", q:"Within visible light, which color has the shortest wavelength (and highest energy)?", c:["Red","Yellow","Green","Violet"], a:3, ex:"Violet light has the shortest wavelength in the visible spectrum, giving it the most energy per photon."},
        {u:"u2", q:"Within visible light, which color has the longest wavelength (and lowest energy)?", c:["Red","Blue","Violet","Green"], a:0, ex:"Red light has the longest wavelength in the visible spectrum, giving it the least energy per photon."},
        {u:"u2", q:"A hot, glowing solid (like a light bulb filament) produces a continuous spectrum, while an excited gas produces a...", c:["Solid spectrum","Line (emission) spectrum","Dark spectrum","Radio spectrum"], a:1, ex:"Gases only emit specific wavelengths corresponding to their electrons' exact energy jumps, producing distinct lines rather than a smooth rainbow."},
        {u:"u2", q:"The flame test — where heating an element produces a distinct flame color — is a direct application of an element's...", c:["Atomic radius","Emission spectrum","Ionization energy","Half-life"], a:1, ex:"Sodium burns yellow-orange, copper burns blue-green, and lithium burns red — all because of each element's unique electron energy jumps."},
        {u:"u2", q:"Moving down a group, ionization energy generally...", c:["Increases","Decreases","Stays the same","Becomes negative"], a:1, ex:"Valence electrons are farther from the nucleus and more shielded going down a group, so they're easier to remove."},
        {u:"u2", q:"Moving left to right across a period, electronegativity generally...", c:["Increases","Decreases","Stays constant","Drops to zero"], a:0, ex:"More protons pull harder on shared electrons, so electronegativity climbs as you move across a period."},
        {u:"u2", q:"Metallic character (how strongly an element behaves like a metal) generally...", c:["Increases across a period, decreases down a group","Decreases across a period, increases down a group","Increases in all directions","Stays the same everywhere"], a:1, ex:"Metallic character grows toward the lower-left of the table, opposite the direction electronegativity grows."},
        {u:"u2", q:"When a neutral atom loses an electron to form a cation, its ionic radius compared to the neutral atom is...", c:["Larger","Smaller","Exactly the same","Impossible to compare"], a:1, ex:"Losing an electron (often an entire shell) and having fewer electrons pulled by the same number of protons shrinks the ion."},
        {u:"u2", q:"When a neutral atom gains an electron to form an anion, its ionic radius compared to the neutral atom is...", c:["Larger","Smaller","Exactly the same","Impossible to compare"], a:0, ex:"Extra electrons increase electron-electron repulsion, causing the electron cloud to spread out further."},
        {u:"u2", q:"The Bohr model successfully explained the line emission spectrum of which specific element?", c:["Helium","Hydrogen","Oxygen","Carbon"], a:1, ex:"Bohr's fixed energy levels matched hydrogen's spectral lines almost perfectly, though the model struggled with more complex atoms."},
        {u:"u2", q:"What key problem did Bohr's model solve that Rutherford's nuclear model could not explain?", c:["Why atoms have mass","Why electrons don't spiral into the nucleus and why atoms emit specific spectral lines","Why protons are positive","Why neutrons have no charge"], a:1, ex:"Classical physics predicted orbiting electrons should lose energy and crash into the nucleus — Bohr's quantized orbits avoided that problem."},
        {u:"u2", q:"Which scientist developed the mathematical wave equation that describes an electron's probability distribution?", c:["Werner Heisenberg","Erwin Schrödinger","Niels Bohr","Ernest Rutherford"], a:1, ex:"Schrödinger's equation is the mathematical foundation of the electron cloud (quantum mechanical) model."},
        {u:"u2", q:"The electron cloud model is also commonly known as the...", c:["Planetary model","Quantum mechanical model","Plum pudding model","Billiard ball model"], a:1, ex:"'Electron cloud' and 'quantum mechanical' both refer to the same current, probability-based atomic model."},
        {u:"u2", q:"Which sublevel has the most complex orbital shapes and doesn't begin filling until the 4th energy level?", c:["s","p","d","f"], a:3, ex:"f orbitals have intricate multi-lobed shapes and first appear at n = 4, in elements like the lanthanides."},
        {u:"u2", q:"What is the maximum total number of electrons that can occupy the first energy level (n = 1)?", c:["2","4","6","8"], a:0, ex:"n = 1 only has an s sublevel, which holds a maximum of 2 electrons."},
        {u:"u2", q:"What is the maximum total number of electrons that can occupy the second energy level (n = 2)?", c:["2","4","8","18"], a:2, ex:"n = 2 has both an s and a p sublevel: 2 (from 2s) + 6 (from 2p) = 8 electrons total."},
        {u:"u2", q:"What is the maximum total number of electrons that can occupy the third energy level (n = 3)?", c:["8","9","18","32"], a:2, ex:"n = 3 has s, p, and d sublevels: 2 + 6 + 10 = 18 electrons total."},
        {u:"u2", q:"A photon's energy and its frequency are...", c:["Directly proportional — higher frequency means more energy","Inversely proportional — higher frequency means less energy","Unrelated","Only related for gamma rays"], a:0, ex:"Since E = hν, energy rises in direct proportion to frequency — this is why gamma rays are so much more energetic than radio waves."},
        {u:"u2", q:"According to quantum theory, an atom can only absorb or emit energy in amounts that exactly match...", c:["Any value, continuously","The difference between two specific energy levels","The atom's total mass","The speed of light"], a:1, ex:"Electrons jump between fixed energy levels, so only photons with exactly the right energy gap are absorbed or emitted."},

        // Unit 3: Nuclear Chemistry
        {u:"u3", q:"An alpha particle is identical to the nucleus of which atom?", c:["Hydrogen","Helium","Lithium","Carbon"], a:1, ex:"Alpha particles are 2 protons + 2 neutrons — a bare helium nucleus."},
        {u:"u3", q:"A beta particle is essentially a high-speed...", c:["Proton","Neutron","Electron","Photon"], a:2, ex:"Beta decay ejects a fast electron from the nucleus as a neutron converts to a proton."},
        {u:"u3", q:"Which type of nuclear radiation is pure energy, with no mass or charge?", c:["Alpha","Beta","Gamma","Neutron"], a:2, ex:"Gamma rays are high-energy electromagnetic radiation, often released alongside alpha or beta decay."},
        {u:"u3", q:"Which type of radiation can be stopped by a single sheet of paper?", c:["Alpha","Beta","Gamma","All of them"], a:0, ex:"Alpha particles are large and slow-moving, so they have the weakest penetrating power."},
        {u:"u3", q:"Which type of radiation has the greatest penetrating power, requiring thick lead or concrete to stop?", c:["Alpha","Beta","Gamma","None of them"], a:2, ex:"Gamma rays pass through paper and even aluminum with ease."},
        {u:"u3", q:"When balancing a nuclear equation, both mass number and ___ must be conserved on each side.", c:["Volume","Atomic number","Temperature","Density"], a:1, ex:"The sum of mass numbers (top) and atomic numbers (bottom) must match on both sides."},
        {u:"u3", q:"In alpha decay, an atom's mass number drops by 4 and its atomic number drops by...", c:["1","2","4","0"], a:1, ex:"Losing an alpha particle (2 protons, 2 neutrons) lowers the atomic number by 2."},
        {u:"u3", q:"Splitting a large, unstable nucleus into smaller nuclei — used in nuclear power plants — is called...", c:["Fusion","Fission","Half-life","Ionization"], a:1, ex:"Nuclear fission releases energy by breaking apart heavy nuclei like uranium-235."},
        {u:"u3", q:"Combining small nuclei into a larger one — the process that powers the sun — is called...", c:["Fission","Fusion","Radiation","Half-life"], a:1, ex:"Nuclear fusion smashes light nuclei (like hydrogen) together, releasing enormous energy."},
        {u:"u3", q:"The time it takes for half of a radioactive sample to decay is called its...", c:["Decay constant","Half-life","Reaction rate","Activation time"], a:1, ex:"Half-life is constant for a given isotope, regardless of sample size."},
        {u:"u3", q:"What are the two things that typically collide to start a fission reaction in a nuclear reactor?", c:["Hydrogen and helium","A neutron and a uranium-235 nucleus","Two protons","Alpha and beta particles"], a:1, ex:"A stray neutron striking a U-235 nucleus splits it apart and releases more neutrons."},
        {u:"u3", q:"A chain reaction occurs in nuclear fission because each split nucleus releases...", c:["Heat only, with no further effect","Additional neutrons that trigger more fissions","Protons that trigger fusion","Gamma rays only, with no further effect"], a:1, ex:"Those freed neutrons go on to split more nuclei, which release still more neutrons — a self-sustaining chain."},
        {u:"u3", q:"Which medical application tracks radioactive tracers moving through the body to diagnose disease?", c:["Radiation therapy","Nuclear imaging (e.g., PET scans)","Carbon dating","Fission power"], a:1, ex:"A radioactive tracer's emissions are detected and mapped to image organs and processes inside the body."},
        {u:"u3", q:"Carbon-14 dating is used to estimate the age of...", c:["Rocks and minerals only","Once-living organic materials","Nuclear reactors","Stars"], a:1, ex:"Living things constantly exchange carbon; once they die, carbon-14 decays at a known, measurable rate."},
        {u:"u3", q:"Which isotope is most commonly used as fuel in nuclear power plants?", c:["Carbon-14","Uranium-235","Hydrogen-1","Oxygen-16"], a:1, ex:"U-235 readily undergoes fission when struck by a neutron, making it ideal reactor fuel."},
        {u:"u3", q:"What primarily determines whether a nucleus is stable or radioactive?", c:["The element's color","The ratio of neutrons to protons","The number of electrons","The element's melting point"], a:1, ex:"Nuclei with an imbalanced neutron-to-proton ratio tend to be unstable and undergo radioactive decay."},
        {u:"u3", q:"Very large, heavy nuclei (beyond a certain atomic number) tend to be...", c:["Always perfectly stable","Naturally radioactive","Impossible to form","Only found in stars"], a:1, ex:"Every isotope of the heaviest elements on the periodic table is radioactive — there's no stable arrangement large enough to hold together."},
        {u:"u3", q:"The becquerel, the SI unit of radioactivity, measures...", c:["Biological dose to tissue","Decays per second","Energy of a single particle","Half-life duration"], a:1, ex:"One becquerel equals one radioactive decay event per second."},
        {u:"u3", q:"The sievert is a unit used to measure...", c:["The mass of a radioactive sample","The speed of emitted particles","The biological dose radiation delivers to living tissue","The half-life of an isotope"], a:2, ex:"Sieverts account for how damaging different types of radiation are to the human body, not just how much energy is released."},
        {u:"u3", q:"In beta-minus decay, a neutron in the nucleus converts into a proton and a(n)...", c:["Emitted electron","Emitted proton","Absorbed neutron","Emitted alpha particle"], a:0, ex:"That emitted high-speed electron is the beta particle."},
        {u:"u3", q:"In beta-minus decay, what happens to the atomic number?", c:["It decreases by 1","It increases by 1","It stays the same","It doubles"], a:1, ex:"Converting a neutron to a proton adds one proton, increasing the atomic number by 1 while mass number stays the same."},
        {u:"u3", q:"In positron emission, a proton in the nucleus converts into a neutron and a(n)...", c:["Emitted electron","Emitted positron","Absorbed proton","Emitted gamma ray only"], a:1, ex:"A positron is essentially a positively-charged 'anti-electron' ejected from the nucleus."},
        {u:"u3", q:"A positron is best described as...", c:["A particle with the mass of a proton but no charge","The antimatter counterpart of an electron — same mass, opposite (positive) charge","A heavier version of an alpha particle","A neutral particle found only in gamma decay"], a:1, ex:"Positrons have identical mass to electrons but carry a positive charge instead of negative."},
        {u:"u3", q:"In electron capture, the nucleus absorbs an inner electron, converting a proton into a...", c:["Neutron","Positron","Second proton","Photon"], a:0, ex:"Electron capture has the same effect on atomic number as positron emission: it decreases by 1."},
        {u:"u3", q:"Both positron emission and electron capture change a nucleus's atomic number by...", c:["+2","+1","-1","-2"], a:2, ex:"Both processes convert a proton into a neutron, dropping the atomic number by 1 while mass number is unchanged."},
        {u:"u3", q:"Nuclear fusion requires extremely high temperature and pressure mainly because...", c:["Nuclei are too heavy to move","Positively-charged nuclei naturally repel each other","Neutrons are hard to find","Electrons block the reaction"], a:1, ex:"Overcoming the electrostatic repulsion between two positive nuclei takes enormous energy input."},
        {u:"u3", q:"The sun generates its energy primarily by fusing...", c:["Helium nuclei into carbon","Hydrogen nuclei into helium","Uranium nuclei into lead","Carbon nuclei into oxygen"], a:1, ex:"Hydrogen fusion in the sun's core converts a small amount of mass directly into a tremendous amount of energy."},
        {u:"u3", q:"Cobalt-60 is commonly used in medicine as a source of radiation for...", c:["Diagnostic imaging only","Radiation therapy to destroy cancer cells","Carbon dating","Powering pacemakers"], a:1, ex:"Cobalt-60's gamma emissions are strong enough to target and kill cancerous tissue in controlled doses."},
        {u:"u3", q:"Technetium-99m is especially useful in nuclear imaging because it...", c:["Has an extremely long half-life","Emits easily-detected gamma rays and decays quickly, limiting patient exposure","Only emits alpha particles","Is not radioactive at all"], a:1, ex:"Its short half-life clears the tracer from the body quickly while still giving doctors a clear image."},
        {u:"u3", q:"Uranium-238's extremely long half-life (about 4.5 billion years) makes it especially useful for dating...", c:["Recently-deceased organisms","Very old rocks and minerals","Nuclear reactor fuel rods only","Smoke detector components"], a:1, ex:"U-238's slow decay rate makes it a good 'clock' for timescales of billions of years, unlike the much faster carbon-14."},
        {u:"u3", q:"Household smoke detectors contain a small amount of americium-241, which emits alpha particles to...", c:["Power the detector's battery","Ionize the air so smoke can be detected","Kill bacteria in the air","Emit visible light as a warning"], a:1, ex:"Smoke particles disrupt the ionized air current, which triggers the alarm."},
        {u:"u3", q:"A 100 g sample of a radioactive isotope undergoes 2 half-lives. About how much of the original isotope remains?", c:["50 g","25 g","12.5 g","0 g"], a:1, ex:"After 1 half-life: 50 g remains. After 2 half-lives: 25 g remains."},
        {u:"u3", q:"An 80 g sample has a half-life of 10 years. How much remains after 30 years (3 half-lives)?", c:["40 g","20 g","10 g","5 g"], a:2, ex:"80 → 40 (10 yr) → 20 (20 yr) → 10 g (30 yr)."},
        {u:"u3", q:"A radioactive isotope has a half-life of 5 days. What fraction of the original sample remains after 15 days?", c:["1/2","1/4","1/8","1/16"], a:2, ex:"15 days ÷ 5-day half-life = 3 half-lives, and (1/2)³ = 1/8."},
        {u:"u3", q:"What is the minimum shielding typically needed to stop alpha particles?", c:["Thick lead","A sheet of paper or even skin","Several feet of concrete","Nothing can stop them"], a:1, ex:"Alpha particles are large and slow, so they lose their energy very quickly in matter."},
        {u:"u3", q:"What kind of shielding is typically needed to stop beta particles?", c:["A sheet of paper","A thin layer of aluminum or plastic","Several feet of concrete","Nothing — they pass through everything"], a:1, ex:"Beta particles penetrate further than alpha but are still stopped by a modest barrier like aluminum foil or plastic."},
        {u:"u3", q:"What kind of shielding is typically needed to stop gamma rays?", c:["A sheet of paper","A thin layer of aluminum","Thick lead or concrete","No shielding is ever needed"], a:2, ex:"Gamma rays are high-energy electromagnetic radiation and need dense, thick material to be absorbed."},
        {u:"u3", q:"Ionizing radiation is biologically dangerous mainly because it can damage...", c:["Only the skin's surface","DNA and other cellular structures","Bone density exclusively","Nothing at low doses"], a:1, ex:"Radiation can break chemical bonds in DNA, which is why exposure is carefully monitored and limited."},
        {u:"u3", q:"Critical mass refers to...", c:["The total mass of a nuclear reactor building","The minimum amount of fissionable material needed to sustain a chain reaction","The mass of a single uranium atom","The mass lost during radioactive decay"], a:1, ex:"Below critical mass, too many neutrons escape without striking another nucleus, and the chain reaction fizzles out."},
        {u:"u3", q:"A radioisotope is best defined as...", c:["Any isotope, stable or not","An isotope with an unstable nucleus that undergoes radioactive decay","An element with no neutrons","A synthetic element only"], a:1, ex:"Not every isotope is radioactive — a radioisotope specifically refers to the unstable ones."},
        {u:"u3", q:"The process where an atom transforms into a different element through radioactive decay is called...", c:["Transmutation","Titration","Sublimation","Hybridization"], a:0, ex:"Unlike chemical reactions, nuclear decay actually changes which element an atom is."},
        {u:"u3", q:"A 'decay series' (or decay chain) describes...", c:["A single isotope decaying once and becoming stable","A sequence of decays where one radioactive isotope decays into another, until a stable isotope is reached","The half-life of a sample measured repeatedly","A chain reaction inside a nuclear reactor only"], a:1, ex:"Uranium-238, for example, passes through more than a dozen radioactive daughter isotopes before finally becoming stable lead-206."},
        {u:"u3", q:"Which type of nuclear decay does NOT change an atom's mass number at all?", c:["Alpha decay","Gamma decay","Beta-minus decay","Positron emission"], a:1, ex:"Gamma decay releases pure energy — no particles with mass are emitted, so both mass number and atomic number stay the same."},
        {u:"u3", q:"Among alpha, beta, and gamma radiation, which one has zero mass and zero charge?", c:["Alpha","Beta","Gamma","None of them"], a:2, ex:"A gamma ray is a high-energy photon — pure electromagnetic energy, with no mass or charge."},
        {u:"u3", q:"²³⁸₉₂U undergoes alpha decay. What is the mass number of the resulting nucleus?", c:["234","236","238","242"], a:0, ex:"Losing an alpha particle (mass number 4) means 238 − 4 = 234."},
        {u:"u3", q:"²³⁸₉₂U undergoes alpha decay. What is the atomic number of the resulting nucleus?", c:["88","90","92","94"], a:1, ex:"Losing an alpha particle (atomic number 2) means 92 − 2 = 90, which is thorium."},
        {u:"u3", q:"Why can't ordinary chemical reactions, like burning wood, transform one element into another the way nuclear reactions can?", c:["Chemical reactions only rearrange electrons and bonds, never touching the protons in the nucleus","Chemical reactions release too little energy","Chemical reactions only happen in gases","There's no real difference"], a:0, ex:"An element's identity is set by its proton count — only nuclear reactions can change that number."},
        {u:"u3", q:"Which of these is a real medical use of a specific radioisotope?", c:["Iodine-131 for treating thyroid conditions","Helium-4 for treating broken bones","Oxygen-16 for treating infections","Carbon-12 for treating burns"], a:0, ex:"Iodine-131 is absorbed by the thyroid gland, making it useful for both imaging and treating thyroid disorders."},
        {u:"u3", q:"Compared to alpha and beta particles, gamma rays travel at...", c:["A much slower speed","The speed of sound","The speed of light","Zero — they don't move"], a:2, ex:"As electromagnetic radiation, gamma rays are photons and always travel at the speed of light."},
        {u:"u3", q:"A nuclear reactor uses control rods (often made of materials like boron or cadmium) to...", c:["Speed up the chain reaction as much as possible","Absorb excess neutrons and control the rate of the chain reaction","Cool the reactor with water only","Convert fission into fusion"], a:1, ex:"Control rods can be inserted or withdrawn to absorb neutrons, keeping the chain reaction steady rather than runaway."},

        // Unit 4: Atomic Bonding
        {u:"u4", q:"A bond formed by the transfer of electrons from a metal to a nonmetal is a(n)...", c:["Covalent bond","Ionic bond","Metallic bond","Hydrogen bond"], a:1, ex:"The metal loses electrons to become a cation; the nonmetal gains them to become an anion."},
        {u:"u4", q:"A bond formed when two nonmetals share electrons is a(n)...", c:["Ionic bond","Covalent bond","Metallic bond","Dipole bond"], a:1, ex:"Shared electron pairs hold covalently-bonded atoms together."},
        {u:"u4", q:"When writing an ionic formula, the criss-cross method ensures the compound's overall charge is...", c:["Positive","Negative","Zero (neutral)","Doubled"], a:2, ex:"The subscripts balance the positive and negative charges so they cancel out."},
        {u:"u4", q:"In a name like Iron(III) Chloride, the Roman numeral tells you the...", c:["Number of chlorine atoms","Charge on the metal ion","Number of electrons shared","Molar mass"], a:1, ex:"Transition metals can have variable charges, so the Stock system spells it out."},
        {u:"u4", q:"What is the name of the polyatomic ion NO3⁻?", c:["Nitrite","Nitrate","Nitride","Ammonium"], a:1, ex:"NO3⁻ is nitrate; NO2⁻ (one fewer oxygen) is nitrite."},
        {u:"u4", q:"What is the name of the polyatomic ion SO4²⁻?", c:["Sulfite","Sulfate","Sulfide","Sulfuric"], a:1, ex:"SO4²⁻ is sulfate; SO3²⁻ (one fewer oxygen) is sulfite."},
        {u:"u4", q:"In naming covalent compounds, the prefix 'tetra-' indicates how many atoms?", c:["2","3","4","5"], a:2, ex:"Prefixes go mono-, di-, tri-, tetra-, penta-... counting atoms of each element."},
        {u:"u4", q:"CO2 is named using covalent prefixes as...", c:["Carbon oxide","Monocarbon dioxide","Carbon dioxide","Dicarbon oxide"], a:2, ex:"The first element usually skips 'mono-'; the second element gets 'di-' for its 2 oxygens."},
        {u:"u4", q:"VSEPR theory predicts a molecule's shape based on...", c:["Atomic mass","Repulsion between electron pairs","Isotope ratios","Temperature"], a:1, ex:"Electron pairs (bonding and lone) push apart to get as far from each other as possible."},
        {u:"u4", q:"A molecule with 4 bonding pairs and no lone pairs (like CH4) has what molecular geometry?", c:["Linear","Bent","Tetrahedral","Trigonal pyramidal"], a:2, ex:"Four bonding pairs spread out to 109.5° angles — a tetrahedral shape."},
        {u:"u4", q:"Water (H2O) has 2 bonding pairs and 2 lone pairs on oxygen, giving it what shape?", c:["Linear","Bent","Tetrahedral","Trigonal planar"], a:1, ex:"The lone pairs push the two O–H bonds into a bent, ~104.5° shape."},
        {u:"u4", q:"Ammonia (NH3) has 3 bonding pairs and 1 lone pair, giving it what shape?", c:["Trigonal planar","Bent","Tetrahedral","Trigonal pyramidal"], a:3, ex:"The single lone pair pushes the three N–H bonds down into a pyramid shape."},
        {u:"u4", q:"The strong intermolecular attraction between hydrogen and a nearby N, O, or F atom is called...", c:["Ionic bonding","Hydrogen bonding","Metallic bonding","Covalent bonding"], a:1, ex:"Hydrogen bonding is why water has an unusually high boiling point for its size."},
        {u:"u4", q:"Compared to covalent (molecular) compounds, ionic compounds typically have...", c:["Lower melting points","Higher melting points","No melting point","The same melting point"], a:1, ex:"Strong electrostatic attraction throughout the ionic lattice takes a lot of energy to break."},
        {u:"u4", q:"A metal bonded to other metal atoms, with valence electrons free to move throughout a 'sea of electrons,' describes...", c:["Ionic bonding","Covalent bonding","Metallic bonding","Hydrogen bonding"], a:2, ex:"Delocalized electrons are shared among all the metal atoms in the structure, not held between just two."},
        {u:"u4", q:"Metallic bonding explains why metals conduct electricity well because...", c:["Their ions are fixed in place","Their valence electrons move freely through the structure","They have no valence electrons","They form individual molecules"], a:1, ex:"Mobile electrons can carry charge through the metal when a voltage is applied."},
        {u:"u4", q:"A bond between atoms with a large electronegativity difference (like Na and Cl) is best described as...", c:["Nonpolar covalent","Polar covalent","Ionic","Metallic"], a:2, ex:"A big electronegativity gap means one atom essentially takes the electron rather than sharing it — an ionic bond."},
        {u:"u4", q:"A bond between two identical nonmetal atoms (like the O2 in the air you breathe) is...", c:["Ionic","Polar covalent","Nonpolar covalent","Metallic"], a:2, ex:"Identical atoms have identical electronegativity, so electrons are shared perfectly evenly."},
        {u:"u4", q:"Which of these polyatomic ions carries a +1 charge?", c:["Hydroxide (OH⁻)","Ammonium (NH4⁺)","Carbonate (CO3²⁻)","Phosphate (PO4³⁻)"], a:1, ex:"Ammonium is one of the few common polyatomic cations, often pairing with negative ions like nitrate or chloride."},
        {u:"u4", q:"A molecule with 5 bonding pairs and no lone pairs has what molecular geometry?", c:["Tetrahedral","Trigonal bipyramidal","Octahedral","Linear"], a:1, ex:"Five electron pairs spread out to minimize repulsion in a trigonal bipyramidal shape."},
        {u:"u4", q:"In covalent naming prefixes, 'penta-' indicates how many atoms?", c:["4","5","6","7"], a:1, ex:"The prefix sequence continues mono-, di-, tri-, tetra-, penta-..."},
        {u:"u4", q:"In covalent naming prefixes, 'hexa-' indicates how many atoms?", c:["5","6","7","8"], a:1, ex:"Sulfur hexafluoride (SF6) uses this prefix for its six fluorine atoms."},
        {u:"u4", q:"In covalent naming prefixes, 'hepta-' indicates how many atoms?", c:["6","7","8","9"], a:1, ex:"'Hepta-' continues the Greek counting sequence after hexa-."},
        {u:"u4", q:"In covalent naming prefixes, 'octa-' indicates how many atoms?", c:["7","8","9","10"], a:1, ex:"'Octa-' means eight, the same root as 'octagon.'"},
        {u:"u4", q:"P2O5 is named using covalent prefixes as...", c:["Phosphorus oxide","Diphosphorus pentoxide","Phosphorus pentoxide","Diphosphorus oxide"], a:1, ex:"Two phosphorus atoms get 'di-' and five oxygen atoms get 'penta-' (shortened to 'pent-' before the vowel in 'oxide')."},
        {u:"u4", q:"N2O4 is named using covalent prefixes as...", c:["Nitrogen tetroxide","Dinitrogen tetroxide","Nitrogen oxide","Dinitrogen oxide"], a:1, ex:"Two nitrogen atoms get 'di-' and four oxygen atoms get 'tetra-' (shortened to 'tetr-' before the vowel)."},
        {u:"u4", q:"What is the name of the polyatomic ion PO4³⁻?", c:["Phosphite","Phosphate","Phosphide","Phosphorate"], a:1, ex:"PO4³⁻ is phosphate — a key ion in biology (DNA, ATP) and fertilizers."},
        {u:"u4", q:"What is the name of the polyatomic ion CO3²⁻?", c:["Carbonate","Carbonite","Carbide","Bicarbonate"], a:0, ex:"CO3²⁻ is carbonate, found in limestone (calcium carbonate) and baking soda's relative."},
        {u:"u4", q:"What is the name of the polyatomic ion HCO3⁻?", c:["Carbonate","Hydrogen carbonate (bicarbonate)","Hydronium","Formate"], a:1, ex:"Adding one hydrogen to carbonate gives bicarbonate — found in baking soda (sodium bicarbonate)."},
        {u:"u4", q:"What is the name of the polyatomic ion CN⁻?", c:["Cyanide","Cyanate","Nitride","Carbonitride"], a:0, ex:"Cyanide (CN⁻) is a well-known toxic polyatomic ion made of one carbon and one nitrogen."},
        {u:"u4", q:"What is the name of the polyatomic ion C2H3O2⁻ (also written CH3COO⁻)?", c:["Acetate","Formate","Citrate","Carbonate"], a:0, ex:"Acetate is the ion found in vinegar (acetic acid) and many household compounds."},
        {u:"u4", q:"What is the name of the polyatomic ion MnO4⁻?", c:["Manganate","Permanganate","Manganite","Manganide"], a:1, ex:"Permanganate (MnO4⁻) is a strong oxidizer known for its deep purple color in solution."},
        {u:"u4", q:"What is the name of the polyatomic ion CrO4²⁻?", c:["Chromite","Chromate","Chromide","Dichromate"], a:1, ex:"Chromate (CrO4²⁻) is a bright yellow ion; its relative, dichromate (Cr2O7²⁻), is orange."},
        {u:"u4", q:"What is the correct name for FeCl3?", c:["Iron chloride","Iron(II) chloride","Iron(III) chloride","Ferrous trichloride"], a:2, ex:"Three chloride ions (each -1) balance a +3 iron ion, so it's iron(III) chloride."},
        {u:"u4", q:"What is the correct name for CuO?", c:["Copper oxide","Copper(I) oxide","Copper(II) oxide","Dicopper oxide"], a:2, ex:"Oxide is -2, so copper must be +2 here to balance the charge — copper(II) oxide."},
        {u:"u4", q:"What is the correct formula for aluminum oxide, made from Al³⁺ and O²⁻ ions?", c:["AlO","Al2O3","Al3O2","AlO3"], a:1, ex:"Criss-crossing the charges (3 and 2) gives Al2O3, which is already in lowest terms."},
        {u:"u4", q:"What is the correct formula for calcium chloride, made from Ca²⁺ and Cl⁻ ions?", c:["CaCl","CaCl2","Ca2Cl","Ca2Cl2"], a:1, ex:"One Ca²⁺ needs two Cl⁻ ions to balance its charge, giving CaCl2."},
        {u:"u4", q:"A solid like diamond, where covalent bonds extend continuously throughout the entire structure rather than forming separate molecules, is called a...", c:["Molecular solid","Network covalent (macromolecular) solid","Ionic lattice","Metallic alloy"], a:1, ex:"Because every atom is covalently bonded to its neighbors throughout the crystal, network solids like diamond have extremely high melting points."},
        {u:"u4", q:"Diamond and graphite are both pure carbon, yet diamond is extremely hard while graphite is soft and slippery. This is because of their different...", c:["Isotope ratios","Bonding arrangement (structure)","Electron charge","Atomic number"], a:1, ex:"Diamond's carbon atoms bond in a rigid 3D network, while graphite's bond in flat, weakly-stacked sheets."},
        {u:"u4", q:"HF has a surprisingly high boiling point compared to similarly-sized molecules because of...", c:["Ionic bonding","Metallic bonding","Hydrogen bonding","A lack of any intermolecular forces"], a:2, ex:"Hydrogen bonded directly to fluorine creates an unusually strong intermolecular attraction."},
        {u:"u4", q:"A molecule can have individually polar bonds but still be a nonpolar molecule overall if...", c:["It has no electrons","Its symmetric shape causes the bond dipoles to cancel out","It's a solid at room temperature","It contains only one atom"], a:1, ex:"CO2 has two polar C=O bonds, but its linear, symmetric shape makes those dipoles cancel, leaving the whole molecule nonpolar."},
        {u:"u4", q:"Lattice energy is defined as...", c:["The energy needed to melt a covalent solid","The energy released when gaseous ions combine to form an ionic solid","The energy of a single covalent bond","The kinetic energy of a gas particle"], a:1, ex:"Lattice energy measures how strongly an ionic crystal's oppositely-charged ions attract each other — the higher it is, the stronger the ionic bonding."},
        {u:"u4", q:"Which factor tends to increase an ionic compound's lattice energy (making the ionic bond stronger)?", c:["Larger ionic radius and lower charge","Smaller ionic radius and higher charge","Having more neutrons","A lower melting point"], a:1, ex:"Smaller, more highly-charged ions pack closer together and attract each other more strongly, raising lattice energy."},
        {u:"u4", q:"A molecule with 6 bonding pairs and no lone pairs (like SF6) has what molecular geometry?", c:["Trigonal bipyramidal","Tetrahedral","Octahedral","Square planar"], a:2, ex:"Six electron pairs spread out symmetrically in an octahedral arrangement to minimize repulsion."},
        {u:"u4", q:"Metals are malleable (can be hammered into sheets without shattering) because metallic bonding lets...", c:["Metal atoms turn into gas easily","Metal atoms slide past each other while the delocalized electron sea keeps them bonded","Electrons stay fixed in one spot","Metal atoms repel each other constantly"], a:1, ex:"Unlike ionic bonds, metallic bonds aren't broken by shifting atoms, since the electron sea isn't tied to any specific pair of atoms."},
        {u:"u4", q:"Ionic solids are brittle and shatter under stress because...", c:["They have no bonds at all","Shifting the lattice lines up same-charge ions, which repel and fracture the crystal","They're always liquids at room temperature","Their electrons are too mobile"], a:1, ex:"A sharp blow shifts ion layers just enough to bring like charges face-to-face, and the resulting repulsion splits the crystal apart."},
        {u:"u4", q:"Alloys, like steel or bronze, are mixtures of metals held together by...", c:["Ionic bonding","Covalent bonding","Metallic bonding","Hydrogen bonding"], a:2, ex:"Because metallic bonding doesn't depend on fixed atom pairs, different metal atoms can mix freely and still bond throughout the structure."},
        {u:"u4", q:"What bond type would you predict between two chlorine atoms in Cl2?", c:["Ionic","Polar covalent","Nonpolar covalent","Metallic"], a:2, ex:"Identical atoms have zero electronegativity difference, so their shared electrons are split perfectly evenly."},
        {u:"u4", q:"Carbon and hydrogen have a small electronegativity difference (about 0.4). Bonds between them, like in methane, are generally treated as...", c:["Ionic","​Essentially nonpolar covalent","Metallic","Hydrogen bonds"], a:1, ex:"The gap is small enough that C–H bonds are usually treated as nonpolar (or only very weakly polar) covalent bonds."},
        {u:"u4", q:"SO3 is named using covalent prefixes as...", c:["Sulfur oxide","Sulfur trioxide","Monosulfur trioxide","Sulfur dioxide"], a:1, ex:"One sulfur (no prefix needed) and three oxygens ('tri-') gives sulfur trioxide."},
        {u:"u4", q:"What is the correct name for Na2SO4?", c:["Sodium sulfide","Sodium sulfite","Sodium sulfate","Disodium sulfate"], a:2, ex:"Two Na⁺ ions balance one SO4²⁻ ion — named simply sodium sulfate, with no prefixes for ionic compounds."},
        {u:"u4", q:"What is the correct formula for potassium nitrate, made from K⁺ and NO3⁻ ions?", c:["KNO3","K2NO3","KNO2","K(NO3)2"], a:0, ex:"The charges already match 1:1, so the formula is simply KNO3."},
        {u:"u4", q:"Which type of solid tends to be the most volatile (lowest boiling point, evaporates most easily)?", c:["Ionic solid","Metallic solid","Network covalent solid","Simple molecular (covalent) solid"], a:3, ex:"Simple molecular solids are held together only by relatively weak intermolecular forces, so they need far less energy to vaporize."},
        {u:"u4", q:"What is the approximate bond angle in a tetrahedral molecule?", c:["90°","104.5°","109.5°","180°"], a:2, ex:"Four bonding pairs spread out as far apart as possible in three dimensions, settling at about 109.5°."},
        {u:"u4", q:"What is the bond angle in a linear molecule?", c:["90°","120°","150°","180°"], a:3, ex:"With only two bonding directions and nothing pushing them apart differently, they sit exactly opposite each other."},

        // Unit 5: The Mole
        {u:"u5", q:"Avogadro's number, 6.022 × 10²³, tells you the number of particles in one...", c:["Gram","Liter","Mole","Atom"], a:2, ex:"One mole of anything — atoms, molecules, ions — contains 6.022 × 10²³ particles."},
        {u:"u5", q:"The mass in grams of one mole of a substance is called its...", c:["Atomic number","Molar mass","Density","Formula unit"], a:1, ex:"Molar mass (g/mol) is numerically equal to the atomic or formula mass."},
        {u:"u5", q:"To convert from moles to number of particles, you...", c:["Divide by Avogadro's number","Multiply by Avogadro's number","Multiply by molar mass","Divide by molar mass"], a:1, ex:"moles × 6.022×10²³ particles/mol = number of particles."},
        {u:"u5", q:"To convert from grams to moles, you...", c:["Multiply by molar mass","Divide mass by molar mass","Multiply by Avogadro's number","Divide by Avogadro's number"], a:1, ex:"mass (g) ÷ molar mass (g/mol) = moles."},
        {u:"u5", q:"Percent composition tells you the percent by ___ of each element in a compound.", c:["Volume","Mass","Mole","Charge"], a:1, ex:"It's (mass of element ÷ total mass of compound) × 100%."},
        {u:"u5", q:"The simplest whole-number ratio of atoms in a compound is its...", c:["Molecular formula","Empirical formula","Structural formula","Ionic formula"], a:1, ex:"Empirical formulas are derived from percent composition data."},
