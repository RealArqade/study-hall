        {u:"u5", q:"A molecular formula is always...", c:["Smaller than the empirical formula","A whole-number multiple of the empirical formula","Unrelated to the empirical formula","The same as percent composition"], a:1, ex:"Molecular mass ÷ empirical mass gives the whole-number multiplier."},
        {u:"u5", q:"A compound has empirical formula CH2O (empirical mass 30 g/mol) and a molar mass of 180 g/mol. What's its molecular formula?", c:["C2H4O2","C3H6O3","C6H12O6","CH2O"], a:2, ex:"180 ÷ 30 = 6, so multiply every subscript in CH2O by 6."},
        {u:"u5", q:"One mole of carbon-12 atoms has a mass of about...", c:["6.022 g","12 g","1 g","24 g"], a:1, ex:"Carbon's molar mass, ~12 g/mol, is the historical basis for defining the mole."},
        {u:"u5", q:"If you have 2 moles of water, how many molecules of water do you have?", c:["6.022×10²³","1.204×10²⁴","3.011×10²³","2"], a:1, ex:"2 mol × 6.022×10²³ molecules/mol = 1.204×10²⁴ molecules."},
        {u:"u5", q:"How many moles are in 88 grams of CO2 (molar mass 44 g/mol)?", c:["0.5 mol","2 mol","4 mol","22 mol"], a:1, ex:"88 g ÷ 44 g/mol = 2 mol."},
        {u:"u5", q:"What is the molar mass of water, H2O (H = 1 g/mol, O = 16 g/mol)?", c:["16 g/mol","17 g/mol","18 g/mol","20 g/mol"], a:2, ex:"2(1) + 16 = 18 g/mol."},
        {u:"u5", q:"A sample contains 0.5 moles of NaCl. About how many formula units of NaCl is that?", c:["3.011×10²³","6.022×10²³","1.204×10²⁴","0.5"], a:0, ex:"0.5 mol × 6.022×10²³ = 3.011×10²³ formula units."},
        {u:"u5", q:"A compound is 40% carbon, 6.7% hydrogen, and 53.3% oxygen by mass. This kind of data is used to calculate its...", c:["Molar mass directly","Empirical formula","Isotope ratio","Ionization energy"], a:1, ex:"Percent composition converts to a mole ratio, which reduces to the empirical formula."},
        {u:"u5", q:"What is the molar mass of NaCl (Na = 23 g/mol, Cl = 35.5 g/mol)?", c:["23 g/mol","35.5 g/mol","58.5 g/mol","81.5 g/mol"], a:2, ex:"23 + 35.5 = 58.5 g/mol."},
        {u:"u5", q:"What is the molar mass of CaCO3 (Ca = 40, C = 12, O = 16 g/mol)?", c:["68 g/mol","84 g/mol","100 g/mol","116 g/mol"], a:2, ex:"40 + 12 + (16 × 3) = 40 + 12 + 48 = 100 g/mol."},
        {u:"u5", q:"What is the molar mass of glucose, C6H12O6 (C = 12, H = 1, O = 16 g/mol)?", c:["120 g/mol","150 g/mol","180 g/mol","192 g/mol"], a:2, ex:"6(12) + 12(1) + 6(16) = 72 + 12 + 96 = 180 g/mol."},
        {u:"u5", q:"How many moles are in 36 grams of water (molar mass 18 g/mol)?", c:["0.5 mol","1 mol","2 mol","18 mol"], a:2, ex:"36 g ÷ 18 g/mol = 2 mol."},
        {u:"u5", q:"How many grams are in 3 moles of NaCl (molar mass 58.5 g/mol)?", c:["19.5 g","58.5 g","117 g","175.5 g"], a:3, ex:"3 mol × 58.5 g/mol = 175.5 g."},
        {u:"u5", q:"How many atoms are in exactly 1 mole of iron?", c:["1","55.85","6.022 × 10²³","12 × 10²³"], a:2, ex:"One mole of any element always contains Avogadro's number of atoms."},
        {u:"u5", q:"How many moles of carbon atoms are in a sample of 3.011 × 10²³ carbon atoms?", c:["0.5 mol","1 mol","2 mol","3.011 mol"], a:0, ex:"3.011×10²³ ÷ 6.022×10²³ = 0.5 mol."},
        {u:"u5", q:"What percent of CO2's mass (molar mass 44 g/mol) comes from carbon (12 g/mol)?", c:["About 12%","About 27.3%","About 50%","About 72.7%"], a:1, ex:"(12 ÷ 44) × 100% ≈ 27.3%."},
        {u:"u5", q:"What percent of CO2's mass (molar mass 44 g/mol) comes from oxygen (32 g/mol total)?", c:["About 27.3%","About 50%","About 72.7%","About 80%"], a:2, ex:"(32 ÷ 44) × 100% ≈ 72.7%."},
        {u:"u5", q:"A compound's simplest mole ratio of carbon to hydrogen is 1:4. What is its empirical formula?", c:["CH","CH2","CH4","C4H"], a:2, ex:"A 1:4 ratio of C to H atoms gives the empirical formula CH4."},
        {u:"u5", q:"A compound has a mole ratio of iron to oxygen of 2:3. What is its empirical formula?", c:["FeO","Fe2O3","Fe3O2","FeO3"], a:1, ex:"A 2:3 ratio directly becomes the subscripts: Fe2O3."},
        {u:"u5", q:"An empirical formula has a mass of 44 g/mol, and the compound's real molar mass is 88 g/mol. What multiplier turns the empirical formula into the molecular formula?", c:["1","2","3","4"], a:1, ex:"88 ÷ 44 = 2, so every subscript in the empirical formula is doubled."},
        {u:"u5", q:"A compound's empirical formula is NO2 (mass 46 g/mol) and its actual molar mass is 92 g/mol. What is its molecular formula?", c:["NO2","N2O4","N2O2","N4O2"], a:1, ex:"92 ÷ 46 = 2, so doubling NO2 gives N2O4."},
        {u:"u5", q:"In the hydrate formula CuSO4·5H2O, the '5' tells you...", c:["The compound's charge","5 water molecules are built into each formula unit","5 moles of copper are present","5 grams of water are present"], a:1, ex:"Hydrates include a fixed, whole-number ratio of water molecules within their crystal structure."},
        {u:"u5", q:"STP stands for...", c:["Standard Temperature and Pressure","Standard Total Particles","Scientific Testing Procedure","Stoichiometric Transfer Point"], a:0, ex:"STP is a reference condition chemists use so gas measurements can be fairly compared."},
        {u:"u5", q:"What is 'standard temperature' in STP?", c:["25°C","0°C","100°C","37°C"], a:1, ex:"Standard temperature is defined as 0°C, which is 273 K."},
        {u:"u5", q:"What is 'standard pressure' in STP?", c:["1 atm","0 atm","10 atm","100 atm"], a:0, ex:"Standard pressure is defined as 1 atmosphere."},
        {u:"u5", q:"At STP, one mole of any gas occupies approximately...", c:["1 L","6.022 L","22.4 L","44.8 L"], a:2, ex:"22.4 L/mol is the molar volume of an ideal gas at standard temperature and pressure."},
        {u:"u5", q:"How many liters does 2 moles of gas occupy at STP?", c:["11.2 L","22.4 L","44.8 L","67.2 L"], a:2, ex:"2 mol × 22.4 L/mol = 44.8 L."},
        {u:"u5", q:"How many moles does 11.2 L of gas at STP represent?", c:["0.25 mol","0.5 mol","1 mol","2 mol"], a:1, ex:"11.2 L ÷ 22.4 L/mol = 0.5 mol."},
        {u:"u5", q:"In a chemical reaction, the reactant that runs out first, limiting how much product can form, is called the...", c:["Excess reactant","Limiting reactant","Catalyst","Precipitate"], a:1, ex:"Once the limiting reactant is used up, the reaction stops, no matter how much of the other reactant remains."},
        {u:"u5", q:"The reactant left over after a reaction stops — not fully consumed — is called the...", c:["Limiting reactant","Excess reactant","Percent yield","Molar volume"], a:1, ex:"The excess reactant is exactly what's left unused once the limiting reactant runs out."},
        {u:"u5", q:"Percent yield is calculated as...", c:["(Theoretical yield ÷ actual yield) × 100%","(Actual yield ÷ theoretical yield) × 100%","Actual yield − theoretical yield","Theoretical yield × molar mass"], a:1, ex:"Percent yield compares what you actually got in the lab to what the math predicted you should get."},
        {u:"u5", q:"A reaction has a theoretical yield of 50 g and an actual yield of 40 g. What is the percent yield?", c:["10%","50%","80%","125%"], a:2, ex:"(40 ÷ 50) × 100% = 80%."},
        {u:"u5", q:"In a balanced chemical equation, the mole ratio between substances comes directly from their...", c:["Molar masses","Coefficients","Subscripts only","Physical states"], a:1, ex:"A coefficient of 2 in front of a substance means 2 moles of it react or form for every 1 mole of a substance with coefficient 1."},
        {u:"u5", q:"Dimensional analysis (the conversion factor method) is especially useful in mole calculations because it lets you...", c:["Skip units entirely","Cancel units systematically as you convert between grams, moles, and particles","Avoid using molar mass","Only work with whole numbers"], a:1, ex:"Setting up each conversion factor so units cancel is what keeps multi-step mole problems organized and error-free."},
        {u:"u5", q:"For ionic compounds, chemists use the term 'formula unit' instead of...", c:["Mole","Molecule","Atom","Isotope"], a:1, ex:"Ionic compounds don't form true individual molecules — they form a repeating lattice, so 'formula unit' better describes the simplest repeating ratio."},
        {u:"u5", q:"What is the molar mass of oxygen gas, O2 (not a single oxygen atom)?", c:["8 g/mol","16 g/mol","32 g/mol","64 g/mol"], a:2, ex:"Oxygen exists as a diatomic molecule, so its molar mass is double a single oxygen atom's: 2 × 16 = 32 g/mol."},
        {u:"u5", q:"Why do chemists rely on molar mass instead of trying to weigh individual atoms?", c:["Individual atoms are far too small to weigh directly, and molar mass connects the atomic scale to a measurable, lab-scale quantity in grams","Atoms don't actually have mass","Molar mass is only used for gases","It's simply a tradition with no practical reason"], a:0, ex:"The mole and molar mass are exactly what make it possible to measure out a specific number of atoms using an ordinary lab scale."},

        // Resources: Sig Figs & Scientific Notation
        {u:"ures", q:"How many significant figures are in the measurement 0.00450 g?", c:["2","3","5","6"], a:1, ex:"Leading zeros don't count, but the 4, 5, and trailing zero after the decimal all do: 3 sig figs."},
        {u:"ures", q:"Zeros located between two nonzero digits (like the 0 in 205) are...", c:["Never significant","Always significant","Only significant in decimals","Significant only in scientific notation"], a:1, ex:"Captive zeros between nonzero digits always count."},
        {u:"ures", q:"Leading zeros (like in 0.0032) are...", c:["Always significant","Never significant","Significant only in whole numbers","Placeholders that ARE significant"], a:1, ex:"Leading zeros just locate the decimal point — they never count as sig figs."},
        {u:"ures", q:"In scientific notation, a number is written as a coefficient between 1 and 10 multiplied by...", c:["A power of 2","A power of 10","Avogadro's number","The molar mass"], a:1, ex:"Example: 3,400 becomes 3.4 × 10³."},
        {u:"ures", q:"Avogadro's number, 602,200,000,000,000,000,000,000, is written in scientific notation as...", c:["6.022 × 10²⁰","6.022 × 10²³","60.22 × 10²²","6.022 × 10²⁴"], a:1, ex:"Move the decimal point 23 places to get a coefficient between 1 and 10."},
        {u:"ures", q:"When multiplying or dividing measurements, your answer should be rounded to match the measurement with the...", c:["Most decimal places","Fewest significant figures","Largest value","Smallest value"], a:1, ex:"The least-precise measurement limits the precision of the whole calculation."},
        {u:"ures", q:"Trailing zeros in a number WITHOUT a decimal point (like 1500) are generally considered...", c:["Always significant","Ambiguous — usually not counted as significant","Significant only if underlined","Significant only in scientific notation"], a:1, ex:"Without a decimal point or a bar over them, trailing zeros are typically just placeholders, not measured digits."},
        {u:"ures", q:"When adding or subtracting measurements, the answer should be rounded to match the measurement with the...", c:["Fewest significant figures","Fewest decimal places","Most decimal places","Largest value"], a:1, ex:"Addition and subtraction round by decimal places, not total sig figs — unlike multiplication and division."},

        // Unit 6: Mission Review Chemistry (cumulative review across every unit)
        {u:"u6", q:"Which scientist is credited with discovering the neutron in 1932?", c:["J.J. Thomson","Ernest Rutherford","James Chadwick","Niels Bohr"], a:2, ex:"Chadwick's experiments confirmed the existence of a neutral particle in the nucleus, completing the basic picture of atomic structure."},
        {u:"u6", q:"Which subatomic particle is NOT found inside the nucleus?", c:["Proton","Neutron","Electron","Nucleon (proton or neutron)"], a:2, ex:"Electrons occupy the space around the nucleus, not the nucleus itself."},
        {u:"u6", q:"An atom with an equal number of protons and electrons has an overall charge of...", c:["Positive","Negative","Zero (neutral)","It depends on the number of neutrons"], a:2, ex:"Equal positive and negative charges cancel out, leaving the atom electrically neutral — neutrons don't affect charge at all."},
        {u:"u6", q:"'Rare earth elements' is another common name for the...", c:["Alkali metals","Halogens","Lanthanides (and often actinides)","Noble gases"], a:2, ex:"Despite the name, most lanthanides aren't actually rare — they're just difficult to separate from one another chemically."},
        {u:"u6", q:"Even though the nucleus contains almost all of an atom's mass, it takes up only a tiny fraction of the atom's total volume. What mostly determines an atom's overall size?", c:["The number of neutrons","The electron cloud surrounding the nucleus","The atomic mass","The isotope ratio"], a:1, ex:"The nucleus is roughly 10,000 times smaller in diameter than the full electron cloud around it."},
        {u:"u6", q:"In an ordinary chemical reaction (like burning or dissolving), how many protons does an atom typically gain or lose?", c:["Zero — only electrons are involved","One","Two","It depends on the reaction"], a:0, ex:"Chemical reactions only rearrange electrons and bonds; changing the number of protons would mean a nuclear reaction, not a chemical one."},
        {u:"u6", q:"In electron configuration notation like '3p⁴', what does the number '3' represent?", c:["The number of electrons","The sublevel shape","The principal energy level (shell)","The atomic number"], a:2, ex:"The leading number is always the principal quantum number, showing which energy level the electrons occupy."},
        {u:"u6", q:"In electron configuration notation like '3p⁴', what does the letter 'p' represent?", c:["The energy level","The sublevel (orbital shape)","The number of electrons","The spin direction"], a:1, ex:"The letter identifies which sublevel — s, p, d, or f — the electrons occupy."},
        {u:"u6", q:"What determines the specific color of light an excited atom emits?", c:["The atom's total mass","The exact energy gap between two electron energy levels","The number of neutrons present","The atom's temperature alone"], a:1, ex:"Each element's unique set of energy-level gaps produces its own distinct emission colors."},
        {u:"u6", q:"An electron's energy is described as 'quantized,' meaning it can...", c:["Take on any value at all, continuously","Only take specific, fixed values — not anything in between","Never change once an atom forms","Only exist at absolute zero"], a:1, ex:"Electrons jump between discrete energy levels rather than gliding smoothly through every possible energy value."},
        {u:"u6", q:"Which travels with a longer wavelength: visible light or X-rays?", c:["Visible light","X-rays","They're exactly equal","Neither has a wavelength"], a:0, ex:"X-rays sit further along the spectrum toward shorter wavelengths and higher energy than visible light."},
        {u:"u6", q:"Which has a higher frequency: microwaves or ultraviolet light?", c:["Microwaves","Ultraviolet light","They're exactly equal","Frequency doesn't apply to either"], a:1, ex:"Ultraviolet light sits much further toward the high-frequency, high-energy end of the electromagnetic spectrum than microwaves."},
        {u:"u6", q:"Marie Curie is famous for discovering which two radioactive elements?", c:["Uranium and thorium","Polonium and radium","Plutonium and neptunium","Radon and francium"], a:1, ex:"Curie named polonium after her native Poland and coined the term 'radioactivity' itself."},
        {u:"u6", q:"In a nuclear reactor, a 'moderator' (like water or graphite) is used to...", c:["Speed up neutrons as much as possible","Slow down fast neutrons so they're more likely to trigger further fission","Convert fission into fusion","Absorb all neutrons permanently"], a:1, ex:"Slower neutrons are actually more effective at splitting U-235 nuclei, so moderators help sustain a controlled chain reaction."},
        {u:"u6", q:"Why can nuclear power plants run for extended periods on relatively small amounts of fuel, unlike fossil fuel plants?", c:["Nuclear fuel is cheaper to mine","Nuclear reactions release far more energy per unit mass than chemical (burning) reactions","Nuclear plants don't need fuel at all","Nuclear fuel doesn't actually get used up"], a:1, ex:"A small amount of nuclear fuel packs an enormous amount of energy compared to the same mass of coal or oil."},
        {u:"u6", q:"According to Einstein's E = mc², what happens to mass during a nuclear reaction that releases energy?", c:["Mass is created from nothing","A tiny amount of mass converts directly into a large amount of energy","Mass stays perfectly constant","Mass converts into new protons"], a:1, ex:"Even a small amount of mass converts into a huge amount of energy because it's multiplied by the speed of light squared."},
        {u:"u6", q:"Which equation explains why nuclear reactions release dramatically more energy than ordinary chemical reactions?", c:["PV = nRT","c = λν","E = mc²","F = ma"], a:2, ex:"Mass-energy equivalence means even tiny amounts of lost mass in a nuclear reaction convert into massive amounts of energy."},
        {u:"u6", q:"Why does nuclear waste remain hazardous for such a long time?", c:["It's chemically toxic and never decays","Many of its radioactive byproducts have long half-lives and keep decaying for years to millennia","It's actually only dangerous for a few minutes","It stops being radioactive as soon as it leaves the reactor"], a:1, ex:"Some fission byproducts have half-lives of thousands of years, requiring long-term storage solutions."},
        {u:"u6", q:"An electron in a hydrogen atom drops from energy level n = 3 to n = 2. The energy of the photon it releases equals...", c:["The atom's total energy","Exactly the energy difference between levels 3 and 2","Zero, since no energy is released","The energy of level 3 alone"], a:1, ex:"Emitted photons always carry away exactly the energy gap between the electron's starting and ending levels."},
        {u:"u6", q:"Which type of bond involves electrons being essentially transferred from one atom to another rather than shared?", c:["Covalent","Ionic","Hydrogen","Metallic"], a:1, ex:"Ionic bonding results from one atom giving up electrons entirely to another, forming oppositely-charged ions."},
        {u:"u6", q:"An unknown white solid shatters when struck, has a very high melting point, and conducts electricity only when dissolved in water. What type of bonding does it most likely have?", c:["Covalent bonding","Ionic bonding","Metallic bonding","No bonding at all"], a:1, ex:"Brittleness, high melting point, and conductivity only in solution are all classic signs of an ionic compound."},
        {u:"u6", q:"A material is a poor conductor as a solid, has a relatively low melting point, and doesn't dissolve well in water. It most likely is a...", c:["Metallic solid","Ionic solid","Nonpolar covalent (molecular) compound","Radioactive isotope"], a:2, ex:"Low melting point and poor conductivity point to weak intermolecular forces between discrete molecules, not ionic or metallic bonding."},
        {u:"u6", q:"A shiny, bendable material conducts electricity well even as a solid. What kind of bonding best explains this?", c:["Ionic bonding","Covalent bonding","Metallic bonding","Hydrogen bonding"], a:2, ex:"Only metallic bonding's mobile 'sea of electrons' allows conduction in the solid state along with shine and flexibility."},
        {u:"u6", q:"Why do ionic compounds conduct electricity when dissolved in water, but not as solids?", c:["Dissolved ions become free to move and carry charge, while solid ions are locked in a fixed lattice","Solids never conduct electricity under any circumstances","Water adds electrons to the compound","Ionic compounds are never conductive"], a:0, ex:"It's the mobility of the charged particles — not their mere presence — that allows an electric current to flow."},
        {u:"u6", q:"Which type of intermolecular force is present in every molecule, polar or nonpolar?", c:["Hydrogen bonding","Dipole-dipole forces","London dispersion forces","Ionic attraction"], a:2, ex:"London dispersion forces arise from temporary electron shifts that happen in all matter, regardless of polarity."},
        {u:"u6", q:"Ranked from weakest to strongest, how do these common intermolecular forces generally compare?", c:["Hydrogen bonding < dipole-dipole < London dispersion","London dispersion < dipole-dipole < hydrogen bonding","Dipole-dipole < London dispersion < hydrogen bonding","All three are always equal in strength"], a:1, ex:"London dispersion forces are typically weakest, hydrogen bonding is typically the strongest of the three."},
        {u:"u6", q:"A 'polar molecule' has an uneven distribution of...", c:["Mass","Electric charge","Neutrons","Isotopes"], a:1, ex:"Unequal electron sharing plus an asymmetric molecular shape creates regions of partial positive and partial negative charge."},
        {u:"u6", q:"Why is water such an effective solvent for many ionic and polar substances?", c:["It has no intermolecular forces at all","Its polar molecules and hydrogen bonding let it surround and stabilize charged or polar particles","It's a nonpolar molecule","It contains no oxygen"], a:1, ex:"Water's partial charges are attracted to ions and polar molecules, pulling them apart and keeping them dissolved."},
        {u:"u6", q:"Why is the mole sometimes nicknamed 'the chemist's dozen'?", c:["It always equals exactly 12","It's a fixed counting number (6.022 × 10²³) used to conveniently count extremely small particles","It only applies to elements, not compounds","It was invented by a baker"], a:1, ex:"Just like a dozen always means 12 items, a mole always means 6.022 × 10²³ particles, no matter the substance."},
        {u:"u6", q:"If you know a compound's percent composition and its real molar mass, you can determine its...", c:["Atomic number","Molecular formula","Half-life","Ionization energy"], a:1, ex:"Percent composition gives the empirical formula, and comparing molar masses reveals the molecular formula."},
        {u:"u6", q:"A chemist calculates percent composition for a compound and the values add up to only 94%. What does this most likely indicate?", c:["The compound is radioactive","A measurement or calculation error occurred","The compound has no formula","Percent composition doesn't need to total 100%"], a:1, ex:"A correctly calculated percent composition should always total 100% (allowing for small rounding)."},
        {u:"u6", q:"Why must you know a compound's chemical formula before calculating its percent composition?", c:["You don't — formulas are irrelevant to percent composition","The formula tells you exactly how many atoms of each element are present per mole of compound","Percent composition only applies to elements","Chemical formulas are only used for naming"], a:1, ex:"Without knowing the atom counts from the formula, there's no way to know how much mass each element contributes."},
        {u:"u6", q:"Mission: An unknown metal sample is radioactive and emits particles stopped by a single sheet of paper. What type of particle is it most likely emitting?", c:["Beta particles","Gamma rays","Alpha particles","Neutrons"], a:2, ex:"Only alpha particles are weak enough to be blocked by something as thin as paper."},
        {u:"u6", q:"Mission: A shipment of an unknown compound is found to be 43.6% phosphorus and 56.4% oxygen by mass. Figuring out its formula from this data calls on skills from which unit?", c:["Unit 3: Nuclear Chemistry","Unit 4: Atomic Bonding","Unit 5: The Mole","Unit 2: Atomic Theory"], a:2, ex:"Percent composition and empirical formula calculations are core skills from the mole unit."},
        {u:"u6", q:"Mission: An engineer investigating a material failure finds the material has weak intermolecular forces and a low melting point. What kind of substance is this most likely to be?", c:["An ionic solid","A metallic alloy","A nonpolar covalent (molecular) compound","A radioisotope"], a:2, ex:"Weak intermolecular forces and low melting points are hallmarks of simple molecular compounds, not ionic or metallic solids."},
        {u:"u6", q:"Mission: A detector finds radiation that passes through several centimeters of aluminum but is stopped by thick lead. What type of radiation is this most likely?", c:["Alpha radiation","Beta radiation","Gamma radiation","Visible light"], a:2, ex:"Only gamma radiation penetrates deeply enough to pass through aluminum, requiring dense shielding like lead to stop it."},
        {u:"u6", q:"Mission: An investigator wants to identify an unknown element using only its number of protons. Which periodic table value should they check?", c:["Average atomic mass","Mass number","Atomic number","Group number"], a:2, ex:"Atomic number is defined as the number of protons — it's the one value that uniquely identifies an element."},
        {u:"u6", q:"Mission: A chemist needs to confirm two samples are different isotopes of the same element. What must stay the same, and what can differ?", c:["Number of electrons must differ; protons stay the same","Number of protons stays the same; number of neutrons can differ","Number of neutrons stays the same; protons can differ","Both protons and neutrons must be identical"], a:1, ex:"Isotopes share the same atomic number (protons) but differ in mass number because of differing neutron counts."},
        {u:"u6", q:"Mission: A material scientist notices a sample conducts heat and electricity well and can be hammered into thin sheets without breaking. What kind of bonding best explains both properties?", c:["Ionic bonding","Covalent bonding","Metallic bonding","No bonding — it must be a pure element with no bonds"], a:2, ex:"Only metallic bonding's mobile electron sea can explain both high conductivity and malleability at once."},
        {u:"u6", q:"Mission: An unknown gas sample occupies exactly 22.4 L at STP. What can you conclude about the amount of gas present?", c:["It contains exactly 1 gram of gas","It contains exactly 1 mole of gas particles","It contains exactly 1 liter of gas particles","Nothing can be concluded without knowing the gas's identity"], a:1, ex:"22.4 L is defined as the molar volume of any ideal gas at STP, so this volume always corresponds to 1 mole."},
        {u:"u6", q:"Mission: A forensic chemist burns an unknown sample and sees a bright yellow-orange flame. Which element is most likely present?", c:["Copper","Lithium","Sodium","Potassium"], a:2, ex:"Sodium's flame test color is a very distinctive, intense yellow-orange, caused by its specific emission spectrum."},
        {u:"u6", q:"Mission: A radioactive sample has decayed until only 1/4 of the original material remains. How many half-lives have passed?", c:["1","2","3","4"], a:1, ex:"(1/2)² = 1/4, so exactly 2 half-lives have elapsed."},
        {u:"u6", q:"Mission Debrief: Which unit's core skill is converting between mass, number of particles, and moles?", c:["Unit 2: Atomic Theory","Unit 3: Nuclear Chemistry","Unit 4: Atomic Bonding","Unit 5: The Mole"], a:3, ex:"The mole unit builds the bridge between the atomic scale and the measurable, lab-scale quantities chemists actually work with."},
        {u:"u6", q:"X-ray imaging in medicine relies on which part of the electromagnetic spectrum?", c:["Radio waves","Visible light","X-rays","Microwaves"], a:2, ex:"X-rays sit between ultraviolet and gamma rays — energetic enough to pass through soft tissue but be absorbed by denser bone."},
        {u:"u6", q:"A 'missing shipment' investigation gives you a compound's percent composition and asks for its simplest whole-number atom ratio. What are you calculating?", c:["Molecular formula","Empirical formula","Half-life","Lattice energy"], a:1, ex:"Percent composition data converts into a mole ratio, which reduces to the empirical formula — the simplest ratio possible."},
        {u:"u6", q:"Error Analysis: A student writes the formula for sodium chloride as NaCl2. What mistake did they most likely make?", c:["They forgot sodium exists","They didn't correctly balance the +1 sodium charge with the -1 chloride charge","They used the wrong element symbol","There is no mistake — NaCl2 is correct"], a:1, ex:"Na⁺ and Cl⁻ balance in a simple 1:1 ratio; adding a subscript of 2 to chlorine breaks that charge balance."},
        {u:"u6", q:"Error Analysis: A student calculates average atomic mass but forgets to convert percent abundance into decimal form first. What happens to their final answer?", c:["It comes out about 100 times too large","It comes out about 100 times too small","It has no effect on the answer","It becomes negative"], a:0, ex:"Using 75 instead of 0.75, for example, inflates every term in the weighted average by a factor of 100."},
        {u:"u6", q:"Error Analysis: A student's electron configuration for an atom has more total electrons than that atom's atomic number. What went wrong?", c:["Nothing — this is always correct","They added extra electrons beyond what the neutral atom actually has","They forgot protons exist","They used the wrong element's symbol"], a:1, ex:"A neutral atom's total electron count in its configuration must exactly equal its atomic number — no more, no less."},
        {u:"u6", q:"Error Analysis: A student mixes up mass number and atomic number while describing an isotope. What kind of error results?", c:["No real error occurs","Misidentifying the number of protons or neutrons the atom has","The isotope's chemical symbol changes","The atom becomes a different element"], a:1, ex:"Atomic number gives protons; mass number minus atomic number gives neutrons — mixing them up misstates the atom's actual composition."},
        {u:"u6", q:"Why is gamma radiation, in carefully controlled low doses, useful for medical imaging despite being the most penetrating type of radiation?", c:["It never interacts with tissue at all","It can pass through the body to be detected externally, and controlled short exposures limit the biological damage","It's actually the safest form of radiation with no risk","Gamma radiation isn't used in medicine"], a:1, ex:"Its ability to exit the body makes it detectable from outside, and short, controlled doses (like technetium-99m tracers) minimize harm."},
        {u:"u6", q:"Which skill from the bonding unit best explains why table salt dissolves readily in water but vegetable oil does not?", c:["Half-life comparison","Comparing ionic/polar character against water's own polarity and intermolecular forces","Calculating average atomic mass","Balancing nuclear equations"], a:1, ex:"Water's polarity lets it pull apart ionic salt, but it can't effectively interact with oil's nonpolar molecules — 'like dissolves like.'"},
        {u:"u6", q:"A 'Chem Crisis' scenario asks you to calculate how many grams of a substance are needed to supply a specific number of moles for a reaction. Which unit's core skills does this require?", c:["Unit 2: Atomic Theory","Unit 3: Nuclear Chemistry","Unit 4: Atomic Bonding","Unit 5: The Mole"], a:3, ex:"Converting between moles and grams using molar mass is a foundational mole-unit skill."},
        {u:"u6", q:"Which comparison would best help you predict whether two elements will bond ionically or covalently, just from their periodic table positions?", c:["Their exact atomic mass values","Whether they're both metals, both nonmetals, or one of each — and their electronegativity difference","Their discovery dates","Their color as pure elements"], a:1, ex:"Metal + nonmetal pairings with a large electronegativity gap tend to bond ionically; nonmetal + nonmetal pairings tend to bond covalently."},
        {u:"u6", q:"Bromine-80 has an atomic number of 35. How many neutrons does this isotope have?", c:["35","40","45","80"], a:2, ex:"Neutrons = mass number − atomic number = 80 − 35 = 45."},
        {u:"u6", q:"A neutral potassium atom (atomic number 19) has how many protons and how many electrons?", c:["19 protons, 18 electrons","19 protons, 19 electrons","18 protons, 19 electrons","19 protons, 20 electrons"], a:1, ex:"A neutral atom always has equal protons and electrons — both equal to the atomic number here, 19."},
        {u:"u6", q:"Which idea best connects all six units of this course together?", c:["Every unit is entirely unrelated to the others","A substance's atomic-level structure — its particles, energy, and bonding — determines its observable properties and behavior","Only nuclear chemistry matters for real-world applications","Memorizing the periodic table is the only useful skill"], a:1, ex:"From subatomic particles to moles of product, every unit builds toward explaining why matter behaves the way it does."},
        {u:"u6", q:"Why does a shiny metal conduct electricity as a solid, while a salt crystal only conducts once dissolved or melted?", c:["Metals have no electrons at all","Metallic bonding provides a constantly mobile electron sea, while ionic bonding locks ions in a fixed lattice until they're freed by dissolving or melting","Salt crystals are radioactive","Metals are always liquids"], a:1, ex:"Conductivity requires mobile charge carriers — metals always have them, but ionic solids only gain them once the lattice breaks down."},
        {u:"u6", q:"An unknown sample's emission spectrum exactly matches hydrogen's known spectral lines. What can a chemist reasonably conclude?", c:["The sample contains hydrogen","The sample is radioactive","The sample has no electrons","The sample is a noble gas"], a:0, ex:"Because each element's emission spectrum is a unique fingerprint, a matching spectrum strongly indicates a matching element."},
        {u:"u6", q:"What do all forms of radioactive decay — alpha, beta, gamma, positron emission, and electron capture — have in common?", c:["They all increase the nucleus's mass","They all involve an unstable nucleus releasing particles or energy to become more stable","They only occur in laboratory settings","They all produce exactly the same particle"], a:1, ex:"Every decay pathway is the nucleus's way of shedding excess energy or an unfavorable proton-to-neutron ratio to reach greater stability."},
        {u:"u6", q:"A general safety principle for working around radioactive materials is to manage time, distance, and shielding. Reducing exposure 'time' means...", c:["Spending as long as possible near the source","Minimizing how long you're near a radiation source","Only working at night","Ignoring the source entirely"], a:1, ex:"Less time near a radioactive source means less total radiation dose received, regardless of the source's strength."},
        {u:"u6", q:"A general safety principle for working around radioactive materials is to manage time, distance, and shielding. Increasing 'distance' helps because...", c:["Radiation intensity decreases rapidly the farther you are from the source","Distance has no effect on radiation exposure","Radiation only travels in straight lines toward you","Distance only matters for gamma rays"], a:0, ex:"Radiation spreads out and weakens with distance, so standing farther from a source significantly cuts exposure."},
        {u:"u6", q:"Reviewing atomic theory and bonding together: an atom's number of valence electrons directly influences...", c:["Its number of neutrons","How and with what it's likely to bond","Its mass number","Its half-life"], a:1, ex:"Valence electrons are exactly what atoms gain, lose, or share when forming chemical bonds — the link between atomic theory and bonding."}

      // Teaching modules: short concept explanations grouped by lesson, mirroring the real course structure.
      var CHEM_TEACHING = [
        // Unit 1, Lesson 1: The Periodic Table
        {u:"u1", lesson:"Lesson 1: The Periodic Table", title:"Reading the Periodic Table", body:"Each square lists an element's symbol, atomic number, and average atomic mass. The atomic number (top) tells you the number of protons, which is what makes each element unique."},
        {u:"u1", lesson:"Lesson 1: The Periodic Table", title:"Periods (Rows)", body:"A period is a horizontal row. Moving across a period, elements gain one proton and one electron at a time, and their properties gradually shift from metallic to nonmetallic."},
        {u:"u1", lesson:"Lesson 1: The Periodic Table", title:"Groups (Columns)", body:"A group, or family, is a vertical column. Elements in the same group have the same number of valence electrons, giving them similar chemical behavior — sodium and potassium react much alike."},
        {u:"u1", lesson:"Lesson 1: The Periodic Table", title:"Why Organize Elements at All?", body:"The table is organized so an element's position predicts its properties. Once you know where an element sits, you can predict its reactivity, the charge its ions form, and what it will bond with."},
        // Unit 1, Lesson 2: Physical and Chemical Properties of Element Families
        {u:"u1", lesson:"Lesson 2: Element Family Properties", title:"Metals", body:"Metals occupy the left and center of the table. They're shiny, malleable, ductile, and conduct heat and electricity well because their electrons move freely."},
        {u:"u1", lesson:"Lesson 2: Element Family Properties", title:"Nonmetals", body:"Nonmetals sit on the upper right. They're typically dull, brittle as solids, and poor conductors — many exist as gases at room temperature, like oxygen and nitrogen."},
        {u:"u1", lesson:"Lesson 2: Element Family Properties", title:"Metalloids", body:"Metalloids border the zig-zag 'staircase' line (silicon, boron, germanium). They show mixed properties, and many act as semiconductors — which is why silicon is the backbone of computer chips."},
        {u:"u1", lesson:"Lesson 2: Element Family Properties", title:"Family Reactivity Patterns", body:"Alkali metals get more reactive moving down Group 1, while halogens get more reactive moving up Group 17. Both trends trace back to how tightly the nucleus holds the valence electrons."},
        // Unit 1, Lesson 3: History and Development of the Periodic Table
        {u:"u1", lesson:"Lesson 3: History of the Periodic Table", title:"Mendeleev's Table", body:"In 1869, Dmitri Mendeleev arranged known elements by increasing atomic mass into rows and columns of similar properties, leaving blank spaces for undiscovered elements — and correctly predicted their properties."},
        {u:"u1", lesson:"Lesson 3: History of the Periodic Table", title:"Moseley's Correction", body:"In 1913, Henry Moseley used X-ray data to show atomic number, not atomic mass, is the table's true organizing principle — fixing a few elements that were out of order, like tellurium and iodine."},
        {u:"u1", lesson:"Lesson 3: History of the Periodic Table", title:"From Table to Law", body:"Because atomic number determines an element's identity and placement, we call this pattern the Periodic Law: arranged by increasing atomic number, element properties repeat periodically."},
        {u:"u1", lesson:"Lesson 3: History of the Periodic Table", title:"A Living Document", body:"The periodic table keeps growing — new superheavy elements are still synthesized in labs today. Element 118 (Oganesson) completed period 7, and the search for heavier elements continues."},
        // Unit 1, Lesson 4: Structure of Atoms, Ions, and Isotopes
        {u:"u1", lesson:"Lesson 4: Atoms, Ions, and Isotopes", title:"Subatomic Particles", body:"Every atom is built from protons (positive, in the nucleus), neutrons (neutral, in the nucleus), and electrons (negative, surrounding the nucleus). Protons and neutrons make up nearly all of an atom's mass."},
        {u:"u1", lesson:"Lesson 4: Atoms, Ions, and Isotopes", title:"Atomic Number vs. Mass Number", body:"Atomic number equals the number of protons and defines the element. Mass number equals protons plus neutrons, so atoms of the same element can have different mass numbers."},
        {u:"u1", lesson:"Lesson 4: Atoms, Ions, and Isotopes", title:"Isotopes", body:"Isotopes are atoms of the same element with different numbers of neutrons. Carbon-12 and Carbon-14 are both carbon (6 protons) but differ in mass because C-14 carries two extra neutrons."},
        {u:"u1", lesson:"Lesson 4: Atoms, Ions, and Isotopes", title:"Ions: Cations and Anions", body:"An atom becomes an ion when it gains or loses electrons. Losing electrons creates a positive cation; gaining electrons creates a negative anion — the proton count never changes."},
        // Unit 1, Lesson 5: Calculating Average Atomic Mass
        {u:"u1", lesson:"Lesson 5: Average Atomic Mass", title:"Why the Table Shows Decimals", body:"The decimal mass on the table isn't the mass of any single atom — real atoms have whole-number masses. It's a weighted average across all of that element's naturally-occurring isotopes."},
        {u:"u1", lesson:"Lesson 5: Average Atomic Mass", title:"Weighted Average Formula", body:"Multiply each isotope's mass by its percent abundance (as a decimal), then add the results together. A more abundant isotope pulls the average closer to its own mass."},
        {u:"u1", lesson:"Lesson 5: Average Atomic Mass", title:"Worked Example: Chlorine", body:"Chlorine is 75.77% Cl-35 and 24.23% Cl-37. (34.97 × 0.7577) + (36.97 × 0.2423) ≈ 35.45 — matching the mass shown on the periodic table."},
        {u:"u1", lesson:"Lesson 5: Average Atomic Mass", title:"Why Abundance Matters", body:"Average atomic mass leans toward whichever isotope is most common in nature. That's why chlorine's average mass (35.45) sits much closer to 35 than to 37."},

        // Unit 2, Lesson 1: Atomic Models
        {u:"u2", lesson:"Lesson 1: Atomic Models", title:"Dalton's Billiard Ball", body:"John Dalton (1803) proposed atoms are solid, indivisible spheres with no internal parts — the first modern atomic theory, even though atoms actually have internal structure."},
        {u:"u2", lesson:"Lesson 1: Atomic Models", title:"Thomson's Plum Pudding", body:"J.J. Thomson discovered the electron in 1897 and proposed atoms are a positive 'pudding' with negative electrons scattered through it like plums — the first model with subatomic particles."},
        {u:"u2", lesson:"Lesson 1: Atomic Models", title:"Rutherford's Nuclear Model", body:"Rutherford's 1911 gold foil experiment showed most alpha particles passed straight through foil, but a few bounced back sharply — proof of a tiny, dense, positive nucleus surrounded mostly by empty space."},
        {u:"u2", lesson:"Lesson 1: Atomic Models", title:"Bohr's Planetary Model", body:"Niels Bohr (1913) proposed electrons orbit the nucleus in fixed energy levels, like planets around the sun. It explained hydrogen's emission spectrum, though it's now known to be an oversimplification."},
        // Unit 2, Lesson 2: Electromagnetic Spectrum, Wavelength, and Frequency
        {u:"u2", lesson:"Lesson 2: EM Spectrum, Wavelength & Frequency", title:"The Electromagnetic Spectrum", body:"Radio waves, microwaves, visible light, X-rays, and gamma rays are all electromagnetic radiation, differing only in wavelength and frequency. Visible light is just the tiny sliver we can see."},
        {u:"u2", lesson:"Lesson 2: EM Spectrum, Wavelength & Frequency", title:"Wavelength and Frequency", body:"Wavelength (λ) is the distance between wave crests; frequency (ν) is how many crests pass a point each second. They're inversely related — longer wavelength means lower frequency."},
        {u:"u2", lesson:"Lesson 2: EM Spectrum, Wavelength & Frequency", title:"The Speed of Light Equation", body:"c = λν ties wavelength and frequency together through the constant speed of light (3.00 × 10⁸ m/s). Knowing either value lets you solve for the other."},
        {u:"u2", lesson:"Lesson 2: EM Spectrum, Wavelength & Frequency", title:"Energy and Light", body:"Higher-frequency, shorter-wavelength light carries more energy per photon. That's why gamma rays are dangerous and radio waves aren't — it's about how much energy each photon delivers."},
        // Unit 2, Lesson 3: Electron Configuration
        {u:"u2", lesson:"Lesson 3: Electron Configuration", title:"Energy Levels and Sublevels", body:"Electrons fill energy levels (n = 1, 2, 3...), divided into sublevels s, p, d, and f. Each sublevel has a different shape and electron capacity (2, 6, 10, and 14)."},
        {u:"u2", lesson:"Lesson 3: Electron Configuration", title:"The Aufbau Principle", body:"'Aufbau' means 'building up' — electrons fill the lowest-energy orbitals first, giving a predictable order: 1s, 2s, 2p, 3s, 3p, 4s, 3d..."},
        {u:"u2", lesson:"Lesson 3: Electron Configuration", title:"Hund's Rule & Pauli Exclusion", body:"Hund's rule says electrons fill equal-energy orbitals one at a time before pairing up. The Pauli exclusion principle caps each orbital at 2 electrons, spinning in opposite directions."},
        {u:"u2", lesson:"Lesson 3: Electron Configuration", title:"Writing Electron Configurations", body:"A configuration like 1s² 2s² 2p⁴ (oxygen) lists each filled sublevel with its electron count as a superscript. The superscripts should add up to the atomic number."},
        // Unit 2, Lesson 4: Lewis Dot Structures
        {u:"u2", lesson:"Lesson 4: Lewis Dot Structures", title:"What Lewis Structures Show", body:"A Lewis dot structure shows only an atom's valence electrons as dots around its symbol — core electrons aren't shown because they don't participate in bonding."},
        {u:"u2", lesson:"Lesson 4: Lewis Dot Structures", title:"Valence Electrons and Group Number", body:"For main-group elements, valence electron count matches the group number's ones digit — Group 16 (oxygen) has 6, Group 17 (fluorine) has 7."},
        {u:"u2", lesson:"Lesson 4: Lewis Dot Structures", title:"The Octet Rule", body:"Most atoms are most stable with 8 valence electrons, a full outer shell like the noble gases. This drive toward an octet is what motivates atoms to bond."},
        {u:"u2", lesson:"Lesson 4: Lewis Dot Structures", title:"Exceptions to the Octet Rule", body:"Hydrogen and helium are stable with just 2 valence electrons, not 8. Some larger atoms, like sulfur and phosphorus, can also hold more than 8 electrons in special cases."},
        // Unit 2, Lesson 5: Periodic Trends
        {u:"u2", lesson:"Lesson 5: Periodic Trends", title:"Atomic Radius", body:"Atomic radius shrinks left-to-right across a period (more protons pull electrons tighter) and grows top-to-bottom down a group (each row adds a new electron shell)."},
        {u:"u2", lesson:"Lesson 5: Periodic Trends", title:"Ionization Energy", body:"Ionization energy — the energy to remove an electron — increases across a period and decreases down a group. It's hardest to strip an electron from small atoms like fluorine."},
        {u:"u2", lesson:"Lesson 5: Periodic Trends", title:"Electronegativity", body:"Electronegativity measures how strongly an atom pulls on shared electrons. It increases across a period and decreases down a group, making fluorine the most electronegative element."},
        {u:"u2", lesson:"Lesson 5: Periodic Trends", title:"Why the Trends Run Together", body:"Radius, ionization energy, and electronegativity all trace back to effective nuclear charge: more protons pull electrons in harder, shrinking atoms and making electrons harder to remove or share away."},

        // Unit 3, Lesson 1: Introduction to Nuclear Chemistry
        {u:"u3", lesson:"Lesson 1: Introduction to Nuclear Chemistry", title:"Stable vs. Unstable Nuclei", body:"Most nuclei are stable and never change. Nuclei with too many or too few neutrons relative to protons are unstable — they spontaneously break down through radioactive decay."},
        {u:"u3", lesson:"Lesson 1: Introduction to Nuclear Chemistry", title:"The Three Main Types of Decay", body:"Alpha decay ejects a helium nucleus (weak penetration); beta decay ejects a high-speed electron (medium penetration); gamma decay releases pure energy (strongest penetration, no mass)."},
        {u:"u3", lesson:"Lesson 1: Introduction to Nuclear Chemistry", title:"What Makes a Nucleus Unstable", body:"Nuclear stability depends on the neutron-to-proton ratio. Very large nuclei (like uranium) and nuclei with an imbalanced ratio tend to be radioactive."},
        {u:"u3", lesson:"Lesson 1: Introduction to Nuclear Chemistry", title:"Units of Radioactivity", body:"Radioactivity is measured in becquerels or curies (decays per unit time), while biological dose is measured in sieverts. More decays per second means a more intensely radioactive sample."},
        // Unit 3, Lesson 2: Balancing Nuclear Equations
        {u:"u3", lesson:"Lesson 2: Balancing Nuclear Equations", title:"Conservation in Nuclear Equations", body:"A balanced nuclear equation conserves mass number (top numbers sum equally) and atomic number (bottom numbers sum equally) on both sides."},
        {u:"u3", lesson:"Lesson 2: Balancing Nuclear Equations", title:"Alpha Decay Equations", body:"In alpha decay, the nucleus emits a ⁴₂He particle: mass number drops by 4, atomic number drops by 2, shifting the product two spots earlier on the table."},
        {u:"u3", lesson:"Lesson 2: Balancing Nuclear Equations", title:"Beta Decay Equations", body:"In beta-minus decay, a neutron converts to a proton and an emitted electron. Mass number stays the same; atomic number increases by 1."},
        {u:"u3", lesson:"Lesson 2: Balancing Nuclear Equations", title:"Positron Emission & Electron Capture", body:"Some nuclei decay by emitting a positron or capturing an inner electron. Both convert a proton into a neutron, decreasing atomic number by 1 while mass number stays the same."},
        // Unit 3, Lesson 3: Fission and Fusion Reactions
        {u:"u3", lesson:"Lesson 3: Fission and Fusion", title:"Nuclear Fission", body:"Fission splits a large nucleus (like uranium-235) into smaller nuclei plus extra neutrons, releasing huge energy. It's the reaction behind nuclear plants and atomic weapons."},
        {u:"u3", lesson:"Lesson 3: Fission and Fusion", title:"Nuclear Fusion", body:"Fusion combines two light nuclei (like hydrogen isotopes) into a heavier one, releasing even more energy per reaction than fission. It's the reaction that powers the sun."},
        {u:"u3", lesson:"Lesson 3: Fission and Fusion", title:"Chain Reactions", body:"Each split nucleus in fission releases neutrons that can strike other nuclei and trigger more fissions — a chain reaction. Controlling it is exactly what a reactor does."},
        {u:"u3", lesson:"Lesson 3: Fission and Fusion", title:"Why Fusion Is Hard to Harness", body:"Fusion needs extreme temperature and pressure to force repelling, positively-charged nuclei close enough to fuse — easy for the sun, still a major engineering challenge on Earth."},
        // Unit 3, Lesson 4: Applications of Nuclear Chemistry
        {u:"u3", lesson:"Lesson 4: Applications of Nuclear Chemistry", title:"Nuclear Medicine", body:"Tracers like technetium-99m are tracked with imaging to diagnose disease, while high-dose radiation like cobalt-60 targets and destroys cancer cells."},
        {u:"u3", lesson:"Lesson 4: Applications of Nuclear Chemistry", title:"Radiometric Dating", body:"Carbon-14 dating estimates the age of once-living materials from decay since death. Uranium-238 dates much older rocks and minerals."},
        {u:"u3", lesson:"Lesson 4: Applications of Nuclear Chemistry", title:"Nuclear Power", body:"Power plants use controlled fission chain reactions to boil water into steam, spinning turbines to generate electricity without burning fossil fuels — though radioactive waste must be safely stored."},
        {u:"u3", lesson:"Lesson 4: Applications of Nuclear Chemistry", title:"Everyday Radioactivity", body:"Smoke detectors use a tiny amount of americium-241, which emits alpha particles to ionize air and detect smoke — radioactivity shows up in surprisingly ordinary places."},
        // Unit 3, Lesson 5: Nuclear Chemistry Project (applied)
        {u:"u3", lesson:"Lesson 5: Nuclear Chemistry Project", title:"Half-Life in Practice", body:"Half-life is the time for half a sample to decay, and it never changes regardless of sample size. After 3 half-lives, only 1/8 (12.5%) of the original remains."},
        {u:"u3", lesson:"Lesson 5: Nuclear Chemistry Project", title:"Shielding Against Radiation", body:"Alpha particles are stopped by paper or skin; beta needs aluminum or plastic; gamma requires thick lead or concrete. Shielding choice depends on the radiation type."},
        {u:"u3", lesson:"Lesson 5: Nuclear Chemistry Project", title:"Biological Effects of Radiation", body:"Ionizing radiation can damage DNA and cells, so exposure is carefully limited — the same damaging effect makes radiation useful for killing cancer cells in controlled doses."},
        {u:"u3", lesson:"Lesson 5: Nuclear Chemistry Project", title:"Weighing Risks and Benefits", body:"Nuclear applications — power, medicine, dating — balance real benefits against real risks like waste and exposure. Understanding decay, half-life, and radiation type is what lets scientists use radioactivity safely."},

        // Unit 4, Lesson 1: Predicting Bonding
        {u:"u4", lesson:"Lesson 1: Predicting Bonding", title:"Ionic vs. Covalent: The Big Picture", body:"Bond type depends on which atoms are involved: metal + nonmetal typically forms ionic bonds (electron transfer), nonmetal + nonmetal typically forms covalent bonds (electron sharing)."},
        {u:"u4", lesson:"Lesson 1: Predicting Bonding", title:"Using Electronegativity Difference", body:"A small electronegativity difference (0–0.4) is nonpolar covalent, a moderate one (0.4–1.7) is polar covalent, and a large one (1.7+) is ionic."},
        {u:"u4", lesson:"Lesson 1: Predicting Bonding", title:"Metallic Bonding", body:"When metals bond to other metals, valence electrons become delocalized — a mobile 'sea of electrons' that explains why metals conduct electricity and heat so well."},
        {u:"u4", lesson:"Lesson 1: Predicting Bonding", title:"Predicting Properties from Bond Type", body:"Ionic compounds form hard, brittle crystals with high melting points and conduct only when dissolved or melted. Covalent compounds tend to have lower melting points and don't conduct as pure substances."},
        // Unit 4, Lesson 2: Writing and Naming Ionic Compounds
        {u:"u4", lesson:"Lesson 2: Naming Ionic Compounds", title:"The Criss-Cross Method", body:"Criss-cross each ion's charge (ignoring the sign) to become the other ion's subscript, then reduce to the simplest ratio — Mg²⁺ and Cl⁻ give MgCl2."},
        {u:"u4", lesson:"Lesson 2: Naming Ionic Compounds", title:"Naming Simple Ionic Compounds", body:"Name the metal first, then the nonmetal with its ending changed to '-ide' — sodium and chlorine become sodium chloride, with no prefixes needed."},
        {u:"u4", lesson:"Lesson 2: Naming Ionic Compounds", title:"Transition Metals and Roman Numerals", body:"Transition metals like iron and copper can form more than one charge, so a Roman numeral specifies which ion is present — Fe²⁺ is iron(II), Fe³⁺ is iron(III)."},
        {u:"u4", lesson:"Lesson 2: Naming Ionic Compounds", title:"Common Polyatomic Ions", body:"Sulfate (SO4²⁻), nitrate (NO3⁻), carbonate (CO3²⁻), hydroxide (OH⁻), and ammonium (NH4⁺) act as single charged units in formulas, keeping their own name."},
        // Unit 4, Lesson 3: Writing and Naming Covalent Compounds
        {u:"u4", lesson:"Lesson 3: Naming Covalent Compounds", title:"Covalent Naming Prefixes", body:"Covalent names use Greek prefixes for atom count: mono-, di-, tri-, tetra-, penta-, hexa-, hepta-, octa-, nona-, deca-."},
        {u:"u4", lesson:"Lesson 3: Naming Covalent Compounds", title:"The 'Mono' Exception", body:"'Mono-' is skipped for the first element but used for the second if there's only one — carbon monoxide (CO) uses 'mono' just once, for the single oxygen."},
        {u:"u4", lesson:"Lesson 3: Naming Covalent Compounds", title:"Why Covalent Names Need Prefixes", body:"Two nonmetals can combine in more than one ratio — carbon and oxygen form both CO and CO2. Prefixes remove the ambiguity that ionic names don't need."},
        {u:"u4", lesson:"Lesson 3: Naming Covalent Compounds", title:"Covalent vs. Ionic Naming", body:"Ionic names skip prefixes because criss-crossed charges already fix the ratio; covalent names always need prefixes because shared-electron compounds form in multiple ratios."},
        // Unit 4, Lesson 4: Lewis Structures and VSEPR Theory
        {u:"u4", lesson:"Lesson 4: Lewis Structures & VSEPR", title:"Drawing a Lewis Structure", body:"Connect atoms with single bonds, distribute remaining valence electrons as lone pairs to satisfy octets, and add double or triple bonds if an atom is still short of eight electrons."},
        {u:"u4", lesson:"Lesson 4: Lewis Structures & VSEPR", title:"What VSEPR Predicts", body:"VSEPR theory says electron pairs around a central atom — bonding and lone — push as far apart as possible, which determines the molecule's 3D shape."},
        {u:"u4", lesson:"Lesson 4: Lewis Structures & VSEPR", title:"Bonding Pairs vs. Lone Pairs", body:"Lone pairs take up more space than bonding pairs since they aren't stretched between two nuclei, which is why they compress bond angles into bent or pyramidal shapes."},
        {u:"u4", lesson:"Lesson 4: Lewis Structures & VSEPR", title:"Common Molecular Shapes", body:"Linear (2 pairs, CO2), trigonal planar (3 pairs, BF3), tetrahedral (4 pairs, CH4), trigonal pyramidal (3 bonds + 1 lone pair, NH3), and bent (2 bonds + 2 lone pairs, H2O) are the most common shapes."},
        // Unit 4, Lesson 5: Bonding Forces and Properties
        {u:"u4", lesson:"Lesson 5: Bonding Forces & Properties", title:"Intramolecular vs. Intermolecular Forces", body:"Intramolecular forces (ionic, covalent, metallic bonds) hold atoms together within a molecule. Intermolecular forces are weaker attractions between separate molecules that set boiling and melting points."},
        {u:"u4", lesson:"Lesson 5: Bonding Forces & Properties", title:"London Dispersion Forces", body:"London dispersion forces come from temporary shifts in electron distribution. They exist in every molecule and get stronger as molecules get larger, with more electrons."},
        {u:"u4", lesson:"Lesson 5: Bonding Forces & Properties", title:"Dipole-Dipole Forces & Hydrogen Bonding", body:"Polar molecules attract through dipole-dipole forces. Hydrogen bonding is an especially strong dipole-dipole attraction when hydrogen bonds to nitrogen, oxygen, or fluorine."},
        {u:"u4", lesson:"Lesson 5: Bonding Forces & Properties", title:"Connecting Forces to Properties", body:"Stronger intermolecular forces mean higher boiling and melting points. Water (hydrogen bonding) boils far higher than methane (only London dispersion), despite both being small molecules."},

        // Unit 5, Lesson 1: The Mole
        {u:"u5", lesson:"Lesson 1: The Mole", title:"What a Mole Actually Is", body:"A mole is a counting unit, like 'dozen' — except it means 6.022 × 10²³ of something. Chemists use it because atoms and molecules are far too small and numerous to count individually."},
        {u:"u5", lesson:"Lesson 1: The Mole", title:"Why 6.022 × 10²³?", body:"Avogadro's number was defined so that one mole's mass in grams equals its atomic or molecular mass in atomic mass units — the link that makes the mole so useful."},
        {u:"u5", lesson:"Lesson 1: The Mole", title:"Molar Mass", body:"Molar mass is the mass in grams of one mole of a substance, numerically identical to the atomic mass (elements) or the sum of atomic masses (compounds) on the periodic table."},
        {u:"u5", lesson:"Lesson 1: The Mole", title:"The Mole as a Bridge", body:"The mole connects mass (grams), number of particles, and gas volume. Nearly every mole calculation is really just converting between these."},
        // Unit 5, Lesson 2: Calculating Particles using Avogadro's Number
        {u:"u5", lesson:"Lesson 2: Avogadro's Number", title:"Moles to Particles", body:"To convert moles to number of particles, multiply by Avogadro's number (6.022 × 10²³ particles/mol)."},
        {u:"u5", lesson:"Lesson 2: Avogadro's Number", title:"Particles to Moles", body:"To convert particles back to moles, divide by Avogadro's number — the reverse of the mole-to-particle conversion."},
        {u:"u5", lesson:"Lesson 2: Avogadro's Number", title:"Grams to Moles to Particles", body:"Chain conversions together: grams ÷ molar mass = moles, then moles × Avogadro's number = particles, one step at a time."},
        {u:"u5", lesson:"Lesson 2: Avogadro's Number", title:"'Particles' Can Mean Different Things", body:"Depending on the substance, 'particles' might mean atoms, molecules, or formula units — the math is identical, only the label changes."},
        // Unit 5, Lesson 3: Calculating Percent Composition
        {u:"u5", lesson:"Lesson 3: Percent Composition", title:"What Percent Composition Tells You", body:"Percent composition breaks a compound's mass down by element, showing what fraction comes from each — the percentages must add up to 100%."},
        {u:"u5", lesson:"Lesson 3: Percent Composition", title:"Percent Composition Formula", body:"Percent composition = (mass of element in one mole of compound ÷ molar mass of compound) × 100%."},
        {u:"u5", lesson:"Lesson 3: Percent Composition", title:"Worked Example: Water", body:"In H2O (18 g/mol), hydrogen contributes 2 g and oxygen 16 g — about 11.1% hydrogen and 88.9% oxygen by mass."},
        {u:"u5", lesson:"Lesson 3: Percent Composition", title:"Why Percent Composition Matters", body:"It's often measured directly in a lab by breaking a compound apart and weighing the pieces — and it's the starting point for finding an empirical formula from real data."},
        // Unit 5, Lesson 4: Empirical and Molecular Formulas
        {u:"u5", lesson:"Lesson 4: Empirical & Molecular Formulas", title:"Empirical Formula", body:"An empirical formula shows the simplest whole-number ratio of atoms — glucose's molecular formula C6H12O6 reduces to the empirical formula CH2O."},
        {u:"u5", lesson:"Lesson 4: Empirical & Molecular Formulas", title:"From Percent Composition to Empirical Formula", body:"Treat each element's percent as grams, convert to moles, then divide every mole value by the smallest one to get the whole-number ratio."},
        {u:"u5", lesson:"Lesson 4: Empirical & Molecular Formulas", title:"Molecular Formula", body:"A molecular formula shows the actual atom count in one molecule — a whole-number multiple of the empirical formula, found by dividing real molar mass by empirical formula mass."},
        {u:"u5", lesson:"Lesson 4: Empirical & Molecular Formulas", title:"When Empirical and Molecular Match", body:"If the multiplier works out to 1, the two formulas are identical — water's empirical and molecular formulas are both H2O."},

        // Unit 6: Mission Review Chemistry
        {u:"u6", lesson:"Mission 1: What Is This Stuff?", title:"Identifying Substances", body:"This mission uses atomic structure and periodic table clues to identify an unknown substance — practicing how protons, isotopes, and element families combine to identify real materials."},
        {u:"u6", lesson:"Mission 2: The Radiation Report", title:"Applying Nuclear Chemistry", body:"This mission applies nuclear chemistry skills to a real-world radiation scenario — balancing decay equations, identifying particle types, and reasoning about half-life."},
        {u:"u6", lesson:"Mission 3: Material Failure Investigation", title:"Bonding and Properties in Action", body:"This mission uses bonding and molecular structure to explain why a material failed — connecting bond type, intermolecular forces, and molecular shape to real physical properties."},
        {u:"u6", lesson:"Mission 4: The Missing Shipment", title:"Mole Calculations in Action", body:"This mission applies mole, molar mass, and percent composition calculations to track down missing material by the numbers — the same skills used in real inventory and quality-control chemistry."},
        {u:"u6", lesson:"Final Mission: The Chem Crisis", title:"Putting It All Together", body:"The final mission pulls every unit together — atomic structure, atomic theory, nuclear chemistry, bonding, and the mole — into one cumulative scenario, mirroring what the final exam asks you to do."}

        // Unit 1: Foundations of Functions
        {u:"u1", q:"What is the domain of f(x) = √(x-4)?", c:["x ≥ 4","x ≤ 4","x ≥ -4","All real numbers"], a:0, ex:"The expression under a square root must be ≥ 0, so x-4≥0 gives x≥4."},
        {u:"u1", q:"What is the range of f(x) = √(x-4)?", c:["y ≤ 0","y ≥ 0","All real numbers","y ≥ 4"], a:1, ex:"Since √(x-4) is always nonnegative and grows without bound, the range is y≥0."},
        {u:"u1", q:"What is the domain of f(x) = 1/(x-3)?", c:["All real numbers","x ≠ 0","x ≠ 3","x > 3"], a:2, ex:"A rational function is undefined where the denominator equals 0, so x-3≠0 means x≠3."},
        {u:"u1", q:"What is the domain of f(x) = √(9-x²)?", c:["x ≥ 3","-9 ≤ x ≤ 9","x ≤ -3 or x ≥ 3","-3 ≤ x ≤ 3"], a:3, ex:"We need 9-x²≥0, which factors as (3-x)(3+x)≥0, giving -3≤x≤3."},
        {u:"u1", q:"The graph of g(x) = f(x-3)+2 is obtained from f(x) by which transformation?", c:["Shift right 3, up 2","Shift left 3, up 2","Shift right 3, down 2","Shift left 3, down 2"], a:0, ex:"Replacing x with (x-3) shifts the graph right 3 units, and adding 2 outside shifts it up 2 units."},
        {u:"u1", q:"If f(x) = x² and g(x) = (x+5)² - 1, how is g related to f?", c:["Right 5, up 1","Left 5, down 1","Right 5, down 1","Left 5, up 1"], a:1, ex:"Replacing x with (x+5) shifts left 5 units, and subtracting 1 shifts down 1 unit."},
        {u:"u1", q:"Which transformation describes g(x) = -f(x) compared to f(x)?", c:["Reflection over the y-axis","Vertical stretch","Reflection over the x-axis","Horizontal shift"], a:2, ex:"Multiplying the entire function by -1 flips every y-value's sign, reflecting the graph over the x-axis."},
        {u:"u1", q:"Which transformation describes g(x) = f(-x) compared to f(x)?", c:["Reflection over the x-axis","Vertical compression","Horizontal stretch","Reflection over the y-axis"], a:3, ex:"Replacing x with -x reflects the graph across the y-axis, since each point (x,y) maps to (-x,y)."},
        {u:"u1", q:"If g(x) = 3f(x), how does the graph of g compare to f?", c:["Vertical stretch by factor 3","Horizontal stretch by 3","Vertical compression by factor 3","Horizontal compression by 3"], a:0, ex:"Multiplying the output by 3 stretches the graph vertically by a factor of 3."},
        {u:"u1", q:"If g(x) = f(2x), how does the graph of g compare to f?", c:["Vertical stretch by factor 2","Horizontal compression by factor 1/2","Horizontal stretch by factor 2","Vertical compression by factor 1/2"], a:1, ex:"Replacing x with 2x compresses the graph horizontally toward the y-axis by a factor of 1/2."},
        {u:"u1", q:"If g(x) = (1/2)f(x), how does the graph of g compare to f?", c:["Vertical stretch by 2","Horizontal compression by 1/2","Vertical compression by factor 1/2","Horizontal stretch by 2"], a:2, ex:"Multiplying the output by 1/2 compresses the graph vertically, shrinking all y-values toward the x-axis."},
        {u:"u1", q:"If f(x) = |x| is translated right 4 units and reflected over the x-axis, what is the new equation?", c:["g(x) = |x + 4|","g(x) = -|x + 4|","g(x) = |x - 4|","g(x) = -|x - 4|"], a:3, ex:"Shifting right 4 replaces x with (x-4) giving |x-4|; reflecting over the x-axis multiplies by -1, giving g(x) = -|x-4|."},
        {u:"u1", q:"What is the domain of f(x) = √(x+2) / (x-5)?", c:["x ≥ -2 and x ≠ 5","x ≥ -2","x ≠ 5","x > -2 and x < 5"], a:0, ex:"The square root requires x+2≥0 (x≥-2), and the denominator requires x-5≠0 (x≠5), so both conditions apply together."},

        // Unit 2: Linear Functions
        {u:"u2", q:"What is the slope of the line through (2,3) and (6,11)?", c:["1/2","2","8","4"], a:1, ex:"Slope = (y₂-y₁)/(x₂-x₁) = (11-3)/(6-2) = 8/4 = 2."},
        {u:"u2", q:"What is the equation in slope-intercept form of the line with slope -3 passing through (1,4)?", c:["y=-3x-7","y=3x+7","y=-3x+7","y=-3x+1"], a:2, ex:"Using point-slope form y-4=-3(x-1), distribute to get y=-3x+3+4=-3x+7."},
        {u:"u2", q:"In linear regression, what does the correlation coefficient r measure?", c:["The y-intercept of the line","The slope of the line","The sum of squared residuals","The strength and direction of a linear relationship"], a:3, ex:"The correlation coefficient r (between -1 and 1) measures how strong and in what direction two variables are linearly related."},
        {u:"u2", q:"A residual in regression is best described as", c:["The difference between an observed value and the value predicted by the line","The slope of the regression line","The correlation coefficient squared","The x-intercept of the data"], a:0, ex:"A residual = observed y - predicted y, showing how far a data point is from the regression line."},
        {u:"u2", q:"Which point satisfies the system of inequalities y > x+1 and y ≤ -x+4?", c:["(0,0)","(0,3)","(3,0)","(5,5)"], a:1, ex:"Substituting (0,3): 3>0+1 is true and 3≤-0+4 is true, so (0,3) satisfies both inequalities."},
        {u:"u2", q:"When graphing y < 2x - 1, which type of boundary line and shading is used?", c:["Solid line, shade above","Dashed line, shade above","Dashed line, shade below","Solid line, shade below"], a:2, ex:"Since the inequality is strict (<), the boundary line is dashed, and shading goes below the line because y is less than the expression."},
        {u:"u2", q:"Solve the system: x+y+z=6, x-y+z=2, x+y-z=0. What is the value of x?", c:["2","3","0","1"], a:3, ex:"Subtracting the third equation from the first gives 2z=6, so z=3; substituting back and solving the remaining two-variable system gives x=1, y=2."},
        {u:"u2", q:"Using the same system (x+y+z=6, x-y+z=2, x+y-z=0), what is the value of z?", c:["3","1","2","6"], a:0, ex:"Subtracting the third equation from the first eliminates x and y: (x+y+z)-(x+y-z)=6-0 gives 2z=6, so z=3."},
        {u:"u2", q:"What is the graph of f(x) = |x-2| + 3?", c:["A V-shape with vertex at (-2,3), opening upward","A V-shape with vertex at (2,3), opening upward","A V-shape with vertex at (2,-3), opening downward","A V-shape with vertex at (2,3), opening downward"], a:1, ex:"For f(x)=|x-h|+k, the vertex is at (h,k) = (2,3), and since the leading coefficient is positive, it opens upward."},
        {u:"u2", q:"Solve |2x - 4| = 10.", c:["x=3 or x=-7","x=7 only","x=7 or x=-3","x=-7 or x=3"], a:2, ex:"Split into two cases: 2x-4=10 gives x=7, and 2x-4=-10 gives x=-3."},
        {u:"u2", q:"What is the minimum value of f(x) = |x+6| - 5?", c:["-6","5","6","-5"], a:3, ex:"The absolute value term |x+6| has a minimum value of 0 (at x=-6), so f has a minimum value of 0-5=-5."},
        {u:"u2", q:"A company's data shows a linear regression equation ŷ = 2.5x + 10, where x is years of experience and y is salary in thousands. What salary does the model predict for 8 years of experience?", c:["$30,000","$20,000","$32,500","$18,000"], a:0, ex:"Substitute x=8 into ŷ=2.5x+10: ŷ=2.5(8)+10=20+10=30, representing $30,000."},

        // Unit 3: Quadratic and Square Root Functions
        {u:"u3", q:"What is the vertex of y = 2(x-3)² + 5?", c:["(-3,5)","(3,5)","(3,-5)","(-3,-5)"], a:1, ex:"In vertex form y=a(x-h)²+k, the vertex is (h,k) = (3,5)."},
        {u:"u3", q:"Which way does the parabola y = -3(x+1)² - 2 open, and what is its vertex?", c:["Opens upward, vertex (-1,-2)","Opens downward, vertex (1,-2)","Opens downward, vertex (-1,-2)","Opens upward, vertex (1,2)"], a:2, ex:"Since a=-3 is negative, the parabola opens downward; vertex form gives vertex (h,k)=(-1,-2)."},
        {u:"u3", q:"Convert y = x² - 6x + 5 to vertex form.", c:["y=(x-3)²+4","y=(x+3)²-4","y=(x-6)²-4","y=(x-3)²-4"], a:3, ex:"Complete the square: x²-6x+5 = (x²-6x+9)-9+5 = (x-3)²-4."},
        {u:"u3", q:"What are the x-intercepts of y = x² - 6x + 5?", c:["x=1 and x=5","x=-1 and x=-5","x=1 and x=-5","x=6 and x=5"], a:0, ex:"Factoring x²-6x+5=(x-1)(x-5), setting each factor to 0 gives x=1 and x=5."},
        {u:"u3", q:"What is the axis of symmetry of y = 2x² - 8x + 3?", c:["x=-2","x=2","x=4","x=8"], a:1, ex:"The axis of symmetry for y=ax²+bx+c is x=-b/(2a) = -(-8)/(2·2) = 8/4 = 2."},
        {u:"u3", q:"A quadratic function f(x)=x² is translated left 2 units and up 7 units, then stretched vertically by a factor of 3. What is the resulting equation?", c:["g(x)=3(x-2)²+7","g(x)=3(x+2)²-7","g(x)=3(x+2)²+7","g(x)=(x+2)²+21"], a:2, ex:"Shifting left 2 replaces x with (x+2), shifting up 7 adds 7, and stretching vertically by 3 multiplies the squared term by 3, giving g(x)=3(x+2)²+7."},
        {u:"u3", q:"What is the domain of f(x) = √(x-4)+1?", c:["x≥1","x≥-4","All real numbers","x≥4"], a:3, ex:"The expression under the radical must be nonnegative: x-4≥0, so x≥4."},
        {u:"u3", q:"Solve √(x+3) = 5.", c:["x=22","x=2","x=28","x=-22"], a:0, ex:"Square both sides: x+3=25, so x=22. Checking, √(22+3)=√25=5, which is valid."},
        {u:"u3", q:"Solve √(2x+1) = x-1. (Check for extraneous solutions.)", c:["x=0 only","x=4 only","x=0 and x=4","No solution"], a:1, ex:"Squaring gives x²-4x=0, so x=0 or x=4; checking in the original equation, x=0 gives 1=-1 (false, extraneous), while x=4 gives 3=3 (true), so x=4 is the only solution."},
        {u:"u3", q:"If f(x) = 2x+3, what is f⁻¹(x)?", c:["f⁻¹(x)=(x+3)/2","f⁻¹(x)=2x-3","f⁻¹(x)=(x-3)/2","f⁻¹(x)=(3-x)/2"], a:2, ex:"Swap x and y in y=2x+3 to get x=2y+3, then solve for y: y=(x-3)/2."},
        {u:"u3", q:"If f(x) = x² + 1 and g(x) = x - 3, what is f(g(x))?", c:["x²-6x+4","x²+6x+10","x²-3x+1","x²-6x+10"], a:3, ex:"Substitute g(x)=x-3 into f: f(x-3)=(x-3)²+1=x²-6x+9+1=x²-6x+10."},
        {u:"u3", q:"If f(x)=x² (for x≥0) and g(x)=√x, what is true about f and g?", c:["They are inverse functions of each other","They are the same function","f is always greater than g","They have no relationship"], a:0, ex:"Since f(g(x))=(√x)²=x and g(f(x))=√(x²)=x for x≥0, f and g undo each other, making them inverses."},
        {u:"u3", q:"What is the range of f(x) = 2(x-1)² + 4?", c:["y≤4","y≥4","All real numbers","y≥1"], a:1, ex:"Since the parabola opens upward (a=2>0) with vertex (1,4), the minimum y-value is 4, so the range is y≥4."},

        // Unit 4: Quadratic Functions and Polynomials
        {u:"u4", q:"Find the quadratic equation in standard form with roots x=2 and x=-5.", c:["x²-3x-10=0","x²+3x+10=0","x²+3x-10=0","x²-7x+10=0"], a:2, ex:"Using the roots, the factors are (x-2)(x+5); expanding gives x²+3x-10=0."},
        {u:"u4", q:"Find the equation of a quadratic function with vertex (2,-3) that passes through (4,5).", c:["y=2(x-2)²+3","y=3(x-2)²-3","y=2(x+2)²-3","y=2(x-2)²-3"], a:3, ex:"Using vertex form y=a(x-2)²-3 and substituting (4,5): 5=a(4-2)²-3=4a-3, so a=2, giving y=2(x-2)²-3."},
        {u:"u4", q:"Solve x² - 5x + 6 = 0 by factoring.", c:["x=2 or x=3","x=-2 or x=-3","x=1 or x=6","x=2 or x=-3"], a:0, ex:"Factor x²-5x+6 as (x-2)(x-3)=0, giving solutions x=2 and x=3."},
        {u:"u4", q:"Use the quadratic formula to solve 2x² + 3x - 2 = 0.", c:["x=-1/2 or x=2","x=1/2 or x=-2","x=1/2 or x=2","x=-1/2 or x=-2"], a:1, ex:"Using x=(-b±√(b²-4ac))/(2a) with a=2,b=3,c=-2: discriminant=9+16=25, so x=(-3±5)/4, giving x=1/2 or x=-2."},
        {u:"u4", q:"Solve x² + 4 = 0.", c:["x=±4i","x=±2","x=±2i","No real or complex solution"], a:2, ex:"x²=-4, so x=±√(-4)=±2i since √(-4)=√4·√(-1)=2i."},
        {u:"u4", q:"What is the discriminant of x² - 2x + 5 = 0, and what does it indicate about the roots?", c:["16; two real roots","-16; one repeated real root","4; two real roots","-16; two complex roots"], a:3, ex:"Discriminant = b²-4ac = (-2)²-4(1)(5) = 4-20 = -16; since it's negative, the equation has two complex conjugate roots."},
        {u:"u4", q:"Simplify (3+2i) + (5-7i).", c:["8-5i","8+5i","-2+9i","15-14i"], a:0, ex:"Add real parts (3+5=8) and imaginary parts (2i-7i=-5i) separately to get 8-5i."},
        {u:"u4", q:"Multiply (2+3i)(1-4i).", c:["2-5i","14-5i","14+5i","-10-5i"], a:1, ex:"Use FOIL: (2)(1)+(2)(-4i)+(3i)(1)+(3i)(-4i) = 2-8i+3i-12i². Since i²=-1, -12i²=12, giving 14-5i."},
        {u:"u4", q:"Factor the polynomial x³ - 6x² + 11x - 6 completely, given that x=1 is a root.", c:["(x+1)(x-2)(x-3)","(x-1)(x-2)(x+3)","(x-1)(x-2)(x-3)","(x-1)(x+2)(x-3)"], a:2, ex:"Dividing x³-6x²+11x-6 by (x-1) gives x²-5x+6, which factors as (x-2)(x-3), so the full factorization is (x-1)(x-2)(x-3)."},
        {u:"u4", q:"According to the Rational Root Theorem, which of the following is a possible rational root of 2x³ - 3x² - 11x + 6 = 0?", c:["5","4","7","3"], a:3, ex:"The Rational Root Theorem says possible rational roots are ±(factor of constant term)/(factor of leading coefficient) = ±1,2,3,6,1/2,3/2; testing x=3 in the polynomial gives 0, confirming it's an actual root."},
        {u:"u4", q:"Solve the system: y = x² - 1 and y = x + 1.", c:["(2,3) and (-1,0)","(2,3) and (1,0)","(-2,3) and (1,0)","(2,-3) and (-1,0)"], a:0, ex:"Set the equations equal: x²-1=x+1 gives x²-x-2=0, which factors as (x-2)(x+1)=0, so x=2 or x=-1; substituting into y=x+1 gives points (2,3) and (-1,0)."},
        {u:"u4", q:"Solve √(3x+4) = x, checking for extraneous solutions.", c:["x=-1 only","x=4 only","x=4 and x=-1","No solution"], a:1, ex:"Squaring gives x²-3x-4=0, which factors as (x-4)(x+1)=0, so x=4 or x=-1; checking, x=4 gives √16=4 (valid), while x=-1 gives √1=1≠-1 (extraneous), so the only solution is x=4."}
