        // Unit 1: Foundations of Functions
        {u:"u1", t:"Domain", d:"The set of all possible input (x) values for which a function is defined."},
        {u:"u1", t:"Range", d:"The set of all possible output (y) values that a function can produce."},
        {u:"u1", t:"Translation", d:"A transformation that shifts a graph horizontally and/or vertically without changing its shape or size."},
        {u:"u1", t:"Reflection over the x-axis", d:"A transformation where g(x) = -f(x); every point (x,y) on the graph maps to (x,-y)."},
        {u:"u1", t:"Reflection over the y-axis", d:"A transformation where g(x) = f(-x); every point (x,y) on the graph maps to (-x,y)."},
        {u:"u1", t:"Dilation", d:"A transformation that stretches or compresses a graph vertically or horizontally by a scale factor."},
        {u:"u1", t:"Vertical Stretch/Compression", d:"In g(x)=a·f(x), the graph stretches vertically if |a|>1 and compresses if 0<|a|<1."},
        {u:"u1", t:"Horizontal Stretch/Compression", d:"In g(x)=f(bx), the graph compresses horizontally if |b|>1 and stretches if 0<|b|<1."},
        {u:"u1", t:"g(x) = f(x-h)+k", d:"General transformation form where h shifts the graph horizontally and k shifts it vertically."},

        // Unit 2: Linear Functions
        {u:"u2", t:"Slope Formula", d:"The slope between two points (x₁,y₁) and (x₂,y₂) is m = (y₂-y₁)/(x₂-x₁)."},
        {u:"u2", t:"Slope-Intercept Form", d:"A linear equation written as y = mx + b, where m is the slope and b is the y-intercept."},
        {u:"u2", t:"Point-Slope Form", d:"A linear equation written as y - y₁ = m(x - x₁), using a known point (x₁,y₁) and slope m."},
        {u:"u2", t:"Linear Regression", d:"A statistical method that finds the line of best fit for a set of data points, usually written as ŷ = mx + b."},
        {u:"u2", t:"Correlation Coefficient (r)", d:"A value between -1 and 1 that measures the strength and direction of a linear relationship between two variables."},
        {u:"u2", t:"Residual", d:"The difference between an observed data value and the value predicted by the regression line: residual = observed - predicted."},
        {u:"u2", t:"System of Linear Inequalities", d:"Two or more linear inequalities graphed together; the solution is the region where all shaded areas overlap."},
        {u:"u2", t:"3-Variable System of Equations", d:"A set of three equations with three unknowns (x, y, z) solved simultaneously, often using elimination or substitution."},
        {u:"u2", t:"Absolute Value Function", d:"A V-shaped function of the form f(x) = |x-h| + k, with vertex (h,k), where all outputs are nonnegative distances from k."},

        // Unit 3: Quadratic and Square Root Functions
        {u:"u3", t:"Vertex Form", d:"A quadratic function written as y = a(x-h)² + k, where (h,k) is the vertex of the parabola."},
        {u:"u3", t:"Standard Form (Quadratic)", d:"A quadratic function written as y = ax² + bx + c, where a, b, and c are constants and a≠0."},
        {u:"u3", t:"Axis of Symmetry", d:"The vertical line x = -b/(2a) that divides a parabola into two mirror-image halves, passing through the vertex."},
        {u:"u3", t:"Completing the Square", d:"A method for rewriting ax²+bx+c in vertex form by creating a perfect square trinomial."},
        {u:"u3", t:"Square Root Function", d:"A function of the form f(x) = √(x-h) + k whose domain is restricted to values that make the radicand nonnegative."},
        {u:"u3", t:"Extraneous Solution", d:"A solution obtained algebraically (often by squaring both sides) that does not satisfy the original equation and must be rejected."},
        {u:"u3", t:"Inverse Function", d:"A function f⁻¹(x) that reverses the input-output pairs of f(x), so that f(f⁻¹(x)) = x and f⁻¹(f(x)) = x."},
        {u:"u3", t:"Composition of Functions", d:"Combining two functions by substituting one into the other, written f(g(x)), meaning apply g first, then f."},
        {u:"u3", t:"One-to-One Function", d:"A function where every output corresponds to exactly one input; only one-to-one functions have inverse functions."},

        // Unit 4: Quadratic Functions and Polynomials
        {u:"u4", t:"Quadratic Formula", d:"For ax²+bx+c=0, the solutions are x = (-b ± √(b²-4ac)) / (2a)."},
        {u:"u4", t:"Discriminant", d:"The value b²-4ac in the quadratic formula; it tells whether a quadratic has two real roots (positive), one repeated real root (zero), or two complex roots (negative)."},
        {u:"u4", t:"Imaginary Unit i", d:"Defined as i = √(-1), so i² = -1; used to write square roots of negative numbers as complex numbers."},
        {u:"u4", t:"Complex Number", d:"A number of the form a+bi, where a is the real part and b is the imaginary part."},
        {u:"u4", t:"Rational Root Theorem", d:"States that any rational root of a polynomial with integer coefficients must equal ±(factor of the constant term)/(factor of the leading coefficient)."},
        {u:"u4", t:"Factored Form of a Quadratic", d:"A quadratic written as y = a(x-p)(x-q), where p and q are the x-intercepts (roots) of the function."},

        {u:"u1", q:"Which element of art is defined as a mark made by a moving point, used to create edges, outlines, and contours?", c:["Line","Shape","Texture","Value"], a:0, ex:"Line is the element of art created by a moving point and is used to define edges, outlines, and contours in a work."},

        {u:"u1", q:"Which three colors are the primary colors on the traditional color wheel?", c:["Orange, green, violet","Red, orange, yellow","Blue, green, purple","Red, yellow, blue"], a:3, ex:"Red, yellow, and blue are the primary colors; all other colors on the wheel are mixed from them."},
        {u:"u1", q:"Secondary colors such as orange, green, and violet are created by which process?", c:["Mixing two primary colors together","Adding black to a primary color","Mixing two secondary colors together","Adding white to a primary color"], a:0, ex:"Secondary colors are made by mixing two primary colors, for example blue and yellow make green."},

        {u:"u1", q:"Unlike shape, which is two-dimensional, form refers to objects that...?", c:["Have only length and width","Exist only as outlines","Have height, width, and depth","Are entirely flat"], a:2, ex:"Form is three-dimensional, possessing height, width, and depth, unlike a flat, two-dimensional shape."},

        {u:"u1", q:"Artists create the illusion of depth, or space, in a two-dimensional artwork using which technique?", c:["Using a single flat color with no variation","Overlapping objects and varying their size and placement","Removing all texture from the piece","Avoiding contrast entirely"], a:1, ex:"Overlapping shapes and varying size or placement are common ways artists suggest depth on a flat surface."},

        {u:"u4", q:"What does the ! operator do in Java logical expressions?", c:["Combines two boolean expressions with AND","Combines two boolean expressions with OR","Reverses (negates) a boolean value","Compares two values for equality"], a:2, ex:"The ! (NOT) operator flips a boolean value, turning true into false and false into true."},
        {u:"u4", q:"Which Java class is used to generate random numbers?", c:["java.util.Random","java.lang.Math only","java.util.Scanner","java.io.File"], a:0, ex:"The java.util.Random class provides methods for generating pseudo-random numbers in Java."},
        {u:"u4", q:"Using a Random object named rand, which method call generates a random integer from 0 (inclusive) up to but not including 10?", c:["rand.nextInt(10)","rand.nextDouble(10)","rand.nextInt(1, 10)","rand.random(10)"], a:0, ex:"rand.nextInt(10) returns a random int in the range 0 (inclusive) to 10 (exclusive)."}

      var CS1_FLASHCARDS = [
        // Unit 1: Working in Digital Spaces
        {u:"u1", t:"Hardware", d:"The physical, touchable parts of a computer, such as the CPU, keyboard, and monitor."},
        {u:"u1", t:"Software", d:"The programs and instructions that tell computer hardware what to do; it has no physical form."},
        {u:"u1", t:"CPU", d:"Short for Central Processing Unit, the component that executes instructions and performs calculations for a computer."},
        {u:"u1", t:"RAM", d:"Random Access Memory; fast, temporary memory a computer uses to hold data it is actively working with. Its contents are lost when the power turns off."},
        {u:"u1", t:"Copyright", d:"A legal protection that gives the creator of an original work, like software or music, exclusive rights to use and distribute it."},
        {u:"u1", t:"Fair Use", d:"A legal doctrine allowing limited use of copyrighted material without permission, for purposes such as education, commentary, or criticism."},
        {u:"u1", t:"Intellectual Property", d:"Creations of the mind, such as inventions, writings, and designs, that are legally protected from unauthorized use by others."},
        {u:"u1", t:"Phishing", d:"A deceptive technique, often using fake emails or websites, designed to trick someone into revealing sensitive information like passwords."},
        {u:"u1", t:"Malware", d:"Malicious software created to damage, disrupt, or gain unauthorized access to a computer system."},
        {u:"u1", t:"Compiler", d:"A program that translates human-readable source code, such as Java, into a form (like bytecode) that a computer can execute."},

        // Unit 2: Start Programming
        {u:"u2", t:"Flowchart", d:"A diagram that uses shapes and arrows to visually represent the steps and logic of a process or algorithm."},
        {u:"u2", t:"Variable", d:"A named storage location in a program that holds a value, which can often be changed while the program runs."},
        {u:"u2", t:"Data Type", d:"A classification that specifies what kind of value a variable can hold, such as int for whole numbers or double for decimals."},
        {u:"u2", t:"Input", d:"Data that a program receives from an outside source, such as the keyboard, often read in Java using a Scanner object."},
        {u:"u2", t:"Output", d:"Data or information a program displays or sends out, commonly shown in Java using System.out.print or println."},
        {u:"u2", t:"Comment", d:"Text in source code, marked with // or /* */, that is ignored by the compiler and used to explain the code to human readers."},
        {u:"u2", t:"Naming Convention", d:"A standard style for naming variables and methods in a language, such as Java's camelCase convention for variable names."},
        {u:"u2", t:"Conditional Statement", d:"A programming structure, like if, else if, and else, that executes different code depending on whether a condition is true or false."},
        {u:"u2", t:"For Loop", d:"A loop structure used to repeat code a specific, countable number of times, typically controlled by a counter variable."},
        {u:"u2", t:"While Loop", d:"A loop structure that repeats a block of code as long as a given condition remains true."},

        // Unit 3: Math and Methods
        {u:"u3", t:"Method", d:"A named, reusable block of code that performs a specific task and can be called (invoked) from elsewhere in a program."},
        {u:"u3", t:"Return Type", d:"The data type of the value a method sends back to its caller, or void if the method returns nothing."},
        {u:"u3", t:"Void", d:"A special return type in Java indicating that a method performs an action but does not return any value."},
        {u:"u3", t:"Parameter", d:"A variable listed in a method's definition that specifies what kind of data the method expects to receive when called."},
        {u:"u3", t:"Argument", d:"The actual value passed into a method when it is called, which fills in the corresponding parameter."},
        {u:"u3", t:"Scope", d:"The region of a program where a particular variable can be accessed; variables declared inside a method are usually limited to that method."},
        {u:"u3", t:"Method Signature", d:"The combination of a method's name and parameter types, which uniquely identifies it and how it can be called."},
        {u:"u3", t:"Calling a Method", d:"The act of executing a method by writing its name followed by parentheses (and any required arguments) elsewhere in the code."},
        {u:"u3", t:"Return Statement", d:"A statement, written as return value;, that sends a value back to the caller and ends the method's execution."},
        {u:"u3", t:"Code Reuse", d:"The practice of writing a method once and calling it multiple times, avoiding the need to duplicate the same code repeatedly."},

        // Unit 4: Numbers and Operators
        {u:"u4", t:"Arithmetic Operator", d:"A symbol used to perform a math operation on values, such as + (addition), - (subtraction), * (multiplication), / (division), and % (modulus)."},
        {u:"u4", t:"Integer Division", d:"Division between two int values in Java that discards any remainder, so 7 / 2 results in 3, not 3.5."},
        {u:"u4", t:"Modulus Operator (%)", d:"An arithmetic operator that returns the remainder left over after dividing one number by another, such as 7 % 2 equaling 1."},
        {u:"u4", t:"Relational Operator", d:"A symbol, such as ==, !=, <, >, <=, or >=, used to compare two values and produce a true or false result."},
        {u:"u4", t:"Logical AND (&&)", d:"A logical operator that evaluates to true only when both of the boolean expressions it connects are true."},
        {u:"u4", t:"Logical OR (||)", d:"A logical operator that evaluates to true when at least one of the boolean expressions it connects is true."},
        {u:"u4", t:"Logical NOT (!)", d:"A logical operator that reverses a boolean value, turning true into false and false into true."},
        {u:"u4", t:"Truth Table", d:"A table that lists every possible combination of boolean inputs (true/false) and shows the resulting output of a logical expression."},
        {u:"u4", t:"Random Number", d:"A value generated unpredictably within a program, often produced in Java using the java.util.Random class."},
        {u:"u4", t:"Boolean", d:"A data type that can only hold one of two values: true or false, commonly used for conditions and logical operators."}

      var ENG2_QUESTIONS = [
        // Unit 1: Context Wars
        {u:"u1", q:"What term describes the historical and cultural circumstances surrounding a story that shape its meaning?", c:["Setting","Context","Mood","Tone"], a:1, ex:"Context refers to the historical and cultural circumstances that influence how a story was written and should be understood."},
        {u:"u1", q:"A reader notices a character flinch whenever a door slams and concludes the character experienced past trauma. What reading skill is this?", c:["Summarizing","Inferring","Paraphrasing","Skimming"], a:1, ex:"Inferring means using clues in the text, along with prior knowledge, to figure out something the author did not state directly."},
        {u:"u1", q:"The word 'stubborn' and the word 'determined' have similar denotations but different ______.", c:["syntax","connotations","themes","diction levels only in poetry"], a:1, ex:"Connotation is the emotional association a word carries, even when two words share a similar literal (denotative) meaning."},
        {u:"u1", q:"What is the literal, dictionary definition of a word called?", c:["Connotation","Denotation","Inference","Context clue"], a:1, ex:"Denotation is a word's exact, literal dictionary meaning, as opposed to its emotional connotation."},
        {u:"u1", q:"A story told using 'I' and 'me,' where the narrator is a character experiencing the events, uses which point of view?", c:["Third-person omniscient","Second person","First person","Third-person limited"], a:2, ex:"First-person point of view uses pronouns like 'I' and 'me' because the narrator is a participant in the story."},
        {u:"u1", q:"In third-person omniscient point of view, the narrator can do what?", c:["Only describe one character's thoughts","Know the thoughts and feelings of multiple characters","Speak directly to the reader as 'you'","Only report what can be seen, never thoughts"], a:1, ex:"An omniscient narrator has god-like knowledge of every character's inner thoughts and feelings, unlike a limited narrator."},
        {u:"u1", q:"Why is understanding a character's cultural values important for understanding their motivation?", c:["It isn't important; motivation is random","Cultural values often explain why a character wants what they want","Only the author's culture matters, not the character's","Motivation only comes from external conflict"], a:1, ex:"A character's cultural background often shapes their beliefs and priorities, which in turn drive their motivations and choices."},
        {u:"u1", q:"A character struggles internally with guilt over a past decision. This is an example of what kind of conflict?", c:["External conflict","Internal conflict","Situational irony","Rising action"], a:1, ex:"Internal conflict is a struggle that happens within a character's own mind, such as guilt, fear, or a moral dilemma."},
        {u:"u1", q:"A character must survive a storm at sea. This is an example of what kind of conflict?", c:["Internal conflict","External conflict","Dramatic irony","Denotation"], a:1, ex:"External conflict is a struggle between a character and an outside force, such as nature, another character, or society."},
        {u:"u1", q:"In a literary analysis paragraph, a direct quotation or specific detail from the text used to support a claim is called what?", c:["Commentary","Evidence","Thesis","Connotation"], a:1, ex:"Evidence consists of quotations or specific details pulled from the text that support the writer's claim."},
        {u:"u1", q:"What is the term for a writer's explanation of how a piece of evidence supports their argument?", c:["Commentary or analysis","Citation","Paraphrase","Context"], a:0, ex:"Commentary (or analysis) is the writer's own explanation connecting the evidence back to the claim being made."},
        {u:"u1", q:"Comparing a novel's treatment of a theme to a poem's treatment of the same theme is an example of what skill?", c:["Close reading only","Comparing texts across genres","Summarizing","Editing"], a:1, ex:"Comparing texts across genres means examining how different forms, like novels and poems, treat similar themes or ideas differently."},
        {u:"u1", q:"What term describes the reason an author writes a text, such as to persuade, inform, or entertain?", c:["Author's purpose","Theme","Mood","Point of view"], a:0, ex:"Author's purpose is the author's goal in writing a piece, commonly to persuade, inform, entertain, or express feelings."},
        {u:"u1", q:"Two readers walk away from the same short story with different understandings of its message. This demonstrates what concept?", c:["Plagiarism","Reader interpretation","Denotation","Flashback"], a:1, ex:"Reader interpretation recognizes that individual readers can construct different meanings from the same text based on their own experiences."},
        {u:"u1", q:"When a writer reworks a draft's organization, ideas, and word choice before focusing on grammar and spelling, this stage is called what?", c:["Editing","Revising","Publishing","Prewriting"], a:1, ex:"Revising involves improving the content, organization, and clarity of a draft, which typically happens before editing for grammar and mechanics."},
        {u:"u1", q:"Correcting spelling, punctuation, and grammar errors in a draft is called what?", c:["Revising","Drafting","Editing","Brainstorming"], a:2, ex:"Editing focuses on correcting surface-level errors like grammar, spelling, and punctuation, usually after revising."},
        {u:"u1", q:"A word like 'home' often carries a connotation of warmth and comfort beyond its literal meaning of 'a dwelling.' This emotional layer is called the word's ______.", c:["denotation","connotation","synonym","etymology"], a:1, ex:"Connotation is the implied emotional meaning attached to a word beyond its literal, dictionary definition."},
        {u:"u1", q:"Knowing that a story was written during a war can help readers understand a character's fear of loss. This illustrates the importance of what?", c:["Historical and cultural context","Verbal irony","Flashback structure","Stage directions"], a:0, ex:"Understanding the historical and cultural context in which a story was written helps explain characters' attitudes and conflicts."},

        // Unit 2: From Dreamland to Reality (Part A)
        {u:"u2a", q:"What is the term for the part of a story that introduces the characters, setting, and initial situation?", c:["Climax","Exposition","Resolution","Falling action"], a:1, ex:"Exposition is the opening part of a plot that establishes characters, setting, and the basic situation."},
        {u:"u2a", q:"The series of events that build tension and complicate the conflict after the exposition is called what?", c:["Rising action","Resolution","Flashback","Denouement only"], a:0, ex:"Rising action is the sequence of events that develop and intensify the conflict leading up to the climax."},
        {u:"u2a", q:"The turning point of a story, where tension reaches its peak, is called what?", c:["Exposition","Climax","Falling action","Frame story"], a:1, ex:"The climax is the most intense moment of the story, often the turning point that determines the outcome of the conflict."},
        {u:"u2a", q:"The events that occur after the climax, as the story's tension begins to decrease, make up what part of the plot?", c:["Rising action","Exposition","Falling action","Flash-forward"], a:2, ex:"Falling action consists of the events that unfold after the climax as the conflict winds down toward a resolution."},
        {u:"u2a", q:"The part of the plot where the main conflict is finally settled is called what?", c:["Resolution","Rising action","Exposition","Flashback"], a:0, ex:"The resolution (or denouement) is the part of the plot where the central conflict is resolved and loose ends are tied up."},
        {u:"u2a", q:"A scene that interrupts the present action to show an event that happened earlier is called what?", c:["Flash-forward","Flashback","Frame story","Climax"], a:1, ex:"A flashback is a scene that shifts the narrative back in time to show an event that occurred before the current point in the story."},
        {u:"u2a", q:"A scene that jumps ahead to show an event that will happen later in the timeline is called what?", c:["Flashback","Exposition","Flash-forward","Falling action"], a:2, ex:"A flash-forward shifts the narrative ahead in time to show a future event before returning to the main timeline."},
        {u:"u2a", q:"A story structure in which an outer narrative introduces and contains an inner story told by a character is called what?", c:["Frame story","Flashback","Rising action","Resolution"], a:0, ex:"A frame story is a narrative structure where one story 'frames' or encloses another story told within it."},
        {u:"u2a", q:"When a reader closely examines a single scene for how dialogue, setting, and action reveal character or advance plot, this is called what?", c:["Skimming","Scene analysis","Paraphrasing","Editing"], a:1, ex:"Scene analysis is the close examination of a specific scene to understand how its details reveal character, advance plot, or develop theme."},
        {u:"u2a", q:"How do plot, theme, and characterization typically interact in a well-constructed story?", c:["They are unrelated and developed separately","Events in the plot reveal character traits that in turn illustrate the story's theme","Theme only appears in the title","Characterization has no effect on plot"], a:1, ex:"In strong storytelling, plot events reveal characters' traits and choices, and those choices work together to express the story's underlying theme."},
        {u:"u2a", q:"A story set during a strict, traditional historical period might show a character facing more rigid obstacles than a story set in a modern, open society. This shows how what shapes plot and characterization?", c:["Font choice","Cultural and historical setting","Punctuation","Point of view only"], a:1, ex:"The cultural and historical setting of a story influences the obstacles characters face and how they are allowed to behave or grow."},
        {u:"u2a", q:"Writing an essay that explores how the theme of 'identity' appears in both a novel and a film is an example of what kind of writing?", c:["Writing about theme within a single genre only","Writing about themes across genres","Plot summary","Editing for grammar"], a:1, ex:"Writing about themes across genres involves analyzing how the same theme is explored differently across different forms, like novels and films."},

        // Unit 3: From Dreamland to Reality (Part B)
        {u:"u2b", q:"Headings, illustrations, and special formatting within a text are known as what?", c:["Figurative language","Print and graphic features","Literary devices","Connotations"], a:1, ex:"Print and graphic features include elements like headings, illustrations, and formatting that help organize and support a text's meaning."},
        {u:"u2b", q:"What is one main purpose of a heading within a longer text?", c:["To confuse the reader","To signal the topic or organization of the section that follows","To replace the need for paragraphs","To provide the story's theme directly"], a:1, ex:"Headings help readers anticipate and navigate the content of the section that follows, signaling its topic or organization."},
        {u:"u2b", q:"An illustration placed alongside a passage of fiction most often serves what purpose?", c:["To support or add meaning to the surrounding text","To replace the text entirely","To confuse the reader about setting","To indicate a flashback has occurred"], a:0, ex:"Illustrations typically reinforce, clarify, or add visual meaning to the text they accompany."},
        {u:"u2b", q:"An author uses italics to show a character's internal thoughts. This is an example of what?", c:["Text structure","A graphic/print feature used for meaning","Rising action","Connotation"], a:1, ex:"Formatting choices like italics are print features authors use intentionally to signal meaning, such as distinguishing inner thoughts from spoken dialogue."},
        {u:"u2b", q:"A text organized by presenting a problem and then describing attempts to solve it uses what text structure?", c:["Chronological order","Compare and contrast","Problem and solution","Cause and effect"], a:2, ex:"Problem-and-solution is a text structure that presents a problem first and then explores one or more solutions to it."},
        {u:"u2b", q:"A text organized around how one event leads to another outcome uses what text structure?", c:["Cause and effect","Compare and contrast","Problem and solution","Description"], a:0, ex:"Cause-and-effect structure organizes ideas by showing how one event or action (the cause) leads to a result (the effect)."},
        {u:"u2b", q:"Why might an author choose a particular text structure, such as chronological order, for a piece of writing?", c:["Text structure is random and has no connection to purpose","The structure supports the author's purpose, such as making a sequence of events clear","Structure only matters in poetry","All texts must use the same structure"], a:1, ex:"Authors choose a text structure that best supports their purpose, such as using chronological order to make a sequence of events easy to follow."},
        {u:"u2b", q:"In a literary analysis essay, the sentence that states the writer's main argument about the text is called what?", c:["The hook","The thesis statement","The conclusion only","A transition"], a:1, ex:"The thesis statement presents the main argument or claim that the rest of the literary analysis essay will support."},
        {u:"u2b", q:"A well-organized literary analysis essay typically follows what basic structure?", c:["A single long paragraph with no breaks","Introduction, body paragraphs with evidence and analysis, and a conclusion","Only a list of quotations","Random order of ideas"], a:1, ex:"A standard literary analysis essay includes an introduction with a thesis, body paragraphs that develop the argument with evidence and analysis, and a conclusion."},
        {u:"u2b", q:"When a writer reorders paragraphs and strengthens transitions to make an essay easier to follow, they are revising for what?", c:["Spelling","Structure and organization","Font size","Punctuation only"], a:1, ex:"Revising for structure and organization involves reordering or restructuring ideas so the writing flows logically and is easy to follow."},
        {u:"u2b", q:"A writer notices every sentence in a paragraph is short and begins the same way, so they combine some sentences and vary their openings. What are they revising for?", c:["Sentence structure and variety","Theme","Point of view","Author's purpose"], a:0, ex:"Revising for sentence variety means changing sentence length and structure so writing is not repetitive and flows more naturally."},
        {u:"u2b", q:"What is the final step in the writing process, performed after all revisions and edits, before an essay is turned in?", c:["Brainstorming","Drafting","Submission","Prewriting"], a:2, ex:"Submission is the final step in the writing process, completed only after the writer has revised and edited the final draft."},

        // Unit 4: Inside the Character
        {u:"u3", q:"What is the term for a universally recognizable character type that recurs across stories and cultures, such as a wise guide or a clever trickster?", c:["Archetype","Motif","Diction","Foil"], a:0, ex:"An archetype is a universal character type, like the hero or the mentor, that recurs across many stories and cultures."},
        {u:"u3", q:"The archetype of the main character who undertakes a journey and overcomes challenges to achieve a goal is called what?", c:["The mentor","The trickster","The hero","The villain only"], a:2, ex:"The hero archetype is the central character who faces challenges and grows through a journey toward a goal."},
        {u:"u3", q:"The archetype of a wise, experienced character who guides and teaches the hero is called what?", c:["The trickster","The mentor","The everyman","The shapeshifter"], a:1, ex:"The mentor archetype is a wise guide who offers the hero knowledge, training, or advice to help them on their journey."},
        {u:"u3", q:"A clever, mischievous character who uses wit and trickery to disrupt situations, often for their own gain or amusement, represents what archetype?", c:["The hero","The mentor","The trickster","The innocent"], a:2, ex:"The trickster archetype is a mischievous, witty character who uses cunning to disrupt situations or outwit others."},
        {u:"u3", q:"When the audience knows something a character does not, creating tension about what will happen, this is an example of what?", c:["Situational irony","Verbal irony","Dramatic irony","Motif"], a:2, ex:"Dramatic irony occurs when the audience has information that a character in the story does not, creating suspense."},
        {u:"u3", q:"A fire station burns down, which is the opposite of what one would expect. This is an example of what?", c:["Verbal irony","Situational irony","Dramatic irony","Sarcasm"], a:1, ex:"Situational irony occurs when the actual outcome of a situation is the opposite of what was expected."},
        {u:"u3", q:"When a character says one thing but means the opposite, this is an example of what?", c:["Situational irony","Dramatic irony","Verbal irony","Motif"], a:2, ex:"Verbal irony occurs when a speaker says one thing but means something different, often the opposite, from what the words literally state."},
        {u:"u3", q:"A recurring image, symbol, or idea that appears throughout a work and helps develop its theme is called what?", c:["Motif","Archetype","Foil","Diction"], a:0, ex:"A motif is a recurring element, such as an image or idea, that appears throughout a work and reinforces its theme."},
        {u:"u3", q:"Saying 'Oh great, another Monday' in a flat, unenthusiastic tone to mean the opposite is an example of what, which is a biting form of verbal irony?", c:["Motif","Sarcasm","Dramatic irony","Diction"], a:1, ex:"Sarcasm is a sharp or mocking form of verbal irony used to convey contempt or scorn, often by saying the opposite of what is meant."},
        {u:"u3", q:"An author's specific choice of words and level of formality in a piece of writing is called what?", c:["Diction","Mood","Motif","Syntax only"], a:0, ex:"Diction refers to an author's specific word choices, including their level of formality, which shapes the tone and meaning of a text."},
        {u:"u3", q:"The overall emotional atmosphere that a piece of writing creates for the reader is called what?", c:["Voice","Mood","Diction","Archetype"], a:1, ex:"Mood is the emotional atmosphere a text evokes in the reader, often created through setting, diction, and imagery."},
        {u:"u3", q:"The distinctive personality and style that comes through an author's or narrator's writing is called what?", c:["Mood","Motif","Voice","Denotation"], a:2, ex:"Voice is the distinct personality, tone, and style that comes through a writer's or narrator's use of language."},
        {u:"u3", q:"Showing a character's traits through their actions and dialogue rather than directly stating them is called what?", c:["Direct characterization","Indirect characterization","Exposition","Motif"], a:1, ex:"Indirect characterization reveals a character's traits through their actions, speech, thoughts, and interactions rather than stating them outright."},
        {u:"u3", q:"In the short-story writing process, what typically comes immediately after drafting a story?", c:["Publishing","Revising","Prewriting","Brainstorming"], a:1, ex:"After a first draft is complete, writers typically move to revising, where they strengthen content, structure, and language before editing and publishing."},
        {u:"u3", q:"Replacing a vague word like 'walked' with a more vivid word like 'shuffled' or 'sprinted' is an example of what step in the writing process?", c:["Prewriting","Strengthening writing with vivid, precise language","Submitting","Brainstorming"], a:1, ex:"Strengthening writing often involves replacing vague words with vivid, precise language that creates a clearer picture for the reader."},
        {u:"u3", q:"Sharing a final, polished draft of a short story with an audience is called what stage of the writing process?", c:["Publishing","Drafting","Prewriting","Revising"], a:0, ex:"Publishing is the final stage of the writing process, in which a polished piece is shared with its intended audience."},

        // Unit 5: Bring on the Drama
        {u:"u4", q:"A major division of a play, often made up of several scenes, is called what?", c:["An act","An aside","A stanza","A motif"], a:0, ex:"An act is a major division within a play, typically composed of multiple scenes, that organizes the overall dramatic structure."},
        {u:"u4", q:"A smaller unit of action within an act of a play, usually set in one time and place, is called what?", c:["A scene","A soliloquy","A stage direction","A motif"], a:0, ex:"A scene is a smaller unit of action within an act, typically unified by a single time and place."},
        {u:"u4", q:"When a character briefly speaks directly to the audience, sharing a thought that other characters on stage do not hear, this device is called what?", c:["A soliloquy","An aside","Stage directions","A frame story"], a:1, ex:"An aside is a brief remark a character makes directly to the audience that other characters on stage are not meant to hear."},
        {u:"u4", q:"A longer speech in which a character, usually alone on stage, reveals their private thoughts or feelings to the audience is called what?", c:["An aside","A soliloquy","A stage direction","A flashback"], a:1, ex:"A soliloquy is an extended speech, typically delivered when a character is alone on stage, that reveals their inner thoughts to the audience."},
        {u:"u4", q:"Instructions within a script that describe a character's movements, tone, or the setting, rather than spoken dialogue, are called what?", c:["Stage directions","Soliloquies","Asides","Motifs"], a:0, ex:"Stage directions are notes within a script describing how actors should move, speak, or where the action takes place, as opposed to dialogue."},
        {u:"u4", q:"A director's choice about where and how actors move on stage during a scene is called what?", c:["Diction","Blocking","Denotation","An aside"], a:1, ex:"Blocking refers to the staging choices a director makes about where actors stand and move on stage during a performance."},
        {u:"u4", q:"How can lighting and set design choices affect an audience's understanding of a scene?", c:["They have no effect on meaning","They can create mood and emphasize meaning beyond what the dialogue alone conveys","They only matter for musicals","They replace the need for a script"], a:1, ex:"Staging elements like lighting and set design shape mood and can emphasize meaning in ways that go beyond the written dialogue."},
        {u:"u4", q:"The written text of a play, containing dialogue and stage directions that actors and directors bring to life, is called what?", c:["A script","A stanza","An essay","A motif"], a:0, ex:"A script is the written text of a play, including dialogue and stage directions, used by actors and directors to create a performance."},
        {u:"u4", q:"What is a key difference between an aside and a soliloquy?", c:["There is no difference; they are the same device","An aside is a brief remark to the audience while other characters are present, while a soliloquy is a longer speech usually delivered alone on stage","A soliloquy is always written in rhyme","An aside can only happen in comedies"], a:1, ex:"An aside is typically a short comment made to the audience while other characters remain on stage, whereas a soliloquy is a longer speech usually given when a character is alone."},
        {u:"u4", q:"Devices like asides, soliloquies, and stage directions primarily allow a playwright to do what?", c:["Avoid using dialogue entirely","Communicate characters' private thoughts or staging needs directly to the audience or performers","Shorten the play","Remove the need for actors"], a:1, ex:"These dramatic devices let a playwright reveal private thoughts to the audience or give performers the information they need to stage the play."},
        {u:"u4", q:"How do individual scenes typically function within the structure of a complete play, such as a comedy like Shakespeare's A Midsummer Night's Dream?", c:["Each scene is unrelated to the others","Scenes build on one another, each advancing plot or character development toward the play's larger whole","Only the final scene matters","Scenes exist only to introduce new settings"], a:1, ex:"Individual scenes work together to advance plot and character development, with each one contributing to the complete dramatic story."},

        {u:"u1", q:"Why did many states insist on adding the Bill of Rights soon after the Constitution was ratified?", c:["To create a national bank","To immediately abolish slavery nationwide","Anti-Federalists demanded explicit protections for individual liberties","To establish the Supreme Court"], a:2, ex:"Anti-Federalists feared a strong central government could threaten individual liberties, so the first ten amendments were added to guarantee specific rights."},
        {u:"u1", q:"The Fifth Amendment protects citizens from which of the following?", c:["Cruel and unusual punishment","Double jeopardy and forced self-incrimination","Excessive bail","Quartering of soldiers in private homes"], a:1, ex:"The Fifth Amendment prohibits being tried twice for the same crime (double jeopardy) and forced testimony against oneself."},
        {u:"u1", q:"The principle that government derives its authority from the consent of the governed is called what?", c:["Federalism","Separation of powers","Popular sovereignty","Nativism"], a:2, ex:"Popular sovereignty holds that political power ultimately belongs to and is granted by the people."},
        {u:"u1", q:"Federalism refers to which founding principle?", c:["The division of power between national and state governments","Rule by a single political party","Direct, unmediated democracy by referendum only","Concentration of all power in the executive branch"], a:0, ex:"Federalism splits governing authority between a national government and individual state governments."},

        // Unit 2: Growth and Change in the West

        {u:"u2", q:"What was the primary purpose of the Freedmen's Bureau during Reconstruction?", c:["To expand westward settlement","To re-establish former Confederate state governments","To help newly freed African Americans with food, education, jobs, and legal aid","To regulate railroad rates"], a:2, ex:"Congress created the Freedmen's Bureau in 1865 to assist formerly enslaved people transitioning to freedom."},
        {u:"u2", q:"Reconstruction formally came to an end as a result of which event?", c:["The Emancipation Proclamation","The Dred Scott decision","The Homestead Act","The Compromise of 1877"], a:3, ex:"The Compromise of 1877 resolved the disputed 1876 election by withdrawing federal troops from the South, ending Reconstruction."},
        {u:"u2", q:"The Homestead Act of 1862 offered settlers what incentive to move west?", c:["160 acres of free land if they farmed it for five years","Free railroad passage for life","Automatic U.S. citizenship","Land grants reserved only for Civil War veterans"], a:0, ex:"The Homestead Act granted 160-acre plots of public land to settlers who lived on and improved it for five years."},
        {u:"u2", q:"In what year was the First Transcontinental Railroad completed at Promontory Point, Utah?", c:["1865","1877","1869","1890"], a:2, ex:"Crews from the Union Pacific and Central Pacific railroads met at Promontory Point in 1869, linking the East and West by rail."},
        {u:"u2", q:"The belief that the United States was destined to expand its territory across the entire continent is known as what?", c:["Neutrality policy","Labor movement philosophy","States' rights doctrine","Manifest Destiny"], a:3, ex:"Manifest Destiny was the widely held 19th-century belief that American expansion across North America was justified and inevitable."},
        {u:"u2", q:"The Populist (People's) Party of the 1890s primarily represented the interests of which group?", c:["Factory workers in the Northeast","Bankers and industrialists","Farmers burdened by debt, low crop prices, and high railroad rates","Recent urban immigrants"], a:2, ex:"Populists organized to address farmers' economic grievances, including falling crop prices and unfair railroad shipping rates."},
        {u:"u2", q:"Populists supported the free coinage of silver mainly in order to do what?", c:["Strengthen the gold standard","Reduce the national debt","Fund new railroad construction","Inflate the currency and ease farmers' debt burdens"], a:3, ex:"Expanding the money supply through silver coinage would raise prices and make it easier for indebted farmers to repay fixed loans."},
        {u:"u2", q:"What was the main goal of the Dawes Act of 1887?", c:["Breaking up tribal lands into individual allotments to encourage assimilation","Granting immediate statehood to western territories","Establishing new, larger reservations","Banning all buffalo hunting nationwide"], a:0, ex:"The Dawes Act divided communal tribal lands into individual plots, aiming to push Native Americans toward farming and assimilation into white culture."},

        {u:"u2", q:"The near-destruction of buffalo herds in the late 1800s most directly devastated which group's way of life?", c:["Railroad construction crews","Plains Indian tribes who relied on the buffalo for food, clothing, and shelter","Eastern factory workers","Recent European immigrants"], a:1, ex:"Buffalo were central to Plains Indian culture and survival, so their near-extinction undermined tribal independence and traditional life."},

        // Unit 3: The Gilded Age
        {u:"u3", q:"Which immigration processing station in New York Harbor opened in 1892 and became the main entry point for European immigrants?", c:["Angel Island","Ellis Island","Castle Garden","Plymouth Rock"], a:1, ex:"Ellis Island processed millions of mostly European immigrants arriving in the United States starting in 1892."},
        {u:"u3", q:"Hostility or prejudice against immigrants, often favoring native-born citizens, is known as what?", c:["Nativism","Populism","Federalism","Social Darwinism"], a:0, ex:"Nativism describes the belief that native-born citizens are superior to immigrants and should be favored in jobs and policy."},
        {u:"u3", q:"The Chinese Exclusion Act of 1882 did what?", c:["Granted Chinese immigrants automatic citizenship","Banned nearly all Chinese immigration to the United States","Required Chinese immigrants to settle only in California","Provided funding for Chinese-language schools"], a:1, ex:"It was the first major U.S. law to restrict immigration based explicitly on nationality, barring most Chinese laborers from entering."},
        {u:"u3", q:"John D. Rockefeller built Standard Oil into a dominant monopoly primarily through what business strategy?", c:["Vertical integration of oil production","Horizontal integration, buying out competing oil refineries","Government subsidies","Labor union partnerships"], a:1, ex:"Rockefeller used horizontal integration, acquiring or driving out rival refiners, to control the oil refining market."},
        {u:"u3", q:"Andrew Carnegie dominated the steel industry mainly by using which strategy?", c:["Vertical integration, controlling every stage from raw materials to shipping", "Horizontal integration of competing banks","Forming a labor union","Lobbying for high tariffs on foreign steel only"], a:0, ex:"Carnegie's U.S. Steel controlled mines, transportation, and mills, owning each step of steel production to cut costs and boost efficiency."},
        {u:"u3", q:"The idea that businesses should be free to operate with minimal government interference, applying 'survival of the fittest' to economics, is called what?", c:["Social Darwinism","Nativism","Progressivism","Collective bargaining"], a:0, ex:"Social Darwinism applied evolutionary language to justify unregulated competition and the success of wealthy industrialists."},
        {u:"u3", q:"What was the main purpose of the Sherman Antitrust Act of 1890?", c:["To outlaw monopolies and trusts that restrained trade","To create a federal income tax","To establish civil service exams","To regulate immigration quotas"], a:0, ex:"The Sherman Antitrust Act banned monopolistic trusts and business combinations that restricted free competition."},
        {u:"u3", q:"Political 'machines' like Tammany Hall in New York City maintained power mainly by what means?", c:["Winning only fair, scandal-free elections","Trading jobs, favors, and services for votes, often from immigrants","Abolishing the spoils system","Enforcing strict civil service exams for all city jobs"], a:1, ex:"Political machines like Tammany Hall built loyal voting blocs by providing jobs, housing help, and favors, often in exchange for votes, frequently involving graft."},
        {u:"u3", q:"The Pendleton Civil Service Act of 1883 was passed largely in response to what?", c:["The assassination of President Garfield by a disappointed office-seeker","The Haymarket Affair","The Homestead Strike","The sinking of the USS Maine"], a:0, ex:"After Garfield's assassination exposed the dangers of the patronage system, Congress created merit-based civil service exams for federal jobs."},
        {u:"u3", q:"The Knights of Labor and the American Federation of Labor both aimed to do what?", c:["End all immigration to the United States","Improve wages, hours, and working conditions for laborers","Abolish private property","Elect only Populist candidates"], a:1, ex:"Both labor organizations sought better pay, shorter hours, and safer working conditions for workers, though they differed in membership and tactics."},
        {u:"u3", q:"The 1894 Pullman Strike, led by Eugene V. Debs, was ended when what happened?", c:["Pullman agreed to all worker demands","Federal troops were sent in to break the strike","Congress passed a new minimum wage law","Workers won union recognition immediately"], a:1, ex:"President Cleveland sent federal troops to end the Pullman Strike, arguing it obstructed mail delivery, and Debs was jailed."},

        // Unit 4: The Progressive Era Movement
        {u:"u4", q:"The Progressive Era was primarily a response to which conditions?", c:["Problems caused by rapid industrialization, urbanization, and political corruption","The end of the Cold War","A sudden decline in immigration","The abolition of slavery"], a:0, ex:"Progressives sought reforms to address issues like unsafe factories, corrupt politics, and poor urban living conditions caused by industrial growth."},
        {u:"u4", q:"Journalists who exposed corruption and social problems in business and government during the Progressive Era were known as what?", c:["Nativists","Muckrakers","Populists","Abolitionists"], a:1, ex:"Muckrakers investigated and publicized wrongdoing, pushing public opinion toward reform."},
        {u:"u4", q:"Upton Sinclair's novel 'The Jungle' exposed unsanitary conditions in which industry, helping spur new federal regulation?", c:["Textile manufacturing","Meatpacking","Oil refining","Railroad construction"], a:1, ex:"Sinclair's depiction of the meatpacking industry's filthy practices helped lead to the Meat Inspection Act and Pure Food and Drug Act of 1906."},
        {u:"u4", q:"Which muckraker's investigative articles targeted the business practices of Standard Oil?", c:["Jacob Riis","Lincoln Steffens","Ida Tarbell","Ida B. Wells"], a:2, ex:"Ida Tarbell's detailed exposes on Standard Oil's ruthless tactics fueled public support for breaking up monopolies."},
        {u:"u4", q:"The 17th Amendment, ratified in 1913, established what reform?", c:["Direct election of U.S. Senators by popular vote","Women's right to vote","Prohibition of alcohol","An eight-hour workday"], a:0, ex:"Previously chosen by state legislatures, U.S. Senators were, after 1913, elected directly by the voters of their states."},
        {u:"u4", q:"Which Progressive-Era political reforms allowed citizens to propose laws, vote directly on laws, and remove officials from office?", c:["Initiative, referendum, and recall","Checks and balances","Federalism and nativism","Gerrymandering and patronage"], a:0, ex:"The initiative, referendum, and recall gave ordinary citizens more direct control over lawmaking and accountability for officials."},
        {u:"u4", q:"The 19th Amendment, ratified in 1920, accomplished what?", c:["Established prohibition","Guaranteed women the right to vote","Ended child labor nationwide","Created the federal income tax"], a:1, ex:"After decades of activism by suffragists like Susan B. Anthony, Alice Paul, and Carrie Chapman Catt, the 19th Amendment gave women the vote."},
        {u:"u4", q:"Jane Addams's Hull House in Chicago was an example of what kind of Progressive reform?", c:["A settlement house providing aid and education to poor urban immigrants","A federal regulatory agency","A political machine","A labor union headquarters"], a:0, ex:"Hull House offered childcare, education, and social services to immigrant and working-class families in Chicago's slums."},
        {u:"u4", q:"The 18th Amendment, which took effect in 1919, established what?", c:["National prohibition of alcoholic beverages","Women's suffrage","Direct election of senators","An income tax"], a:0, ex:"Driven by temperance groups like the Anti-Saloon League and WCTU, the 18th Amendment banned the manufacture and sale of alcohol."},
        {u:"u4", q:"The NAACP, founded in 1909, was established to pursue what goal?", c:["Promoting prohibition","Advancing civil rights and fighting racial discrimination against African Americans","Restricting immigration","Organizing factory workers into unions"], a:1, ex:"The National Association for the Advancement of Colored People, co-founded by W.E.B. Du Bois among others, fought segregation and racial violence through legal action and advocacy."},
        {u:"u4", q:"Compared to Booker T. Washington's approach, W.E.B. Du Bois generally argued that African Americans should pursue what strategy?", c:["Immediate, full civil and political rights and higher education","Vocational training and gradual economic progress only","Emigration back to Africa","Avoiding political activism entirely"], a:0, ex:"Du Bois pushed for immediate civil rights and liberal arts education, contrasting with Washington's more gradual, vocational-training approach."},

        // Unit 5: American Imperialism
        {u:"u5", q:"Which of the following was a major economic motive for American imperialism in the late 1800s?", c:["The need for new overseas markets to sell surplus goods","A desire to end capitalism","A plan to abolish the U.S. Navy","Opposition to all foreign trade"], a:0, ex:"Industrial growth created surplus goods, pushing American businesses and policymakers to seek new overseas markets."},
        {u:"u5", q:"Alfred Thayer Mahan's writings on the importance of naval power most directly encouraged what?", c:["American isolationism","U.S. withdrawal from world affairs","The buildup of a strong U.S. navy and the acquisition of overseas bases","The abolition of the merchant marine"], a:2, ex:"Mahan argued sea power was essential to national greatness, influencing U.S. leaders to expand the navy and seek strategic island bases."},
        {u:"u5", q:"'Yellow journalism' practiced by publishers like Hearst and Pulitzer contributed to the outbreak of the Spanish-American War by doing what?", c:["Providing calm, factual reporting that discouraged war","Sensationalizing Spanish atrocities in Cuba to stir public outrage","Supporting Spain's colonial policies","Focusing only on domestic economic news"], a:1, ex:"Sensationalized, exaggerated newspaper coverage of Spanish actions in Cuba inflamed American public opinion in favor of war."},
        {u:"u5", q:"The explosion and sinking of which U.S. ship in Havana Harbor in February 1898 helped push the United States toward war with Spain?", c:["USS Arizona","USS Maine","USS Missouri","USS Constitution"], a:1, ex:"The USS Maine's sinking, widely but inaccurately blamed on Spain at the time, became a rallying cry ('Remember the Maine') for war."},
        {u:"u5", q:"The Teller Amendment of 1898 stated that the United States would do what regarding Cuba?", c:["Annex Cuba permanently","Not annex Cuba and would leave it independent after the war","Grant Cuba immediate statehood","Place Cuba under direct military rule indefinitely"], a:1, ex:"The Teller Amendment promised Cuban independence rather than permanent U.S. annexation once Spain was defeated."},
        {u:"u5", q:"Under the Treaty of Paris (1898) ending the Spanish-American War, the United States gained control of which territories?", c:["Canada and Mexico","The Philippines, Guam, and Puerto Rico","Hawaii and Alaska","Panama and Nicaragua"], a:1, ex:"Spain ceded the Philippines, Guam, and Puerto Rico to the United States and relinquished control of Cuba under the treaty."},
        {u:"u5", q:"The Philippine-American War (1899-1902) was fought between U.S. forces and Filipino nationalists led by whom?", c:["Jose Rizal","Emilio Aguinaldo","Porfirio Diaz","Sun Yat-sen"], a:1, ex:"Emilio Aguinaldo led Filipino resistance seeking independence after the U.S. chose to retain control of the islands rather than grant immediate freedom."},
        {u:"u5", q:"The Platt Amendment of 1901 did what regarding Cuba?", c:["Granted Cuba full, unrestricted independence","Limited Cuban sovereignty and allowed U.S. military intervention, including a naval base at Guantanamo Bay","Annexed Cuba outright as a U.S. territory","Ended all U.S. involvement in Cuban affairs"], a:1, ex:"The Platt Amendment restricted Cuban foreign policy and preserved the U.S. right to intervene militarily, while securing the Guantanamo Bay naval base."},
        {u:"u5", q:"Secretary of State John Hay's Open Door Policy (1899) aimed to achieve what in China?", c:["Exclusive U.S. control over Chinese territory","Equal trading access for all nations in China, preventing any one power from dominating","China's complete isolation from foreign trade","A military alliance between the U.S. and China"], a:1, ex:"The Open Door Policy sought to ensure all nations, including the U.S., had equal commercial access to China rather than letting one power monopolize trade there."},
        {u:"u5", q:"The Roosevelt Corollary (1904) to the Monroe Doctrine asserted that the United States had the right to do what?", c:["Withdraw entirely from Latin American affairs","Intervene militarily in Latin American nations to maintain stability and protect U.S. interests","Annex all of Central America","Transfer the Panama Canal to European control"], a:1, ex:"Roosevelt's corollary expanded the Monroe Doctrine, claiming the U.S. could intervene in Latin American countries' internal affairs to preempt European intervention."},
        {u:"u5", q:"The construction of the Panama Canal, completed in 1914, was significant mainly because it did what?", c:["Connected the Atlantic and Pacific Oceans, dramatically shortening sea travel between them","Created a new source of immigration to the U.S.","Ended U.S. involvement in Latin America","Replaced the transcontinental railroad"], a:0, ex:"The Panama Canal allowed ships to pass between the Atlantic and Pacific without sailing around South America, boosting U.S. trade and naval power."},

        // Unit 6: World War I
        {u:"u6", q:"Which acronym summarizes the long-term causes of World War I in Europe: militarism, alliances, imperialism, and nationalism?", c:["MAIN","NATO","MAD","AXIS"], a:0, ex:"Historians often use MAIN (Militarism, Alliances, Imperialism, Nationalism) to summarize the underlying causes that made Europe ripe for a major war."},
        {u:"u6", q:"What event directly triggered the outbreak of World War I in the summer of 1914?", c:["The sinking of the Lusitania","The assassination of Archduke Franz Ferdinand of Austria-Hungary","The Zimmermann Telegram","The Treaty of Versailles"], a:1, ex:"Franz Ferdinand's assassination by Serbian nationalist Gavrilo Princip set off a chain of alliance obligations that escalated into full-scale war."},
        {u:"u6", q:"Which event most directly pushed American public opinion toward entering World War I in 1917?", c:["The Boston Tea Party","Germany's unrestricted submarine warfare and the Zimmermann Telegram","The Louisiana Purchase","The Spanish-American War"], a:1, ex:"Renewed German U-boat attacks on neutral shipping and the intercepted Zimmermann Telegram, proposing a German-Mexican alliance against the U.S., pushed America toward war."},
        {u:"u6", q:"On the homefront during World War I, the Espionage and Sedition Acts primarily did what?", c:["Expanded freedom of the press","Restricted speech and dissent against the war effort","Guaranteed women's suffrage","Abolished the military draft"], a:1, ex:"These wartime laws criminalized criticism of the government, the military, or the war effort, limiting civil liberties."},
        {u:"u6", q:"The American Expeditionary Force sent to fight in Europe during World War I was commanded by which general?", c:["Douglas MacArthur","Dwight Eisenhower","John J. Pershing","George Patton"], a:2, ex:"General John J. Pershing led the American Expeditionary Force in Europe starting in 1917."},
        {u:"u6", q:"World War I battlefields were characterized primarily by what style of warfare?", c:["Fast-moving cavalry charges only","Trench warfare with machine guns, poison gas, and artillery","Naval blockades with no land combat","Guerrilla warfare in jungles"], a:1, ex:"Trench warfare, with soldiers dug into opposing lines facing machine guns, poison gas, and artillery, defined much of the Western Front."},
        {u:"u6", q:"The armistice ending the fighting in World War I was signed on what date?", c:["July 4, 1917","November 11, 1918","December 7, 1918","June 28, 1919"], a:1, ex:"Fighting ended on November 11, 1918, often called Armistice Day."},
        {u:"u6", q:"The Treaty of Versailles (1919) placed heavy blame and reparations on which nation for causing World War I?", c:["France","Great Britain","Germany","Russia"], a:2, ex:"The treaty's 'war guilt clause' held Germany responsible for the war and required massive reparations payments."},
        {u:"u6", q:"President Woodrow Wilson proposed the League of Nations as part of his plan for peace, but the U.S. Senate ultimately did what?", c:["Approved it unanimously","Rejected joining the League of Nations","Required all other nations to join first","Dissolved the League entirely"], a:1, ex:"Concerns, led by Senator Henry Cabot Lodge, over the League's collective security provisions caused the Senate to reject the Treaty of Versailles, and the U.S. never joined the League of Nations."},
        {u:"u6", q:"Woodrow Wilson's Fourteen Points were primarily intended to do what?", c:["Justify continued U.S. neutrality","Outline a vision for a just and lasting peace after World War I","Establish new colonies for the United States","Declare war on Germany"], a:1, ex:"Wilson's Fourteen Points proposed principles like self-determination and the League of Nations to prevent future wars and build a lasting peace."},

        // Unit 7: The Roaring 20s
        {u:"u7", q:"The economic boom of the 1920s was fueled in large part by which innovation in manufacturing?", c:["The assembly line, pioneered by Henry Ford for mass production","Hand-crafted artisan production","The abolition of factories","A return to agricultural-based economy"], a:0, ex:"Ford's moving assembly line dramatically lowered production costs and time, making consumer goods like the Model T affordable to more Americans."},
        {u:"u7", q:"Buying stocks or goods 'on margin' in the 1920s meant what?", c:["Paying the full price immediately in cash","Purchasing with only a small down payment and borrowed money","Only buying government bonds","Avoiding all forms of credit"], a:1, ex:"Buying on margin let investors put down a small fraction of a stock's price and borrow the rest, amplifying both gains and risks."},
        {u:"u7", q:"President Harding's call for a 'return to normalcy' reflected what general approach to government in the 1920s?", c:["Expanding government regulation of business","Pro-business, laissez-faire policies with limited government intervention","Nationalizing major industries","Imposing strict wage and price controls"], a:1, ex:"Harding and his Republican successors favored minimal government interference in the economy, low taxes, and support for business growth."},
        {u:"u7", q:"The Teapot Dome scandal during the Harding administration involved what?", c:["Illegal alcohol sales by federal agents","Bribery related to leasing federal oil reserves to private companies","Voter fraud in a presidential election","Embezzlement from the Social Security fund"], a:1, ex:"Interior Secretary Albert Fall secretly leased government oil reserves in exchange for bribes, becoming one of the era's biggest political scandals."},
        {u:"u7", q:"The Red Scare of 1919-1920 reflected widespread American fear of what?", c:["Foreign invasion by European monarchies","The spread of communism and radical political movements","A return of slavery","Climate change"], a:1, ex:"Fear that communist revolution, like Russia's in 1917, might spread to the U.S. led to raids, arrests, and deportations of suspected radicals."},
        {u:"u7", q:"The National Origins Act of 1924 primarily did what?", c:["Abolished all immigration restrictions","Set strict quotas favoring immigrants from northern and western Europe while sharply limiting others","Opened U.S. borders to unlimited immigration from Asia","Granted automatic citizenship to all immigrants"], a:1, ex:"The law established national quotas that heavily favored northern and western European immigrants while severely restricting immigration from other regions."},
        {u:"u7", q:"Prohibition, enforced under the 18th Amendment, had the unintended effect of doing what?", c:["Eliminating alcohol consumption nationwide","Fueling organized crime and bootlegging, as exemplified by figures like Al Capone","Increasing government tax revenue from alcohol sales","Ending the temperance movement"], a:1, ex:"Banning alcohol created a lucrative black market, empowering organized crime figures who illegally produced and sold liquor."},
        {u:"u7", q:"The 1925 Scopes Trial centered on a conflict over what issue?", c:["Teaching evolution in public schools","Women's right to vote","Prohibition enforcement","Labor union rights"], a:0, ex:"John Scopes was tried for teaching evolution in violation of Tennessee law, highlighting tensions between modern science and traditional religious beliefs."},
        {u:"u7", q:"The Harlem Renaissance of the 1920s was marked by a flourishing of what?", c:["Agricultural innovation","African American art, literature, and music, including jazz","European immigration","Labor strikes"], a:1, ex:"Writers like Langston Hughes and musicians like Louis Armstrong led a vibrant cultural movement celebrating Black identity and creativity, centered in Harlem."},
        {u:"u7", q:"The term 'flapper' in the 1920s referred to what?", c:["A type of factory machine","A young woman who embraced new fashions, freedoms, and social behaviors","A Prohibition enforcement agent","A rural farming cooperative"], a:1, ex:"Flappers symbolized changing gender roles in the 1920s, with bobbed hair, shorter skirts, and more independent, public social lives."},

        // Unit 8: The Great Depression
        {u:"u8", q:"The stock market crash that helped trigger the Great Depression occurred in what month and year?", c:["October 1929","March 1933","June 1928","December 1930"], a:0, ex:"The crash, including 'Black Tuesday' on October 29, 1929, wiped out enormous amounts of investor wealth and shook confidence in the economy."},
        {u:"u8", q:"Which practice, in which investors bought stock with borrowed money and only a small cash down payment, worsened the stock market crash?", c:["Buying on margin","Deficit spending","Protective tariffs","Direct taxation"], a:0, ex:"When stock prices fell, investors who had bought on margin could not repay their loans, forcing panicked selling that deepened the crash."},
        {u:"u8", q:"The Smoot-Hawley Tariff of 1930 worsened the Great Depression mainly by doing what?", c:["Lowering prices on imported goods","Raising tariffs so high that international trade collapsed, hurting the global economy","Eliminating all taxes on businesses","Increasing immigration from Europe"], a:1, ex:"Smoot-Hawley raised tariffs to historic highs, prompting retaliatory tariffs abroad and sharply reducing international trade, deepening the global downturn."},

      // ---------- helpers ----------
      function shuffle(arr){
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function unitLabel(id){
        if (!currentCourse) return id;
        for (var i=0;i<currentCourse.units.length;i++){ if (currentCourse.units[i].id===id) return currentCourse.units[i].label; }
        return id;
      }
      function unitColorFor(id){
        if (!currentCourse) return "var(--accent)";
        if (currentCourse.slug === "chemistry") return "var(--" + id + ")";
        var unit = currentCourse.units.filter(function(u){ return u.id === id; })[0];
        if (!unit) return "var(--accent)";
        return "var(--p" + ((unit.num - 1) % 9) + ")";
      }

            var willBeActive = !activeUnits[u.id];
            // prevent deselecting the last active chip
            var activeCount = currentCourse.units.filter(function(x){return activeUnits[x.id];}).length;
            if (!willBeActive && activeCount <= 1) return;
            activeUnits[u.id] = willBeActive;

            onUnitsChanged();

          chipRow.appendChild(chip);
